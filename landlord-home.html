<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>CMWebs 房東首頁</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="frontend-release.js"></script>

  <style>
    :root {
      --app-height: 100vh;
      --nav-height: 64px;
      --primary: #06c755;
      --primary-dark: #05a948;
      --primary-soft: #effcf4;
      --page-bg: #f4f6fa;
      --card-bg: #ffffff;
      --text-main: #171a1f;
      --text-muted: #747b85;
      --border: #e7ebf0;
      --danger: #e5484d;
      --danger-soft: #fff1f2;
      --warning: #e69b00;
      --warning-soft: #fff7df;
      --blue: #246bfd;
      --blue-soft: #eef4ff;
      --purple: #7c3aed;
      --purple-soft: #f4efff;
      --shadow: 0 7px 24px rgba(30, 40, 60, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text-main);
      font-family:
        Arial,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: var(--app-height);
      margin: 0 auto;
      overflow: hidden;
      background: var(--page-bg);
    }

    .page {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        18px
        16px
        calc(var(--nav-height) + 28px + env(safe-area-inset-bottom));
    }

    .card {
      margin-bottom: 14px;
      border: 1px solid rgba(231, 235, 240, 0.92);
      border-radius: 18px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .dashboard-page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin: 3px 2px 16px;
    }

    .dashboard-brand {
      margin-bottom: 7px;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .dashboard-page-title {
      margin: 0;
      color: var(--text-main);
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .dashboard-updated {
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .dashboard-page-header .refresh-button {
      border-color: var(--border);
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 0 5px 16px rgba(30, 40, 60, 0.08);
    }

    .dashboard-summary-card {
      padding: 17px;
    }

    .dashboard-section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dashboard-section-title {
      color: var(--text-main);
      font-size: 17px;
      font-weight: 900;
    }

    .dashboard-section-subtitle {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .dashboard-kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .dashboard-kpi {
      min-width: 0;
      padding: 10px 7px 11px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fbfcfd;
      text-align: center;
    }

    .dashboard-kpi-label {
      overflow: hidden;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-kpi-value {
      margin-top: 5px;
      overflow: visible;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.2px;
      text-overflow: clip;
      white-space: nowrap;
    }

    .dashboard-kpi-value.green {
      color: var(--primary-dark);
    }

    .dashboard-kpi-value.danger {
      color: var(--danger);
    }

    .dashboard-kpi-value.blue {
      color: var(--blue);
    }

    .dashboard-kpi-rate {
      color: var(--blue);
    }

    .dashboard-collection-bar {
      margin-top: 15px;
    }

    .dashboard-collection-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf0f3;
    }

    .dashboard-collection-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 0.35s ease;
    }

    .dashboard-collection-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .dashboard-collection-labels strong {
      color: var(--text-main);
      font-weight: 900;
    }

    .dashboard-state {
      min-height: 220px;
    }

    .dashboard-card {
      margin-bottom: 14px;
      padding: 17px;
      border: 1px solid rgba(231, 235, 240, 0.92);
      border-radius: 18px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .dashboard-card .dashboard-section-heading {
      margin-bottom: 10px;
    }

    .dashboard-detail-link {
      flex: 0 0 auto;
      padding-top: 2px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
    }

    .dashboard-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
    }

    .dashboard-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dashboard-legend i {
      width: 8px;
      height: 8px;
      display: inline-block;
      border-radius: 50%;
    }

    .dashboard-chart-scroll {
      overflow: hidden;
    }

    #landlordRevenueChart,
    #landlordOccupancyChart,
    #landlordContractExpiryChart {
      width: 100%;
      height: auto;
      display: block;
    }

    .dashboard-chart-values {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .dashboard-chart-values-caption {
      margin-top: 9px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
    }

    .dashboard-chart-values span {
      min-width: 0;
      overflow: visible;
      text-overflow: clip;
      white-space: nowrap;
    }

    .dashboard-chart-values strong {
      display: block;
      margin-top: 3px;
      overflow: visible;
      color: var(--text-main);
      font-size: 11px;
      font-weight: 900;
      text-overflow: clip;
      white-space: nowrap;
    }

    .dashboard-operation-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 13px;
    }

    .dashboard-operation-item {
      min-width: 0;
      padding: 9px 6px 6px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fbfcfd;
    }

    .dashboard-operation-label {
      margin-bottom: 0;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }

    .dashboard-operation-item svg {
      width: 100%;
      height: 100px;
      display: block;
    }

    #landlordOccupancyChart,
    #landlordContractExpiryChart {
      height: 100px;
    }

    .dashboard-chart-error {
      border-color: #ffd5d2;
      background: var(--danger-soft);
    }

    .dashboard-retry-button {
      margin-top: 14px;
      padding: 10px 14px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .hero-card {
      overflow: hidden;
      background:
        linear-gradient(145deg, #07c95a 0%, #05b64f 58%, #039f44 100%);
      color: #ffffff;
    }

    .hero-main {
      padding: 20px;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      font-weight: 700;
    }

    .hero-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .hero-meta {
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.84);
      font-size: 12px;
      line-height: 1.5;
    }

    .refresh-button {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .refresh-button svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .refresh-button.loading svg {
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .hero-stat {
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.13);
    }

    .hero-stat-label {
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      font-weight: 700;
    }

    .hero-stat-value {
      overflow: hidden;
      font-size: 18px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.08);
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
    }

    .section-card {
      padding: 17px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 900;
    }

    .section-hint {
      color: var(--text-muted);
      font-size: 11px;
    }

    .collection-amount {
      margin-bottom: 12px;
      padding: 15px;
      border-radius: 15px;
      background: var(--danger-soft);
    }

    .collection-label {
      margin-bottom: 5px;
      color: #a13a40;
      font-size: 12px;
      font-weight: 800;
    }

    .collection-value {
      color: var(--danger);
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf0f3;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(90deg, var(--primary), #55d98c);
      transition: width 0.35s ease;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 9px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .progress-value {
      color: var(--text-main);
      font-weight: 900;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 13px;
    }

    .summary-box {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fbfcfd;
    }

    .summary-label {
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
    }

    .summary-value {
      overflow: hidden;
      font-size: 16px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-value.green {
      color: var(--primary-dark);
    }

    .action-list {
      overflow: hidden;
      border-radius: 14px;
    }

    .action-item {
      width: 100%;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 2px;
      border: 0;
      border-top: 1px solid var(--border);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .action-item:first-child {
      border-top: 0;
    }

    .action-item:active {
      opacity: 0.67;
    }

    .action-icon {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--warning-soft);
      color: var(--warning);
    }

    .action-icon.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .action-icon.purple {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .action-icon.green {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .action-icon svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-main {
      min-width: 0;
      flex: 1;
    }

    .action-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 4px;
    }

    .action-title {
      font-size: 15px;
      font-weight: 900;
    }

    .action-desc {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .action-arrow {
      flex: 0 0 auto;
      color: #b4bac2;
      font-size: 22px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 23px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f0f2f5;
      color: #6c727c;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.warning {
      background: var(--warning-soft);
      color: #b87500;
    }

    .badge.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .badge.green {
      background: var(--primary-soft);
      color: #079641;
    }

    .badge.purple {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .quick-button {
      min-height: 93px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #ffffff;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
    }

    .quick-button:active {
      opacity: 0.67;
    }

    .quick-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .quick-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .quick-title {
      font-size: 14px;
      font-weight: 900;
    }

    .quick-desc {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .loading-card,
    .error-card {
      padding: 28px 18px;
      text-align: center;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 3px solid #e5e9ed;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    .loading-text,
    .error-text {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .error-title {
      margin-bottom: 8px;
      color: var(--danger);
      font-size: 17px;
      font-weight: 900;
    }

    .primary-button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 13px;
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .bottom-nav {
      position: absolute;
      z-index: 1000;
      right: 0;
      bottom: 0;
      left: 0;
      border-top: 1px solid #e8ecf1;
      background: rgba(255, 255, 255, 0.98);
      padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(12px);
    }

    .bottom-nav-inner {
      height: var(--nav-height);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      border: 0;
      background: transparent;
      color: #8b919a;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-item svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 900;
    }

    .nav-item.active::after {
      position: absolute;
      bottom: 5px;
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--primary);
      content: "";
    }

    .toast {
      position: absolute;
      z-index: 3000;
      right: 18px;
      bottom: calc(var(--nav-height) + 22px + env(safe-area-inset-bottom));
      left: 18px;
      display: none;
      padding: 13px 15px;
      border-radius: 13px;
      background: rgba(25, 28, 33, 0.94);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 390px) {
      .summary-grid,
      .quick-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-kpi {
        padding-right: 2px;
        padding-left: 2px;
      }

      .dashboard-kpi-value {
        overflow: visible;
        font-size: 14px;
        letter-spacing: -0.35px;
        text-overflow: clip;
      }

      .page {
        padding-right: 13px;
        padding-left: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <main class="page">
      <div id="app">
        <section class="card loading-card">
          <div class="loading-spinner"></div>
          <div class="loading-text">房東首頁資料載入中...</div>
        </section>
      </div>
    </main>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="nav-item active" type="button" onclick="goPage('landlord-home.html')">
          <svg viewBox="0 0 24 24">
            <path d="M4 11.5L12 5l8 6.5"></path>
            <path d="M6.5 10.5V19h11v-8.5"></path>
            <path d="M9.5 19v-5h5v5"></path>
          </svg>
          <span>首頁</span>
        </button>

        <button class="nav-item" type="button" onclick="goPage('landlord-arrears.html')">
          <svg viewBox="0 0 24 24">
            <rect x="5" y="4.5" width="14" height="15" rx="2"></rect>
            <path d="M8.5 9h7"></path>
            <path d="M8.5 13h7"></path>
            <path d="M8.5 17h4"></path>
          </svg>
          <span>欠款</span>
        </button>

        <button class="nav-item" type="button" onclick="goPage('landlord-tenants.html')">
          <svg viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3"></circle>
            <path d="M4 19c.5-3.2 2.2-5 5-5s4.5 1.8 5 5"></path>
            <path d="M15.5 7.5a2.5 2.5 0 0 1 0 5"></path>
            <path d="M16 14c2.2.4 3.5 2 4 5"></path>
          </svg>
          <span>房客</span>
        </button>

        <button class="nav-item" type="button" onclick="goPage('landlord-more.html')">
          <svg viewBox="0 0 24 24">
            <circle cx="6" cy="12" r="1.5"></circle>
            <circle cx="12" cy="12" r="1.5"></circle>
            <circle cx="18" cy="12" r="1.5"></circle>
          </svg>
          <span>更多</span>
        </button>
      </div>
    </nav>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbyrwKb3adOgHVBwbwHwLeSsDoUgYhaUaFXui66tnyMNBrT9eOVbi788oHeVRTif_LA9BA/exec';

    const LIFF_ID =
      '2010314940-EjX1qbb8';

    const LANDLORD_ENTRY_URL =
      new URL(
        'landlord-entry.html',
        location.href
      ).href.split('?')[0];

    const TEST_LINE_USER_ID =
      'Uf708ece75c9c985cfe1dbda48d123511';

    const URL_PARAMS =
      new URLSearchParams(location.search);

    const TEST_MODE =
      URL_PARAMS.get('test') === '1';

    const JSONP_REQUEST_TIMEOUT_MS = 30000;
    const JSONP_REQUEST_MAX_ATTEMPTS = 2;
    const JSONP_REQUEST_RETRY_DELAY_MS = 350;

    let LINE_USER_ID = '';
    let toastTimer = null;

    function setAppHeight() {
      const height =
        window.visualViewport && window.visualViewport.height
          ? window.visualViewport.height
          : window.innerHeight;

      document.documentElement.style.setProperty(
        '--app-height',
        Math.round(height) + 'px'
      );
    }

    function rawText(value) {
      if (
        value === undefined ||
        value === null
      ) {
        return '';
      }

      return String(value);
    }

    function safeHtml(value) {
      return rawText(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function money(value) {
      const number =
        Number(value || 0);

      return (
        'NT$ ' +
        Math.round(number).toLocaleString(
          'zh-TW'
        )
      );
    }

    function numberValue(value) {
      return Number(value || 0) || 0;
    }

    function clamp(value, min, max) {
      return Math.min(
        Math.max(value, min),
        max
      );
    }

    function goPage(page) {
      const separator =
        page.indexOf('?') >= 0
          ? '&'
          : '?';

      location.href =
        page +
        separator +
        'v=' +
        (window.CMWEBS_RELEASE_VERSION || 'v2.1-p0-1') +
        (
          TEST_MODE
            ? '&test=1'
            : ''
        );
    }

    function showToast(message) {
      const toast =
        document.getElementById('toast');

      toast.textContent =
        rawText(message) || '提示';

      toast.classList.add('show');

      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(function () {
          toast.classList.remove('show');
        }, 2300);
    }

    function jsonpRequestOnce(
      action,
      params,
      timeoutMs
    ) {
      return new Promise(
        function (resolve, reject) {
          if (!LINE_USER_ID) {
            reject(
              new Error('缺少 LINE User ID')
            );

            return;
          }

          const callbackName =
            '__cmwebs_home_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() * 1000000
            );

          const script =
            document.createElement('script');

          let finished = false;

          const timer =
            setTimeout(
              function () {
                if (finished) {
                  return;
                }

                finished = true;
                cleanup();
                reject(
                  new Error('API 載入逾時')
                );
              },
              Number(timeoutMs) ||
                JSONP_REQUEST_TIMEOUT_MS
            );

          function cleanup() {
            clearTimeout(timer);

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }

            try {
              delete window[callbackName];
            } catch (error) {
              window[callbackName] =
                undefined;
            }
          }

          window[callbackName] =
            function (result) {
              if (finished) {
                return;
              }

              finished = true;
              cleanup();
              resolve(result);
            };

          let url =
            API_URL +
            '?v2_action=' +
            encodeURIComponent(action) +
            '&line_user_id=' +
            encodeURIComponent(
              LINE_USER_ID
            ) +
            '&callback=' +
            encodeURIComponent(
              callbackName
            ) +
            '&_=' +
            Date.now();

          if (TEST_MODE) {
            url += '&test=1';
          }

          Object.keys(
            params || {}
          ).forEach(function (key) {
            const value =
              params[key];

            if (
              value === undefined ||
              value === null
            ) {
              return;
            }

            url +=
              '&' +
              encodeURIComponent(key) +
              '=' +
              encodeURIComponent(value);
          });

          script.charset =
            'UTF-8';

          script.onerror =
            function () {
              if (finished) {
                return;
              }

              finished = true;
              cleanup();
              reject(
                new Error(
                  'API 路由執行失敗，請確認綁定後端已重新部署'
                )
              );
            };

          script.src = url;
          document.body.appendChild(script);
        }
      );
    }

    function shouldRetryDashboardRequest_(
      error,
      attempt,
      maxAttempts
    ) {
      return Boolean(
        error &&
        error.message === 'API 載入逾時' &&
        Number(attempt) < Number(maxAttempts)
      );
    }

    function jsonpRequest(
      action,
      params,
      options
    ) {
      const requestOptions =
        options || {};
      const timeoutMs =
        Number(
          requestOptions.timeoutMs ||
            JSONP_REQUEST_TIMEOUT_MS
        );
      const maxAttempts =
        Math.max(
          1,
          Number(
            requestOptions.maxAttempts ||
              1
          )
        );
      const retryOnTimeout =
        requestOptions.retryOnTimeout ===
        true;

      let attempt = 0;

      return new Promise(
        function (resolve, reject) {
          function run() {
            attempt += 1;

            jsonpRequestOnce(
              action,
              params,
              timeoutMs
            ).then(
              resolve,
              function (error) {
                const isTimeout =
                  error &&
                  error.message ===
                    'API 載入逾時';

                if (
                  retryOnTimeout &&
                  isTimeout &&
                  shouldRetryDashboardRequest_(
                    error,
                    attempt,
                    maxAttempts
                  )
                ) {
                  setTimeout(
                    run,
                    JSONP_REQUEST_RETRY_DELAY_MS
                  );
                  return;
                }

                reject(error);
              }
            );
          }

          run();
        }
      );
    }

    function buildLandlordLoginRedirectUri() {
      const currentUrl =
        new URL(
          location.href
        );

      [
        'code',
        'state',
        'liff.state',
        'friendship_status_changed',
        'error',
        'error_description'
      ].forEach(
        function (key) {
          currentUrl.searchParams.delete(
            key
          );
        }
      );

      const returnTo =
        currentUrl.pathname
          .split('/')
          .pop() +
        (
          currentUrl.searchParams
            .toString()
            ? '?' +
              currentUrl.searchParams
                .toString()
            : ''
        );

      sessionStorage.setItem(
        'cmwebs_landlord_return_to',
        returnTo
      );

      const entryUrl =
        new URL(
          LANDLORD_ENTRY_URL
        );

      entryUrl.searchParams.set(
        'return_to',
        returnTo
      );

      return entryUrl.href;
    }

    async function initLineUserId() {
      if (TEST_MODE) {
        LINE_USER_ID =
          TEST_LINE_USER_ID;

        return true;
      }

      if (
        typeof liff ===
        'undefined'
      ) {
        throw new Error(
          'LIFF SDK 載入失敗'
        );
      }

      await liff.init({
        liffId: LIFF_ID
      });

      if (!liff.isLoggedIn()) {
        liff.login({
          redirectUri:
            buildLandlordLoginRedirectUri()
        });

        return false;
      }

      const profile =
        await liff.getProfile();

      LINE_USER_ID =
        profile.userId || '';

      if (!LINE_USER_ID) {
        throw new Error(
          '無法取得房東 LINE User ID'
        );
      }

      return true;
    }

    function unwrapData(result) {
      if (
        result &&
        result.success === true
      ) {
        return (
          result.data !== undefined
            ? result.data
            : result
        );
      }

      throw new Error(
        result && result.message
          ? result.message
          : '查詢失敗'
      );
    }

    function findSummaryNumber(
      summary,
      keys
    ) {
      summary =
        summary || {};

      for (
        let index = 0;
        index < keys.length;
        index += 1
      ) {
        const key =
          keys[index];

        if (
          summary[key] !== undefined &&
          summary[key] !== null &&
          summary[key] !== ''
        ) {
          return numberValue(
            summary[key]
          );
        }
      }

      return 0;
    }

    function countPendingPaymentReports(
      paymentData
    ) {
      const reports =
        paymentData &&
        Array.isArray(paymentData.reports)
          ? paymentData.reports
          : null;

      if (reports) {
        return reports.filter(function (report) {
          const status =
            String(
              report && report.status ||
              ''
            )
              .trim()
              .toLowerCase();

          return (
            status === 'pending' ||
            status === 'payment_reported'
          );
        }).length;
      }

      const summary =
        paymentData &&
        paymentData.summary
          ? paymentData.summary
          : {};

      return findSummaryNumber(
        summary,
        [
          'pending_count',
          'pending'
        ]
      );
    }

    function buildActionSummary(
      contractData,
      paymentData,
      messageData,
      initiatedContractData
    ) {
      const contractSummary =
        contractData &&
        contractData.summary
          ? contractData.summary
          : {};

      const messageSummary =
        messageData &&
        messageData.summary
          ? messageData.summary
          : {};

      const landlordInitiatedPending =
        countPendingLandlordInitiatedContracts(
          initiatedContractData
        );

      return {
        contractPending:
          findSummaryNumber(
            contractSummary,
            [
              'pending_count',
              'pending'
            ]
          ),

        contractApproved:
          findSummaryNumber(
            contractSummary,
            [
              'approved_count',
              'approved'
            ]
          ),

        landlordInitiatedPending:
          landlordInitiatedPending,

        paymentPending:
          countPendingPaymentReports(
            paymentData
          ),

        messagePending:
          findSummaryNumber(
            messageSummary,
            [
              'pending_count',
              'pending'
            ]
          ),

        messageProcessing:
          findSummaryNumber(
            messageSummary,
            [
              'processing_count',
              'processing'
            ]
          ),

        messageUrgent:
          findSummaryNumber(
            messageSummary,
            [
              'urgent_count',
              'urgent'
            ]
          )
      };
    }

    function countPendingLandlordInitiatedContracts(
      initiatedContractData
    ) {
      const items =
        initiatedContractData &&
        Array.isArray(initiatedContractData.items)
          ? initiatedContractData.items
          : [];

      return items.filter(function (contract) {
        const status = String(
          contract && (
            contract.contract_status ||
            contract.status
          ) || ''
        ).trim().toLowerCase();

        return [
          'pending',
          'awaiting_tenant',
          'tenant_signed',
          'pending_tenant_signature',
          'awaiting_tenant_signature'
        ].indexOf(status) >= 0;
      }).length;
    }

    function badgeHtml(
      count,
      emptyText,
      className
    ) {
      if (count > 0) {
        return (
          '<span class="badge ' +
          className +
          '">' +
          count +
          ' 筆</span>'
        );
      }

      return (
        '<span class="badge green">' +
        safeHtml(
          emptyText || '無待處理'
        ) +
        '</span>'
      );
    }

    function normaliseLandlordDashboardData_(
      data
    ) {
      const input =
        data &&
        typeof data === 'object'
          ? data
          : {};

      const months =
        Array.isArray(input.months)
          ? input.months
              .map(function (row) {
                const item =
                  row &&
                  typeof row === 'object'
                    ? row
                    : {};

                const month =
                  String(
                    item.month ||
                    item.bill_month ||
                    ''
                  ).trim();

                if (!month) {
                  return null;
                }

                const amount =
                  function (value) {
                    const number =
                      Number(value);

                    return Number.isFinite(
                      number
                    ) &&
                      number >= 0
                      ? number
                      : 0;
                  };

                return {
                  month: month,
                  receivable: amount(
                    item.receivable
                  ),
                  collected: amount(
                    item.collected
                  ),
                  outstanding: amount(
                    item.outstanding
                  )
                };
              })
              .filter(function (row) {
                return Boolean(row);
              })
          : [];

      const occupancyInput =
        input.occupancy &&
        typeof input.occupancy === 'object'
          ? input.occupancy
          : {};
      const occupancyRate =
        Number(
          occupancyInput.occupancy_rate
        );

      const contractExpiry =
        Array.isArray(input.contract_expiry)
          ? input.contract_expiry.map(
              function (row) {
                const item =
                  row &&
                  typeof row === 'object'
                    ? row
                    : {};
                const count =
                  Number(item.count);

                return {
                  bucket: String(
                    item.bucket || ''
                  ).trim(),
                  label: String(
                    item.label || ''
                  ).trim(),
                  count: Number.isFinite(
                    count
                  ) && count >= 0
                    ? count
                    : 0
                };
              }
            )
          : [];

      return {
        months: months,
        occupancy: {
          occupancy_rate:
            Number.isFinite(occupancyRate) &&
            occupancyRate >= 0
              ? Math.min(
                  Math.max(occupancyRate, 0),
                  1
                )
              : 0
        },
        contract_expiry: contractExpiry
      };
    }

    function contractExpiryBuckets_(
      rows
    ) {
      const bucketDefinitions = [
        {
          key: '30d',
          label: '30 天',
          aliases: ['30d', '0-30']
        },
        {
          key: '60d',
          label: '60 天',
          aliases: ['60d', '31-60']
        },
        {
          key: '90d',
          label: '90 天',
          aliases: ['90d', '61-90']
        }
      ];

      return bucketDefinitions.map(
        function (definition) {
          const row =
            (Array.isArray(rows)
              ? rows
              : []
            ).find(function (item) {
              const bucket = String(
                item && item.bucket
                  ? item.bucket
                  : ''
              ).trim();

              return (
                definition.aliases.indexOf(
                  bucket
                ) >= 0
              );
            });
          const count = Number(
            row && row.count
          );

          return {
            key: definition.key,
            label: definition.label,
            count:
              Number.isFinite(count) &&
              count >= 0
                ? count
                : 0
          };
        }
      );
    }

    function dashboardSeriesColor_(
      key
    ) {
      const colors = {
        receivable: '#2F6FED',
        collected: '#06C755',
        outstanding: '#FF6259'
      };

      return (
        colors[key] ||
        '#64748B'
      );
    }

    function dashboardNumber_(
      value
    ) {
      const number =
        Number(value);

      return Number.isFinite(number) &&
        number >= 0
        ? number
        : 0;
    }

    function dashboardMoney_(
      value
    ) {
      return (
        'NT$ ' +
        Math.round(
          dashboardNumber_(value)
        ).toLocaleString('zh-TW')
      );
    }

    function dashboardTrendTotals_(
      rows
    ) {
      return (
        Array.isArray(rows)
          ? rows
          : []
      ).reduce(
        function (totals, row) {
          const item =
            row &&
            typeof row === 'object'
              ? row
              : {};
          const amount =
            function (value) {
              const number =
                Number(value);

              return Number.isFinite(
                number
              ) && number >= 0
                ? number
                : 0;
            };

          totals.receivable += amount(
            item.receivable
          );
          totals.collected += amount(
            item.collected
          );
          totals.outstanding += amount(
            item.outstanding
          );
          return totals;
        },
        {
          receivable: 0,
          collected: 0,
          outstanding: 0
        }
      );
    }

    function dashboardPercent_(
      value
    ) {
      return (
        Math.round(
          dashboardNumber_(value) * 100
        ) +
        '%'
      );
    }

    function dashboardEscape_(
      value
    ) {
      return String(
        value === undefined ||
          value === null
          ? ''
          : value
      )
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function dashboardLineChartSvg_(
      rows
    ) {
      const width = 360;
      const height = 190;
      const left = 37;
      const right = 8;
      const top = 16;
      const bottom = 30;
      const plotWidth =
        width - left - right;
      const plotHeight =
        height - top - bottom;
      const series = [
        'receivable',
        'collected',
        'outstanding'
      ];
      const labels = {
        receivable: '應收',
        collected: '已收',
        outstanding: '欠款'
      };
      const safeRows =
        Array.isArray(rows)
          ? rows.slice(-12)
          : [];
      const max = Math.max(
        1,
        ...safeRows.reduce(
          function (values, row) {
            series.forEach(function (key) {
              values.push(
                dashboardNumber_(
                  row && row[key]
                )
              );
            });

            return values;
          },
          []
        )
      );
      const x = function (index) {
        return safeRows.length <= 1
          ? left + plotWidth / 2
          : left +
              (plotWidth * index) /
                (safeRows.length - 1);
      };
      const y = function (value) {
        return (
          top +
          plotHeight -
          (dashboardNumber_(value) /
            max) *
            plotHeight
        );
      };
      const path = function (key) {
        return safeRows
          .map(function (row, index) {
            return (
              (index === 0 ? 'M' : 'L') +
              x(index).toFixed(1) +
              ' ' +
              y(row && row[key]).toFixed(1)
            );
          })
          .join(' ');
      };
      const grid = [0, 0.5, 1]
        .map(function (ratio) {
          const gridY =
            top + plotHeight * ratio;

          return (
            '<line x1="' +
            left +
            '" y1="' +
            gridY.toFixed(1) +
            '" x2="' +
            (width - right) +
            '" y2="' +
            gridY.toFixed(1) +
            '" stroke="#E6EBF0" stroke-dasharray="3 4"/>' +
            '<text x="2" y="' +
            (gridY + 4).toFixed(1) +
            '" fill="#6B7785" font-size="10">' +
            dashboardEscape_(
              Math.round(max * (1 - ratio) / 1000) +
                'K'
            ) +
            '</text>'
          );
        })
        .join('');
      const paths = series
        .map(function (key) {
          return (
            '<path d="' +
            path(key) +
            '" fill="none" stroke="' +
            dashboardSeriesColor_(key) +
            '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-series="' +
            key +
            '"/>'
          );
        })
        .join('');
      const points = series
        .map(function (key) {
          return safeRows
            .map(function (row, index) {
              return (
                '<circle cx="' +
                x(index).toFixed(1) +
                '" cy="' +
                y(row && row[key]).toFixed(1) +
                '" r="3.3" fill="#fff" stroke="' +
                dashboardSeriesColor_(key) +
                '" stroke-width="2" aria-label="' +
                dashboardEscape_(
                  (row && row.month) +
                    ' ' +
                    labels[key] +
                    ' ' +
                    dashboardMoney_(
                      row && row[key]
                    )
                ) +
                '"/>'
              );
            })
            .join('');
        })
        .join('');
      const monthLabels = safeRows
        .map(function (row, index) {
          const month = String(
            row && row.month
              ? row.month
              : ''
          );

          return (
            '<text x="' +
            x(index).toFixed(1) +
            '" y="' +
            (height - 11) +
            '" text-anchor="middle" fill="#6B7785" font-size="9">' +
            dashboardEscape_(
              month.slice(-2) || '-'
            ) +
            '</text>'
          );
        })
        .join('');

      return (
        '<svg id="landlordRevenueChart" viewBox="0 0 ' +
        width +
        ' ' +
        height +
        '" role="img" aria-label="應收、已收、欠款近 12 個月收租趨勢">' +
        '<title>應收、已收、欠款近 12 個月收租趨勢</title>' +
        grid +
        paths +
        points +
        monthLabels +
        '</svg>'
      );
    }

    function dashboardDonutSvg_(
      occupancyRate
    ) {
      const ratio = Math.min(
        Math.max(
          dashboardNumber_(
            occupancyRate
          ),
          0
        ),
        1
      );
      const radius = 42;
      const circumference =
        2 * Math.PI * radius;

      return (
        '<svg id="landlordOccupancyChart" viewBox="0 0 120 120" role="img" aria-label="入住率 ' +
        dashboardEscape_(
          dashboardPercent_(ratio)
        ) +
        '"><title>入住率 ' +
        dashboardEscape_(
          dashboardPercent_(ratio)
        ) +
        '</title><circle cx="60" cy="60" r="' +
        radius +
        '" fill="none" stroke="#E7EDF0" stroke-width="13"/><circle cx="60" cy="60" r="' +
        radius +
        '" fill="none" stroke="#06C755" stroke-width="13" stroke-linecap="round" stroke-dasharray="' +
        (circumference * ratio).toFixed(1) +
        ' ' +
        circumference.toFixed(1) +
        '" transform="rotate(-90 60 60)"/><text x="60" y="65" text-anchor="middle" fill="#17211B" font-size="20" font-weight="900">' +
        dashboardEscape_(
          dashboardPercent_(ratio)
        ) +
        '</text></svg>'
      );
    }

    function dashboardExpiryChartSvg_(
      rows
    ) {
      const buckets =
        contractExpiryBuckets_(rows);
      const width = 220;
      const height = 160;
      const baseline = 124;
      const max = Math.max(
        1,
        ...buckets.map(function (row) {
          return dashboardNumber_(
            row.count
          );
        })
      );
      const bars = buckets
        .map(function (row, index) {
          const barWidth = 29;
          const gap = 31;
          const x = 17 + index * (barWidth + gap);
          const barHeight =
            (dashboardNumber_(row.count) /
              max) *
            84;
          const y = baseline - barHeight;

          return (
            '<rect x="' +
            x +
            '" y="' +
            y.toFixed(1) +
            '" width="' +
            barWidth +
            '" height="' +
            barHeight.toFixed(1) +
            '" rx="6" fill="#06C755" aria-label="' +
            dashboardEscape_(
              row.label +
                ' ' +
                row.count +
                ' 份'
            ) +
            '"/><text x="' +
            (x + barWidth / 2) +
            '" y="' +
            Math.max(y - 7, 12).toFixed(1) +
            '" text-anchor="middle" fill="#17211B" font-size="13" font-weight="900">' +

            (baseline + 19) +
            '" text-anchor="middle" fill="#6B7785" font-size="10">' +
            dashboardEscape_(row.label) +
            '</text>'
          );
        })
        .join('');

      return (
        '<svg id="landlordContractExpiryChart" viewBox="0 0 ' +
        width +
        ' ' +
        height +
        '" role="img" aria-label="合約到期 30 天、60 天、90 天分布">' +
        '<title>合約到期 30 天、60 天、90 天分布</title><line x1="8" y1="' +

    function renderLandlordDashboardError_(
      message
    ) {
      const host =
        document.getElementById(
          'landlordDashboardState'
        );

      if (!host) {
        return;

      host.innerHTML = `

          <button class="dashboard-retry-button" type="button" onclick="loadDashboardReport_()">重新載入圖表</button>
        </section>
      `;
    }

    let dashboardReportRequest_ =
      null;

    let pageRequestToken_ = 0;

    function requestDashboardReport_(
      requestToken
    ) {
      const activeToken =
        Number.isFinite(
          Number(requestToken)
        )
          ? Number(requestToken)
          : pageRequestToken_;

      if (
        dashboardReportRequest_ &&
        dashboardReportRequest_.token ===
          activeToken
      ) {
        return dashboardReportRequest_.promise;
      }

      const reportPromise =
        jsonpRequest(
          'landlord_revenue_dashboard_init',
          { range: '12m' },
          {
            maxAttempts:
              JSONP_REQUEST_MAX_ATTEMPTS,
            retryOnTimeout: true
          }
        );

      dashboardReportRequest_ = {
        token: activeToken,
        promise: reportPromise
      };

      return reportPromise;
    }

    function loadDashboardReport_(
      requestToken,
      pendingPromise
    ) {
      const activeToken =
        Number.isFinite(
          Number(requestToken)
        )
          ? Number(requestToken)
          : pageRequestToken_;

      const host =
        document.getElementById(
          'landlordDashboardState'
        );

      if (!host) {
        return Promise.resolve(null);
      }

      host.setAttribute(
        'aria-busy',
        'true'
      );

      const reportPromise =
        dashboardReportRequest_ &&
        dashboardReportRequest_.token ===
          activeToken
          ? dashboardReportRequest_.promise
          : pendingPromise ||
            requestDashboardReport_(
              activeToken
            );

      return reportPromise
          .then(function (result) {
            if (
              activeToken !==
              pageRequestToken_
            ) {
              return null;
            }

            const report =
              unwrapData(result);

            renderLandlordDashboardCharts_(
              report
            );

            return report;
          })
          .catch(function (error) {
            if (
              activeToken ===
              pageRequestToken_
            ) {
              renderLandlordDashboardError_(
                error && error.message
                  ? error.message
                  : String(error)
              );
            }

            return null;
          })
          .finally(function () {
            host.removeAttribute(
              'aria-busy'
            );

            if (
              dashboardReportRequest_ &&
              dashboardReportRequest_.token ===
                activeToken
            ) {
              dashboardReportRequest_ =
                null;
            }
          });
    }

            重新整理
          </button>
        </section>
      `;

    function setRefreshLoading(
      loading
    ) {
      const button =
        document.getElementById(
          'refreshButton'
        );

      if (!button) {
        return;
      }

      button.classList.toggle(
        'loading',
        Boolean(loading)
      );
    }

    async function loadPage() {
      const requestToken =
        pageRequestToken_ + 1;

      pageRequestToken_ =
        requestToken;

      setRefreshLoading(true);

      try {
        if (!LINE_USER_ID) {
          const ready =
            await initLineUserId();

          if (!ready) {
            return;
          }
        }

        const dashboardReportPromise =
          requestDashboardReport_(
            requestToken
          );

        dashboardReportPromise.catch(
          function () {}
        );

        const bootstrapResult =
          await jsonpRequest(
            'landlord_home_bootstrap',
            {},
            {
              maxAttempts:
                JSONP_REQUEST_MAX_ATTEMPTS,
              retryOnTimeout: true
            }
          );

        const bootstrap =
          unwrapData(bootstrapResult);

        const home =
          bootstrap.home || {};

        const contractData =
          bootstrap.contract_requests || {};

        const paymentData =
          bootstrap.payment_reports || {};

        const messageData =
          bootstrap.messages || {};

        const initiatedContractData =
          bootstrap.landlord_initiated_contracts || {};

        const actionSummary =
          buildActionSummary(
            contractData,
            paymentData,
            messageData,
            initiatedContractData
          );

        renderHome(
          home,
          actionSummary
        );

        loadDashboardReport_(
          requestToken,
          dashboardReportPromise
        );
      } catch (error) {
        if (
          requestToken ===
          pageRequestToken_
        ) {
          renderError(
            error && error.message
              ? error.message
              : String(error)
          );
        }
      } finally {
        setRefreshLoading(false);
      }
    }

    setAppHeight();

    window.addEventListener(

      function () {

      }
    );

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        'resize',
        setAppHeight
      );
    }

    loadPage();
