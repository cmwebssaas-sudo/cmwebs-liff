<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>CMWebs 房東首頁</title>

  <script src="frontend-release.js?v=20261027-mobile-pages-v1"></script>
  <script src="liff-request-auth.js?v=20261027-mobile-pages-v1"></script>
  <script src="landlord-auth.js?v=20261027-mobile-pages-v1"></script>
  <script src="landlord-api.js?v=20261027-mobile-pages-v1"></script>
  <link rel="stylesheet" href="landlord-responsive.css?v=20261027-mobile-pages-v1" />
  <script src="landlord-glass-nav.js?v=20261027-mobile-pages-v1" defer></script>
  <script src="landlord-glass-shell.js?v=20261027-mobile-pages-v1" defer></script>

  <style>
    :root {
      --app-height: 100vh;
      --nav-height: 64px;
      --primary: #06c755;
      --primary-dark: #05a948;
      --primary-soft: #effcf4;
      --page-bg: #f4f6fa;
      --card-bg: #ffffff;
      --text-main: #171a1f;
      --text-muted: #747b85;
      --border: #e7ebf0;
      --danger: #e5484d;
      --danger-soft: #fff1f2;
      --warning: #e69b00;
      --warning-soft: #fff7df;
      --blue: #246bfd;
      --blue-soft: #eef4ff;
      --purple: #7c3aed;
      --purple-soft: #f4efff;
      --shadow: 0 7px 24px rgba(30, 40, 60, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text-main);
      font-family:
        Arial,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: var(--app-height);
      margin: 0 auto;
      overflow: hidden;
      background: var(--page-bg);
    }

    .page {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        18px
        16px
        calc(var(--nav-height) + 28px + env(safe-area-inset-bottom));
    }

    .card {
      margin-bottom: 14px;
      border: 1px solid rgba(231, 235, 240, 0.92);
      border-radius: 18px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .dashboard-page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin: 3px 2px 16px;
    }

    .dashboard-brand {
      margin-bottom: 7px;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .dashboard-page-title {
      margin: 0;
      color: var(--text-main);
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .dashboard-updated {
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .dashboard-page-header .refresh-button {
      border-color: var(--border);
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 0 5px 16px rgba(30, 40, 60, 0.08);
    }

    .dashboard-summary-card {
      padding: 17px;
    }

    .dashboard-section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dashboard-section-title {
      color: var(--text-main);
      font-size: 17px;
      font-weight: 900;
    }

    .dashboard-section-subtitle {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .dashboard-kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .dashboard-kpi {
      min-width: 0;
      padding: 10px 7px 11px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fbfcfd;
      text-align: center;
    }

    .dashboard-kpi-label {
      overflow: hidden;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-kpi-value {
      margin-top: 5px;
      overflow: visible;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.2px;
      text-overflow: clip;
      white-space: nowrap;
    }

    .dashboard-kpi-value.green {
      color: var(--primary-dark);
    }

    .dashboard-kpi-value.danger {
      color: var(--danger);
    }

    .dashboard-kpi-value.blue {
      color: var(--blue);
    }

    .dashboard-kpi-rate {
      color: var(--blue);
    }

    .dashboard-collection-bar {
      margin-top: 15px;
    }

    .dashboard-collection-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf0f3;
    }

    .dashboard-collection-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 0.35s ease;
    }

    .dashboard-collection-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .dashboard-collection-labels strong {
      color: var(--text-main);
      font-weight: 900;
    }

    .dashboard-state {
      min-height: 220px;
    }

    .dashboard-card {
      margin-bottom: 14px;
      padding: 17px;
      border: 1px solid rgba(231, 235, 240, 0.92);
      border-radius: 18px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .dashboard-card .dashboard-section-heading {
      margin-bottom: 10px;
    }

    .dashboard-detail-link {
      flex: 0 0 auto;
      padding-top: 2px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
    }

    .dashboard-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
    }

    .dashboard-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dashboard-legend i {
      width: 8px;
      height: 8px;
      display: inline-block;
      border-radius: 50%;
    }

    .dashboard-chart-scroll {
      overflow: hidden;
    }

    #landlordRevenueChart,
    #landlordOccupancyChart,
    #landlordContractExpiryChart {
      width: 100%;
      height: auto;
      display: block;
    }

    .dashboard-chart-values {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .dashboard-chart-values-caption {
      margin-top: 9px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
    }

    .dashboard-chart-values span {
      min-width: 0;
      overflow: visible;
      text-overflow: clip;
      white-space: nowrap;
    }

    .dashboard-chart-values strong {
      display: block;
      margin-top: 3px;
      overflow: visible;
      color: var(--text-main);
      font-size: 11px;
      font-weight: 900;
      text-overflow: clip;
      white-space: nowrap;
    }

    .dashboard-operation-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 13px;
    }

    .dashboard-operation-item {
      min-width: 0;
      padding: 9px 6px 6px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fbfcfd;
    }

    .dashboard-operation-label {
      margin-bottom: 0;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }

    .dashboard-operation-item svg {
      width: 100%;
      height: 100px;
      display: block;
    }

    #landlordOccupancyChart,
    #landlordContractExpiryChart {
      height: 100px;
    }

    .dashboard-chart-error {
      border-color: #ffd5d2;
      background: var(--danger-soft);
    }

    .dashboard-retry-button {
      margin-top: 14px;
      padding: 10px 14px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .hero-card {
      overflow: hidden;
      background:
        linear-gradient(145deg, #07c95a 0%, #05b64f 58%, #039f44 100%);
      color: #ffffff;
    }

    .hero-main {
      padding: 20px;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      font-weight: 700;
    }

    .hero-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .hero-meta {
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.84);
      font-size: 12px;
      line-height: 1.5;
    }

    .refresh-button {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .refresh-button svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .refresh-button.loading svg {
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .hero-stat {
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.13);
    }

    .hero-stat-label {
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      font-weight: 700;
    }

    .hero-stat-value {
      overflow: hidden;
      font-size: 18px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.08);
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
    }

    .section-card {
      padding: 17px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 900;
    }

    .section-hint {
      color: var(--text-muted);
      font-size: 11px;
    }

    .collection-amount {
      margin-bottom: 12px;
      padding: 15px;
      border-radius: 15px;
      background: var(--danger-soft);
    }

    .collection-label {
      margin-bottom: 5px;
      color: #a13a40;
      font-size: 12px;
      font-weight: 800;
    }

    .collection-value {
      color: var(--danger);
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf0f3;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(90deg, var(--primary), #55d98c);
      transition: width 0.35s ease;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 9px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .progress-value {
      color: var(--text-main);
      font-weight: 900;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 13px;
    }

    .summary-box {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fbfcfd;
    }

    .summary-label {
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
    }

    .summary-value {
      overflow: hidden;
      font-size: 16px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-value.green {
      color: var(--primary-dark);
    }

    .action-list {
      overflow: hidden;
      border-radius: 14px;
    }

    .action-item {
      width: 100%;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 2px;
      border: 0;
      border-top: 1px solid var(--border);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .action-item:first-child {
      border-top: 0;
    }

    .action-item:active {
      opacity: 0.67;
    }

    .action-icon {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--warning-soft);
      color: var(--warning);
    }

    .action-icon.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .action-icon.purple {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .action-icon.green {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .action-icon svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-main {
      min-width: 0;
      flex: 1;
    }

    .action-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 4px;
    }

    .action-title {
      font-size: 15px;
      font-weight: 900;
    }

    .action-desc {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .action-arrow {
      flex: 0 0 auto;
      color: #b4bac2;
      font-size: 22px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 23px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f0f2f5;
      color: #6c727c;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.warning {
      background: var(--warning-soft);
      color: #b87500;
    }

    .badge.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .badge.green {
      background: var(--primary-soft);
      color: #079641;
    }

    .badge.purple {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .quick-button {
      min-height: 93px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #ffffff;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
    }

    .quick-button:active {
      opacity: 0.67;
    }

    .quick-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .quick-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .quick-title {
      font-size: 14px;
      font-weight: 900;
    }

    .quick-desc {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .loading-card,
    .error-card {
      padding: 28px 18px;
      text-align: center;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 3px solid #e5e9ed;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    .loading-text,
    .error-text {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .error-title {
      margin-bottom: 8px;
      color: var(--danger);
      font-size: 17px;
      font-weight: 900;
    }

    .primary-button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 13px;
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .bottom-nav {
      position: absolute;
      z-index: 1000;
      right: 0;
      bottom: 0;
      left: 0;
      border-top: 1px solid #e8ecf1;
      background: rgba(255, 255, 255, 0.98);
      padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(12px);
    }

    .bottom-nav-inner {
      height: var(--nav-height);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      border: 0;
      background: transparent;
      color: #8b919a;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-item svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 900;
    }

    .nav-item.active::after {
      position: absolute;
      bottom: 5px;
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--primary);
      content: "";
    }

    .toast {
      position: absolute;
      z-index: 3000;
      right: 18px;
      bottom: calc(var(--nav-height) + 22px + env(safe-area-inset-bottom));
      left: 18px;
      display: none;
      padding: 13px 15px;
      border-radius: 13px;
      background: rgba(25, 28, 33, 0.94);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 390px) {
      .summary-grid,
      .quick-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-kpi {
        padding-right: 2px;
        padding-left: 2px;
      }

      .dashboard-kpi-value {
        overflow: visible;
        font-size: 14px;
        letter-spacing: -0.35px;
        text-overflow: clip;
      }

      .page {
        padding-right: 13px;
        padding-left: 13px;
      }
    }
    .actions-pending .badge, .actions-pending .action-desc { display: none; }
  </style>
  <link rel="stylesheet" href="landlord-home.css?v=20261027-mobile-home-v1" />
  <script src="landlord-home-motion.js?v=20261011-home-redesign-v1"></script>
  <script src="assets/js/cmwebs-asset-valuation.js?v=20261005-utility-meter-save-v1"></script>
  <link rel="stylesheet" href="landlord-glass-theme.css?v=20261027-mobile-pages-v1" />
</head>

<body>
  <div class="app-shell desktop-ready">
    <aside class="desktop-sidebar" aria-label="房東桌面導覽" hidden>
      <div class="desktop-sidebar-inner">
        <div class="desktop-brand">
          <div class="desktop-brand-label">CMWEBS</div>
          <div class="desktop-brand-title">智慧租管</div>
        </div>

<nav class="desktop-nav">
          <button class="desktop-nav-item active" type="button" onclick="goPage('landlord-home.html')"><svg viewBox="0 0 24 24">
              <path d="M4 11.5L12 5l8 6.5"></path>
              <path d="M6.5 10.5V19h11v-8.5"></path>
              <path d="M9.5 19v-5h5v5"></path>
            </svg><span>總覽</span></button>
          <button class="desktop-nav-item" type="button" onclick="goPage('landlord-tenants.html')"><svg viewBox="0 0 24 24">

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbwnnuIFZ22eO6MxMnWOYHovgMT2xuTbcIgzbq4qmxXE3gjGoTJFcBGXlsNDS-lqr3EILQ/exec';

    const LIFF_ID =
      '2010314940-EjX1qbb8';

    const LANDLORD_ENTRY_URL =
      new URL(
        'landlord-entry.html',
        location.href
      ).href.split('?')[0];



    const URL_PARAMS =
      new URLSearchParams(location.search);

    const TEST_MODE =
      false;

    const JSONP_REQUEST_TIMEOUT_MS = 30000;
    const JSONP_REQUEST_MAX_ATTEMPTS = 2;
    const JSONP_REQUEST_RETRY_DELAY_MS = 350;

    let LINE_USER_ID = '';
    let LANDLORD_AUTH = null;
    let toastTimer = null;
    let homeLineSdkPromise_ = null;

    function setAppHeight() {
      const height =
        window.visualViewport && window.visualViewport.height
          ? window.visualViewport.height
          : window.innerHeight;

      document.documentElement.style.setProperty(
        '--app-height',
        Math.round(height) + 'px'
      );
    }

    function rawText(value) {
      if (
        value === undefined ||
        value === null
      ) {
        return '';
      }

      return String(value);
    }

    function safeHtml(value) {
      return rawText(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function money(value) {
      const number =
        Number(value || 0);

      return (
        'NT$ ' +
        Math.round(number).toLocaleString(
          'zh-TW'
        )
      );
    }

    function numberValue(value) {
      return Number(value || 0) || 0;
    }

    function clamp(value, min, max) {
      return Math.min(
        Math.max(value, min),
        max
      );
    }

    function goPage(page) {
      const separator =
        page.indexOf('?') >= 0
          ? '&'
          : '?';

      location.href =
        page +
        separator +
        'v=' +
        (window.CMWEBS_RELEASE_VERSION || 'v2.1-p0-1') +
        (
          TEST_MODE
            ? '&test=1'
            : ''
        );
    }

    function currentReturnTo() {
      const url =
        new URL(location.href);

      [
        'code',
        'state',
        'liff.state',
        'friendship_status_changed',
        'error',
        'error_description'
      ].forEach(function (key) {
        url.searchParams.delete(key);
      });

      return (
        url.pathname.split('/').pop() +
        (
          url.searchParams.toString()
            ? '?' + url.searchParams.toString()
            : ''
        )
      );
    }

    function initLandlordAuthClient() {
      if (!window.CMWebsLandlordAuth) {
        throw new Error('房東身分驗證模組載入失敗');
      }

      LANDLORD_AUTH =
        window.CMWebsLandlordAuth.init({
          apiUrl: API_URL,
          liffId: LIFF_ID,
          lineUserId: LINE_USER_ID,
          returnTo: currentReturnTo(),
          entryPage: 'landlord-entry.html',
          testMode: TEST_MODE
        });

      return LANDLORD_AUTH;
    }

    async function ensureLandlordAuthReady() {
      const auth =
        LANDLORD_AUTH ||
        initLandlordAuthClient();



      if (auth.getMode() === 'email') {
        // The protected bootstrap validates the session and Workspace itself.
        // Avoid a redundant serial Apps Script round trip before it.
        return true;
      }

      if (!LINE_USER_ID) {
        const ready =
          await initLineUserId();

        if (!ready) {
          return false;
        }
      }

      initLandlordAuthClient();
      return true;
    }

      location.href =

    function showToast(message) {
      const toast =
        document.getElementById('toast');

      toast.textContent =
        rawText(message) || '提示';

      toast.classList.add('show');

      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(function () {
          toast.classList.remove('show');
        }, 2300);
    }

    function jsonpRequestOnce(
      action,
      params,
      timeoutMs
    ) {
      const authParams = window.CMWebsLandlordAuth.getRequestAuthParams();

      if (
        authParams.response_mode === 'bridge' &&
        authParams.landlord_session_token
      ) {
        return window.CMWebsLandlordAuth.request(
          action,
          params || {},
          { timeoutMs: timeoutMs }
        );
      }

      const requestParams =
        Object.assign(
          {},
          params || {},
          authParams
        );

      return new Promise(
        function (resolve, reject) {
          if (!authParams.line_user_id) {
            reject(
              new Error('缺少 LINE User ID')
            );

            return;
          }

          const callbackName =
            '__cmwebs_home_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() * 1000000
            );

          const script =
            document.createElement('script');

          let finished = false;

          const timer =
            setTimeout(
              function () {
                if (finished) {
                  return;
                }

                finished = true;
                cleanup();
                reject(
                  new Error('API 載入逾時')
                );
              },
              Number(timeoutMs) ||
                JSONP_REQUEST_TIMEOUT_MS
            );

          function cleanup() {
            clearTimeout(timer);

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }

            try {
              delete window[callbackName];
            } catch (error) {
              window[callbackName] =
                undefined;
            }
          }

          window[callbackName] =
            function (result) {
              if (finished) {
                return;
              }

              finished = true;
              cleanup();
              if (window.CMWebsLandlordAuth.handleAuthFailure(result)) {
                const authError =
                  new Error(
                    result && result.message
                      ? result.message
                      : '房東身分已失效'
                  );
                authError.code =
                  result && result.code
                    ? result.code
                    : '';
                reject(authError);
                return;
              }
              resolve(result);
            };

          let url =
            API_URL +
            '?v2_action=' +
            encodeURIComponent(action) +
            '&callback=' +
            encodeURIComponent(
              callbackName
            ) +
            '&_=' +
            Date.now();

          if (TEST_MODE) {
            url += '&test=1';
          }

          Object.keys(
            requestParams
          ).forEach(function (key) {
            const value =
              requestParams[key];

            if (
              value === undefined ||
              value === null
            ) {
              return;
            }

            url +=
              '&' +
              encodeURIComponent(key) +
              '=' +
              encodeURIComponent(value);
          });

          script.charset =
            'UTF-8';

          script.onerror =
            function () {
              if (finished) {
                return;
              }

              finished = true;
              cleanup();
              reject(
                new Error(
                  'API 路由執行失敗，請確認綁定後端已重新部署'
                )
              );
            };

          try {
          script.src = window.CMWebsLiffRequestAuth.withIdToken(url);
        } catch (error) {
          cleanup();
          reject(error);
          return;
        }
          document.body.appendChild(script);
        }
      );
    }

    function shouldRetryDashboardRequest_(
      error,
      attempt,
      maxAttempts
    ) {
      return Boolean(
        error &&
        error.message === 'API 載入逾時' &&
        Number(attempt) < Number(maxAttempts)
      );
    }

    function jsonpRequest(
      action,
      params,
      options
    ) {
      const requestOptions =
        options || {};
      if (window.CMWebsLandlordApi) {
        return window.CMWebsLandlordApi.request({
          apiUrl: API_URL, action: action, params: params || {},
          lineUserId: LINE_USER_ID, testMode: TEST_MODE,
          timeoutMs: requestOptions.timeoutMs || JSONP_REQUEST_TIMEOUT_MS,
          maxAttempts: requestOptions.maxAttempts || 1,
          retryDelayMs: JSONP_REQUEST_RETRY_DELAY_MS
        });
      }
      const timeoutMs =
        Number(
          requestOptions.timeoutMs ||
            JSONP_REQUEST_TIMEOUT_MS
        );
      const maxAttempts =
        Math.max(
          1,
          Number(
            requestOptions.maxAttempts ||
              1
          )
        );
      const retryOnTimeout =
        requestOptions.retryOnTimeout ===
        true;

      let attempt = 0;

      return new Promise(
        function (resolve, reject) {
          function run() {
            attempt += 1;

            jsonpRequestOnce(
              action,
              params,
              timeoutMs
            ).then(
              resolve,
              function (error) {
                const isTimeout =
                  error &&
                  error.message ===
                    'API 載入逾時';

                if (
                  retryOnTimeout &&
                  isTimeout &&
                  shouldRetryDashboardRequest_(
                    error,
                    attempt,
                    maxAttempts
                  )
                ) {
                  setTimeout(
                    run,
                    JSONP_REQUEST_RETRY_DELAY_MS
                  );
                  return;
                }

                reject(error);
              }
            );
          }

          run();
        }
      );
    }

    function buildLandlordLoginRedirectUri() {
      const currentUrl =
        new URL(
          location.href
        );

      [
        'code',
        'state',
        'liff.state',
        'friendship_status_changed',
        'error',
        'error_description'
      ].forEach(
        function (key) {
          currentUrl.searchParams.delete(
            key
          );
        }
      );

      const returnTo =
        currentUrl.pathname
          .split('/')
          .pop() +
        (
          currentUrl.searchParams
            .toString()
            ? '?' +
              currentUrl.searchParams
                .toString()
            : ''
        );

      sessionStorage.setItem(
        'cmwebs_landlord_return_to',
        returnTo
      );

      const entryUrl =
        new URL(
          LANDLORD_ENTRY_URL
        );

      entryUrl.searchParams.set(
        'return_to',
        returnTo
      );

      return entryUrl.href;
    }

    function loadHomeLineSdk_() {
      if (window.liff && typeof window.liff.init === 'function') return Promise.resolve(window.liff);
      if (homeLineSdkPromise_) return homeLineSdkPromise_;
      // Email sessions never need this download. LINE still authenticates via
      // the same SDK, but the shell can paint while its async script arrives.
      homeLineSdkPromise_ = new Promise(function (resolve, reject) {
        const script = document.createElement('script');
        let settled = false;
        const timer = setTimeout(function () {
          finish(new Error('LIFF SDK 載入逾時，請重新整理再試'));
        }, 30000);
        function finish(error) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          script.onload = script.onerror = null;
          if (error) {
            script.remove();
            reject(error);
          } else resolve(window.liff);
        }
        script.async = true;
        script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
        script.onload = function () {
          finish(window.liff && typeof window.liff.init === 'function'
            ? null : new Error('LIFF SDK 載入失敗，請重新整理再試'));
        };
        script.onerror = function () { finish(new Error('LIFF SDK 載入失敗，請重新整理再試')); };
        document.head.appendChild(script);
      }).catch(function (error) {
        homeLineSdkPromise_ = null;
        throw error;
      });
      return homeLineSdkPromise_;
    }

    async function initLineUserId() {


      await loadHomeLineSdk_();

      await liff.init({
        liffId: LIFF_ID
      });

      if (!liff.isLoggedIn()) {
        liff.login({
          redirectUri:
            buildLandlordLoginRedirectUri()
        });

        return false;
      }

      const profile =
        await liff.getProfile();

      LINE_USER_ID =
        profile.userId || '';

      if (!LINE_USER_ID) {
        throw new Error(
          '無法取得房東 LINE User ID'
        );
      }

      return true;
    }

    function unwrapData(result) {
      if (
        result &&
        result.success === true
      ) {
        return (
          result.data !== undefined
            ? result.data
            : result
        );
      }

      const error = new Error(
        result && result.message
          ? result.message
          : '查詢失敗'
      );
      error.code = result && result.code || '';
      throw error;
    }

    function findSummaryNumber(
      summary,
      keys
    ) {
      summary =
        summary || {};

      for (
        let index = 0;
        index < keys.length;
        index += 1
      ) {
        const key =
          keys[index];

        if (
          summary[key] !== undefined &&
          summary[key] !== null &&
          summary[key] !== ''
        ) {
          return numberValue(
            summary[key]
          );
        }
      }

      return 0;
    }

    function countPendingPaymentReports(
      paymentData
    ) {
      const reports =
        paymentData &&
        Array.isArray(paymentData.reports)
          ? paymentData.reports
          : null;

      if (reports) {
        return reports.filter(function (report) {
          const status =
            String(
              report && report.status ||
              ''
            )
              .trim()
              .toLowerCase();

          return (
            status === 'pending' ||
            status === 'payment_reported'
          );
        }).length;
      }

      const summary =
        paymentData &&
        paymentData.summary
          ? paymentData.summary
          : {};

      return findSummaryNumber(
        summary,
        [
          'pending_count',
          'pending'
        ]
      );
    }

    function buildActionSummary(
      contractData,
      paymentData,
      messageData,
      initiatedContractData
    ) {
      const contractSummary =
        contractData &&
        contractData.summary
          ? contractData.summary
          : {};

      const messageSummary =
        messageData &&
        messageData.summary
          ? messageData.summary
          : {};

      const landlordInitiatedPending =
        countPendingLandlordInitiatedContracts(
          initiatedContractData
        );

      return {
        contractPending:
          findSummaryNumber(
            contractSummary,
            [
              'pending_count',
              'pending'
            ]
          ),

        contractApproved:
          findSummaryNumber(
            contractSummary,
            [
              'approved_count',
              'approved'
            ]
          ),

        landlordInitiatedPending:
          landlordInitiatedPending,

        paymentPending:
          countPendingPaymentReports(
            paymentData
          ),

        messagePending:
          findSummaryNumber(
            messageSummary,
            [
              'pending_count',
              'pending'
            ]
          ),

        messageProcessing:
          findSummaryNumber(
            messageSummary,
            [
              'processing_count',
              'processing'
            ]
          ),

        messageUrgent:
          findSummaryNumber(
            messageSummary,
            [
              'urgent_count',
              'urgent'
            ]
          )
      };
    }

    function countPendingLandlordInitiatedContracts(
      initiatedContractData
    ) {
      const items =
        initiatedContractData &&
        Array.isArray(initiatedContractData.items)
          ? initiatedContractData.items
          : [];

      return items.filter(function (contract) {
        const status = String(
          contract && (
            contract.contract_status ||
            contract.status
          ) || ''
        ).trim().toLowerCase();

        return [
          'pending',
          'awaiting_tenant',
          'tenant_signed',
          'pending_tenant_signature',
          'awaiting_tenant_signature'
        ].indexOf(status) >= 0;
      }).length;
    }

    function badgeHtml(
      count,
      emptyText,
      className
    ) {
      if (count > 0) {
        return (
          '<span class="badge ' +
          className +
          '">' +
          count +
          ' 筆</span>'
        );
      }

      return (
        '<span class="badge green">' +
        safeHtml(
          emptyText || '無待處理'
        ) +
        '</span>'
      );
    }

    function normaliseLandlordDashboardData_(
      data
    ) {
      const input =
        data &&
        typeof data === 'object'
          ? data
          : {};

      const months =
        Array.isArray(input.months)
          ? input.months
              .map(function (row) {
                const item =
                  row &&
                  typeof row === 'object'
                    ? row
                    : {};

                const month =
                  String(
                    item.month ||
                    item.bill_month ||
                    ''
                  ).trim();

                if (!month) {
                  return null;
                }

                const amount =
                  function (value) {
                    const number =
                      Number(value);

                    return Number.isFinite(
                      number
                    ) &&
                      number >= 0
                      ? number
                      : 0;
                  };

                return {
                  month: month,
                  receivable: amount(
                    item.receivable
                  ),
                  collected: amount(
                    item.collected
                  ),
                  outstanding: amount(
                    item.outstanding
                  )
                };
              })
              .filter(function (row) {
                return Boolean(row);
              })
          : [];

      const occupancyInput =
        input.occupancy &&
        typeof input.occupancy === 'object'
          ? input.occupancy
          : {};
      const occupancyRate =
        Number(
          occupancyInput.occupancy_rate
        );

      const contractExpiry =
        Array.isArray(input.contract_expiry)
          ? input.contract_expiry.map(
              function (row) {
                const item =
                  row &&
                  typeof row === 'object'
                    ? row
                    : {};
                const count =
                  Number(item.count);

                return {
                  bucket: String(
                    item.bucket || ''
                  ).trim(),
                  label: String(
                    item.label || ''
                  ).trim(),
                  count: Number.isFinite(
                    count
                  ) && count >= 0
                    ? count
                    : 0
                };
              }
            )
          : [];

      return {
        months: months,
        occupancy: {
          occupancy_rate:
            Number.isFinite(occupancyRate) &&
            occupancyRate >= 0
              ? Math.min(
                  Math.max(occupancyRate, 0),
                  1
                )
              : 0
        },
        contract_expiry: contractExpiry
      };
    }

    function contractExpiryBuckets_(
      rows
    ) {
      const bucketDefinitions = [
        {
          key: '30d',
          label: '30 天',
          aliases: ['30d', '0-30']
        },
        {
          key: '60d',
          label: '60 天',
          aliases: ['60d', '31-60']
        },
        {
          key: '90d',
          label: '90 天',
          aliases: ['90d', '61-90']
        }
      ];

      return bucketDefinitions.map(
        function (definition) {
          const row =
            (Array.isArray(rows)
              ? rows
              : []
            ).find(function (item) {
              const bucket = String(
                item && item.bucket
                  ? item.bucket
                  : ''
              ).trim();

              return (
                definition.aliases.indexOf(
                  bucket
                ) >= 0
              );
            });
          const count = Number(
            row && row.count
          );

          return {
            key: definition.key,
            label: definition.label,
            count:
              Number.isFinite(count) &&
              count >= 0
                ? count
                : 0
          };
        }
      );
    }

    function dashboardSeriesColor_(
      key
    ) {
      const colors = {
        receivable: '#2F6FED',
        collected: '#06C755',
        outstanding: '#FF6259'
      };

      return (
        colors[key] ||
        '#64748B'
      );
    }

    function dashboardNumber_(
      value
    ) {
      const number =
        Number(value);

      return Number.isFinite(number) &&
        number >= 0
        ? number
        : 0;
    }

    function dashboardMoney_(
      value
    ) {
      return (
        'NT$ ' +
        Math.round(
          dashboardNumber_(value)
        ).toLocaleString('zh-TW')
      );
    }

    function dashboardTrendTotals_(
      rows
    ) {
      return (
        Array.isArray(rows)
          ? rows
          : []
      ).reduce(
        function (totals, row) {
          const item =
            row &&
            typeof row === 'object'
              ? row
              : {};
          const amount =
            function (value) {
              const number =
                Number(value);

              return Number.isFinite(
                number
              ) && number >= 0
                ? number
                : 0;
            };

          totals.receivable += amount(
            item.receivable
          );
          totals.collected += amount(
            item.collected
          );
          totals.outstanding += amount(
            item.outstanding
          );
          return totals;
        },
        {
          receivable: 0,
          collected: 0,
          outstanding: 0
        }
      );
    }

    function dashboardPercent_(
      value
    ) {
      return (
        Math.round(
          dashboardNumber_(value) * 100
        ) +
        '%'
      );
    }

    function dashboardEscape_(
      value
    ) {
      return String(
        value === undefined ||
          value === null
          ? ''
          : value
      )
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Geometry for the collected-income curve. Kept separate from the SVG so
    // the scrub handler and tests share one source of truth.
    function dashboardTrendGeometry_(
      rows
    ) {
      const width = 360;
      const height = 170;
      const padX = 14;
      const top = 14;
      const bottom = 26;
      const plotHeight = height - top - bottom;
      const safeRows =
        Array.isArray(rows)
          ? rows.slice(-12)
          : [];
      const values = safeRows.map(function (row) {
        return dashboardNumber_(row && row.collected);
      });
      const max = Math.max(1, ...values);
      const min = values.length ? Math.min(...values) : 0;
      const span = Math.max(max - min, max * 0.08, 1);
      const floor = Math.max(0, min - span * 0.35);
      const ceiling = max + span * 0.12;
      const points = values.map(function (value, index) {
        return {
          x: safeRows.length <= 1
            ? width / 2
            : padX + ((width - padX * 2) * index) / (safeRows.length - 1),
          y: top + plotHeight - ((value - floor) / (ceiling - floor)) * plotHeight,
          value: value,
          month: String(safeRows[index] && safeRows[index].month || '')
        };
      });
      let line = '';
      points.forEach(function (point, index) {
        const xy = function (p) { return p.x.toFixed(1) + ' ' + p.y.toFixed(1); };
        if (index === 0) {
          line = 'M' + xy(point);
          return;
        }
        // Catmull-Rom to cubic Bezier: a smooth curve through every month.
        const p0 = points[index - 2] || points[index - 1];
        const p1 = points[index - 1];
        const p3 = points[index + 1] || point;
        line += ' C' + xy({ x: p1.x + (point.x - p0.x) / 6, y: p1.y + (point.y - p0.y) / 6 }) +
          ' ' + xy({ x: point.x - (p3.x - p1.x) / 6, y: point.y - (p3.y - p1.y) / 6 }) +
          ' ' + xy(point);
      });
      return {
        width: width,
        height: height,
        padX: padX,
        baseline: height - bottom,
        points: points,
        line: line,
        area: points.length
          ? line + ' L' + points[points.length - 1].x.toFixed(1) + ' ' + (height - bottom) +
            ' L' + points[0].x.toFixed(1) + ' ' + (height - bottom) + ' Z'
          : ''
      };
    }

    function dashboardLineChartSvg_(
      rows
    ) {
      const geometry =
        dashboardTrendGeometry_(rows);
      const last =
        geometry.points[geometry.points.length - 1];
      const grid = [0.25, 0.5, 0.75]
        .map(function (ratio) {
          const gridY = (geometry.baseline * ratio).toFixed(1);
          return '<line x1="0" y1="' + gridY + '" x2="' + geometry.width + '" y2="' + gridY +
            '" stroke="#E6EBF0" stroke-dasharray="3 5"/>';
        })
        .join('');
      const monthLabels = geometry.points
        .map(function (point, index) {
          return '<text x="' + point.x.toFixed(1) + '" y="' + (geometry.height - 6) +
            '" text-anchor="middle" fill="#6B7785" font-size="10">' +
            dashboardEscape_(String(Number(point.month.slice(-2)) || point.month.slice(-2) || '-')) +
            '月</text>';
        })
        .join('');
      const summary = geometry.points
        .map(function (point) {
          return point.month + ' 已收 ' + dashboardMoney_(point.value);
        })
        .join('，');

      return (
        '<svg id="landlordRevenueChart" viewBox="0 0 ' +
        geometry.width +
        ' ' +
        geometry.height +
        '" role="img" aria-label="近 12 個月已收收入曲線：' + dashboardEscape_(summary) + '">' +
        '<title>近 12 個月已收收入曲線</title>' +
        grid +
        (geometry.points.length
          ? '<path class="home-trend-area dashboard-entrance" d="' + geometry.area + '" fill="' +
            dashboardSeriesColor_('collected') + '" fill-opacity="0.12"/>' +
            '<path class="dashboard-line dashboard-entrance" pathLength="1" d="' + geometry.line +
            '" fill="none" stroke="' + dashboardSeriesColor_('collected') +
            '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-series="collected"/>' +
            '<line class="home-trend-guide" data-trend-guide x1="' + last.x.toFixed(1) + '" x2="' + last.x.toFixed(1) +
            '" y1="0" y2="' + geometry.baseline + '" stroke="#9AA4B5" stroke-dasharray="3 4"/>' +
            '<circle class="dashboard-point dashboard-entrance home-trend-dot" data-trend-dot style="--point-delay:900ms" cx="' +
            last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="5.5" fill="' + dashboardSeriesColor_('collected') +
            '" stroke="#fff" stroke-width="3"/>'
          : '') +
        monthLabels +
        '</svg>'
      );
    }

    function dashboardDonutSvg_(
      occupancyRate
    ) {
      const ratio = Math.min(
        Math.max(
          dashboardNumber_(
            occupancyRate
          ),
          0
        ),
        1
      );
      const radius = 42;
      const circumference =
        2 * Math.PI * radius;

      return (
        '<svg id="landlordOccupancyChart" viewBox="0 0 120 120" role="img" aria-label="入住率 ' +
        dashboardEscape_(
          dashboardPercent_(ratio)
        ) +
        '"><title>入住率 ' +
        dashboardEscape_(
          dashboardPercent_(ratio)
        ) +
        '</title><circle cx="60" cy="60" r="' +
        radius +
        '" fill="none" stroke="#E7EDF0" stroke-width="13"/><g class="dashboard-orbit"><circle class="dashboard-arc dashboard-entrance" cx="60" cy="60" r="' +
        radius +
        '" fill="none" stroke="#06C755" stroke-width="13" stroke-linecap="' + (ratio === 0 ? 'butt' : 'round') + '" stroke-dasharray="' +
        (circumference * ratio).toFixed(1) +
        ' ' +
        circumference.toFixed(1) +
        '" transform="rotate(-90 60 60)"/></g><text x="60" y="65" text-anchor="middle" fill="#17211B" font-size="20" font-weight="900">' +
        dashboardEscape_(
          dashboardPercent_(ratio)
        ) +
        '</text></svg>'
      );
    }

    function dashboardExpiryChartSvg_(
      rows
    ) {
      const buckets =
        contractExpiryBuckets_(rows);
      const width = 220;
      const height = 160;
      const baseline = 124;
      const max = Math.max(
        1,
        ...buckets.map(function (row) {
          return dashboardNumber_(
            row.count
          );
        })
      );
      const bars = buckets
        .map(function (row, index) {
          const barWidth = 29;
          const gap = 31;
          const x = 17 + index * (barWidth + gap);
          const barHeight =
            (dashboardNumber_(row.count) /
              max) *
            84;
          const y = baseline - barHeight;

          return (
            '<rect class="dashboard-bar dashboard-entrance" style="--bar-delay:' + (index * 90) + 'ms" x="' +
            x +
            '" y="' +
            y.toFixed(1) +
            '" width="' +
            barWidth +
            '" height="' +
            barHeight.toFixed(1) +
            '" rx="6" fill="#06C755" aria-label="' +
            dashboardEscape_(
              row.label +
                ' ' +
                row.count +
                ' 份'
            ) +
            '"/><text x="' +
            (x + barWidth / 2) +
            '" y="' +
            Math.max(y - 7, 12).toFixed(1) +
            '" text-anchor="middle" fill="#17211B" font-size="13" font-weight="900">' +
            dashboardEscape_(row.count) +
            '</text><text x="' +
            (x + barWidth / 2) +
            '" y="' +
            (baseline + 19) +
            '" text-anchor="middle" fill="#6B7785" font-size="10">' +
            dashboardEscape_(row.label) +
            '</text>'
          );
        })
        .join('');

      return (
        '<svg id="landlordContractExpiryChart" viewBox="0 0 ' +
        width +
        ' ' +
        height +
        '" role="img" aria-label="合約到期 30 天、60 天、90 天分布">' +
        '<title>合約到期 30 天、60 天、90 天分布</title><line x1="8" y1="' +
        baseline +
        '" x2="' +
        (width - 8) +
        '" y2="' +
        baseline +
        '" stroke="#DCE4E8"/>' +
        bars +
        '</svg>'
      );
    }

    function renderLandlordDashboardCharts_(
      data
    ) {
      const host =
        document.getElementById(
          'landlordDashboardState'
        );

      if (!host) {
        return;
      }

      const report =
        normaliseLandlordDashboardData_(
          data
        );
      const rows = report.months;
      const trendTotals =
        dashboardTrendTotals_(rows);
      const trendRows = rows.slice(-12);
      const firstRow = trendRows[0];
      const lastRow = trendRows[trendRows.length - 1];
      const growth = dashboardTrendDelta_(
        firstRow && firstRow.collected,
        lastRow && lastRow.collected
      );
      const shownCollected =
        typeof homeShown_ !== 'undefined' && homeShown_ ? homeShown_.collectedTotal : null;
      const collectedDisplay =
        typeof homeRollingMoney_ === 'function'
          ? homeRollingMoney_(trendTotals.collected, shownCollected)
          : dashboardMoney_(trendTotals.collected);
      if (typeof homeShown_ !== 'undefined' && homeShown_) homeShown_.collectedTotal = trendTotals.collected;

      host.innerHTML = `
        <div class="dashboard-motion-toolbar">
          <div class="dashboard-motion-copy"><strong>營運數據，一目了然</strong><span data-motion-status></span></div>
          <button type="button" class="dashboard-motion-toggle" data-motion-toggle aria-pressed="false" aria-controls="landlordRevenueChart landlordOccupancyChart landlordContractExpiryChart">暫停動畫</button>
        </div>
        <section class="dashboard-card trend-card home-trend">
          <div class="dashboard-section-heading">
            <div>
              <div class="dashboard-section-title">近 12 個月收租趨勢</div>
              <div class="dashboard-section-subtitle" data-trend-label>近 12 個月已收合計</div>
            </div>
            <a class="dashboard-detail-link" href="landlord-revenue-dashboard.html">查看收入明細</a>
          </div>
          <div class="home-trend-value home-roll" data-trend-value aria-live="polite">${collectedDisplay}</div>
          <div class="home-trend-delta">
            <span class="home-delta" data-trend-delta data-direction="${growth.direction}">${dashboardEscape_(growth.text)}</span>
            <span data-trend-delta-label>${firstRow && lastRow ? dashboardEscape_(lastRow.month + ' 對比 ' + firstRow.month + ' 月已收') : '尚無收款紀錄'}</span>
          </div>
          <div class="dashboard-chart-scroll home-trend-chart" data-trend-chart tabindex="0" aria-label="收入曲線，可用左右方向鍵逐月查看">
            ${dashboardLineChartSvg_(rows)}
          </div>
          <div class="dashboard-chart-values-caption">近 12 個月合計</div>
          <div class="dashboard-chart-values">
            <span aria-label="近 12 個月應收 ${dashboardMoney_(trendTotals.receivable)}">應收 <strong>${dashboardMoney_(trendTotals.receivable)}</strong></span>
            <span aria-label="近 12 個月已收 ${dashboardMoney_(trendTotals.collected)}">已收 <strong>${dashboardMoney_(trendTotals.collected)}</strong></span>
            <span aria-label="近 12 個月欠款 ${dashboardMoney_(trendTotals.outstanding)}">欠款 <strong>${dashboardMoney_(trendTotals.outstanding)}</strong></span>
          </div>
        </section>
        <section class="dashboard-card operations-card">
          <div class="dashboard-section-title">營運狀況</div>
          <div class="dashboard-operation-grid">
            <div class="dashboard-operation-item">
              <div class="dashboard-operation-label">入住率</div>
              ${dashboardDonutSvg_(report.occupancy.occupancy_rate)}
            </div>
            <div class="dashboard-operation-item">
              <div class="dashboard-operation-label">合約到期</div>
              ${dashboardExpiryChartSvg_(report.contract_expiry)}
            </div>
          </div>
        </section>
      `;
      attachTrendScrub_(host, trendRows, trendTotals.collected);
      if (typeof CMWebsHomeMotion !== 'undefined') CMWebsHomeMotion.mount(host);
    }

    function dashboardTrendDelta_(
      from,
      to
    ) {
      const start = dashboardNumber_(from);
      const end = dashboardNumber_(to);
      if (start <= 0) {
        return { direction: 'flat', text: end > 0 ? '新增收入' : '—' };
      }
      const change = (end - start) / start * 100;
      return {
        direction: change > 0.05 ? 'up' : change < -0.05 ? 'down' : 'flat',
        text: (change > 0.05 ? '+' : change < -0.05 ? '−' : '') + Math.abs(change).toFixed(1) + '%'
      };
    }

    // Pointer, touch and arrow keys pick a month on the curve; leaving the
    // chart returns to the 12-month total. Pure presentation: no requests.
    function attachTrendScrub_(
      host,
      rows,
      collectedTotal
    ) {
      const chart = host && host.querySelector && host.querySelector('[data-trend-chart]');
      if (!chart || !rows.length || typeof chart.addEventListener !== 'function') return;
      const geometry = dashboardTrendGeometry_(rows);
      const valueNode = host.querySelector('[data-trend-value]');
      const labelNode = host.querySelector('[data-trend-label]');
      const deltaNode = host.querySelector('[data-trend-delta]');
      const deltaLabelNode = host.querySelector('[data-trend-delta-label]');
      const dot = host.querySelector('[data-trend-dot]');
      const guide = host.querySelector('[data-trend-guide]');
      let selected = null;
      let shown = collectedTotal;

      function paint(index) {
        if (index === selected) return;
        selected = index;
        const point = index === null ? geometry.points[geometry.points.length - 1] : geometry.points[index];
        const amount = index === null ? collectedTotal : point.value;
        const delta = index === null
          ? dashboardTrendDelta_(geometry.points[0].value, point.value)
          : dashboardTrendDelta_(index > 0 ? geometry.points[index - 1].value : 0, point.value);
        // Scrubbing swaps figures instantly; only the return to the total rolls.
        if (valueNode) valueNode.innerHTML = index === null ? homeRollingMoney_(amount, shown) : homeStaticMoney_(amount);
        shown = amount;
        if (labelNode) labelNode.textContent = index === null ? '近 12 個月已收合計' : point.month + ' 已收';
        if (deltaNode) {
          deltaNode.textContent = index !== null && index === 0 ? '—' : delta.text;
          deltaNode.setAttribute('data-direction', index !== null && index === 0 ? 'flat' : delta.direction);
        }
        if (deltaLabelNode) {
          deltaLabelNode.textContent = index === null
            ? point.month + ' 對比 ' + geometry.points[0].month + ' 月已收'
            : index === 0 ? '圖表第一個月' : '較 ' + geometry.points[index - 1].month;
        }
        [dot, guide].forEach(function (node) {
          if (!node) return;
          if (node === dot) {
            node.setAttribute('cx', point.x.toFixed(1));
            node.setAttribute('cy', point.y.toFixed(1));
          } else {
            node.setAttribute('x1', point.x.toFixed(1));
            node.setAttribute('x2', point.x.toFixed(1));
          }
        });
        chart.setAttribute('data-scrubbing', index === null ? 'false' : 'true');
      }

      function indexAt(clientX) {
        const rect = chart.getBoundingClientRect();
        if (!rect.width) return null;
        const viewX = (clientX - rect.left) / rect.width * geometry.width;
        const ratio = Math.min(1, Math.max(0, (viewX - geometry.padX) / (geometry.width - geometry.padX * 2)));
        return Math.round(ratio * (geometry.points.length - 1));
      }

      chart.addEventListener('pointermove', function (event) { paint(indexAt(event.clientX)); });
      chart.addEventListener('pointerdown', function (event) { paint(indexAt(event.clientX)); });
      chart.addEventListener('pointerleave', function () { paint(null); });
      chart.addEventListener('pointercancel', function () { paint(null); });
      chart.addEventListener('blur', function () { paint(null); });
      chart.addEventListener('keydown', function (event) {
        const lastIndex = geometry.points.length - 1;
        const current = selected === null ? lastIndex : selected;
        if (event.key === 'ArrowLeft') paint(Math.max(0, current - 1));
        else if (event.key === 'ArrowRight') paint(Math.min(lastIndex, current + 1));
        else if (event.key === 'Escape') paint(null);
        else return;
        event.preventDefault();
      });
    }

    function renderLandlordDashboardError_(
      message
    ) {
      if (typeof CMWebsHomeMotion !== 'undefined') CMWebsHomeMotion.unmount();
      const host =
        document.getElementById(
          'landlordDashboardState'
        );

      if (!host) {
        return;
      }

      host.innerHTML = `
        <section class="dashboard-card dashboard-chart-error" role="alert">
          <div class="dashboard-section-title">圖表暫時無法載入</div>
          <div class="dashboard-section-subtitle">${dashboardEscape_(message || '請稍後再試')}</div>
          <button class="dashboard-retry-button" type="button" onclick="loadDashboardReport_()">重新載入圖表</button>
        </section>
      `;
    }

    let dashboardReportRequest_ =
      null;

    let pageRequestToken_ = 0;
    let homeLoadInProgress_ = false;
    let homeRendered_ = false;
    // Last amounts painted on screen, so a refresh rolls only the changed digits.
    let homeShown_ = null;

    const HOME_CACHE_STORAGE_KEY = 'cmwebs_landlord_home_cache_v1';
    const HOME_CACHE_TTL_MS = 24 * 60 * 60 * 1000;

    function homeMotionAllowed_() {
      try {
        return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      } catch (error) {
        return true;
      }
    }

    // Same visual structure as the rolling markup, without motion.
    function homeStaticMoney_(value) {
      const amount = Math.round(dashboardNumber_(value)).toLocaleString('zh-TW');
      return '<span class="av-number" role="img" aria-label="NT$ ' + amount + '"><span class="av-number-visual" aria-hidden="true">' +
        '<span class="av-number-currency">NT$&nbsp;</span>' + amount + '</span></span>';
    }

    function homeRollingMoney_(value, previous) {
      const roller = window.CMWebsAssetValuation && window.CMWebsAssetValuation.rollingMoney;
      if (typeof roller !== 'function') return homeStaticMoney_(value);
      const html = roller(dashboardNumber_(value), previous === null || previous === undefined ? null : dashboardNumber_(previous), homeMotionAllowed_());
      return html.indexOf('av-number-visual') >= 0 ? html : homeStaticMoney_(value);
    }

    function homeGreeting_(date) {
      const hour = (date || new Date()).getHours();
      if (hour < 5) return '夜深了';
      if (hour < 11) return '早安';
      if (hour < 14) return '午安';
      if (hour < 18) return '下午好';
      return '晚安';
    }

    function homeClockLabel_(timestamp) {
      const date = new Date(Number(timestamp));
      if (!Number.isFinite(date.getTime())) return '上次';
      return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function setHomeLiveStatus_(state, text) {
      const status = document.getElementById('homeLiveStatus');
      if (!status) return;
      status.setAttribute('data-state', state);
      status.innerHTML = '<i aria-hidden="true"></i><span>' + safeHtml(text) + '</span>';
    }

    // Browser snapshot of the last successful homepage read (ADR 2026-10-11).
    // It is bound to a one-way hash of the signed-in identity, expires after a
    // day and is cleared by logout or any authorization failure, so a shared
    // device never shows another account's figures.
    function homeCacheStore_() {
      try {
        return window.localStorage || null;
      } catch (error) {
        return null;
      }
    }

    async function homeCacheIdentity_() {
      if (TEST_MODE || !window.CMWebsLandlordAuth) return '';
      const auth = window.CMWebsLandlordAuth.getRequestAuthParams() || {};
      const raw = auth.landlord_session_token
        ? 'email:' + auth.landlord_session_token
        : auth.line_user_id ? 'line:' + auth.line_user_id : '';
      const subtle = window.crypto && window.crypto.subtle;
      if (!raw || !subtle || typeof TextEncoder === 'undefined') return '';
      const digest = await subtle.digest('SHA-256', new TextEncoder().encode('cmwebs-home-cache:' + raw));
      return Array.from(new Uint8Array(digest)).map(function (byte) {
        return byte.toString(16).padStart(2, '0');
      }).join('');
    }

    function clearHomeCache_() {
      const store = homeCacheStore_();
      try {
        if (store) store.removeItem(HOME_CACHE_STORAGE_KEY);
      } catch (error) {}
    }

    function readHomeCache_(identity, now) {
      const store = homeCacheStore_();
      if (!store || !identity) return null;
      try {
        const entry = JSON.parse(store.getItem(HOME_CACHE_STORAGE_KEY) || 'null');
        if (!entry) return null;
        const age = (now || Date.now()) - Number(entry.saved_at);
        if (entry.v !== 1 || entry.id !== identity || !(age >= 0 && age < HOME_CACHE_TTL_MS) || !entry.home) {
          clearHomeCache_();
          return null;
        }
        return entry;
      } catch (error) {
        clearHomeCache_();
        return null;
      }
    }

    function writeHomeCache_(identity, patch, now) {
      const store = homeCacheStore_();
      if (!store || !identity) return;
      try {
        const current = JSON.parse(store.getItem(HOME_CACHE_STORAGE_KEY) || 'null');
        const base = current && current.v === 1 && current.id === identity ? current : { v: 1, id: identity };
        const next = Object.assign({}, base, patch);
        if (patch.home) next.saved_at = now || Date.now();
        if (!next.home) return;
        store.setItem(HOME_CACHE_STORAGE_KEY, JSON.stringify(next));
      } catch (error) {
        clearHomeCache_();
      }
    }

    function requestDashboardReport_(
      requestToken
    ) {
      const activeToken =
        Number.isFinite(
          Number(requestToken)
        )
          ? Number(requestToken)
          : pageRequestToken_;

      if (
        dashboardReportRequest_ &&
        dashboardReportRequest_.token ===
          activeToken
      ) {
        return dashboardReportRequest_.promise;
      }

      const reportPromise =
        jsonpRequest(
          'landlord_revenue_dashboard_init',
          { range: '12m' },
          {
            maxAttempts:
              JSONP_REQUEST_MAX_ATTEMPTS,
            retryOnTimeout: true
          }
        );

      dashboardReportRequest_ = {
        token: activeToken,
        promise: reportPromise
      };

      return reportPromise;
    }

    function loadDashboardReport_(
      requestToken,
      pendingPromise
    ) {
      const activeToken =
        Number.isFinite(
          Number(requestToken)
        )
          ? Number(requestToken)
          : pageRequestToken_;

      const host =
        document.getElementById(
          'landlordDashboardState'
        );

      if (!host) {
        return Promise.resolve(null);
      }

      host.setAttribute(
        'aria-busy',
        'true'
      );

      const reportPromise =
        dashboardReportRequest_ &&
        dashboardReportRequest_.token ===
          activeToken
          ? dashboardReportRequest_.promise
          : pendingPromise ||
            requestDashboardReport_(
              activeToken
            );

      return reportPromise
          .then(function (result) {
            if (
              activeToken !==
              pageRequestToken_
            ) {
              return null;
            }

            const report =
              unwrapData(result);

            renderLandlordDashboardCharts_(
              report
            );

            return report;
          })
          .catch(function (error) {
            if (
              activeToken ===
              pageRequestToken_
            ) {
              renderLandlordDashboardError_(
                error && error.message
                  ? error.message
                  : String(error)
              );
            }

            return null;
          })
          .finally(function () {
            host.removeAttribute(
              'aria-busy'
            );

            if (
              dashboardReportRequest_ &&
              dashboardReportRequest_.token ===
                activeToken
            ) {
              dashboardReportRequest_ =
                null;
            }
          });
    }

    function setRefreshLoading(
      loading
    ) {
      const button =
        document.getElementById(
          'refreshButton'
        );

      if (!button) {
        return;
      }

      button.disabled = Boolean(loading);
      button.setAttribute('aria-busy', String(Boolean(loading)));
      button.setAttribute('aria-label', loading ? '更新中' : '重新整理');

      button.classList.toggle(
        'loading',
        Boolean(loading)

    // After the homepage settles, warm the most used inner pages one at a
    // time so their first tap paints from a snapshot instead of a blank page.
    let innerPagePrefetchScheduled_ = false;
    function scheduleInnerPagePrefetch_() {
      const api = window.CMWebsLandlordApi;
      if (innerPagePrefetchScheduled_ || TEST_MODE || !api || typeof api.prefetch !== 'function') return;
      innerPagePrefetchScheduled_ = true;
      const auth = window.CMWebsLandlordAuth ? window.CMWebsLandlordAuth.getRequestAuthParams() : {};
      const reads = [
        { action: 'landlord_tenants', params: {} },
        { action: 'landlord_room_center_init', params: { include_archived: '1' } }
      ];
      // Arrears is LINE-only; the desktop Email bridge does not serve it.
      if (!auth.landlord_session_token) reads.push({ action: 'landlord_arrears', params: {} });
      setTimeout(function () {
        reads.reduce(function (chain, read) {
          return chain.then(function () {
            return api.prefetch({
              apiUrl: API_URL, action: read.action, params: read.params,
              lineUserId: LINE_USER_ID, testMode: TEST_MODE, maxAttempts: 1,
              callbackPrefix: '__cmwebs_prefetch_'
            });
          });
        }, Promise.resolve());
      }, 1500);
    }

    async function loadPage() {
      if (homeLoadInProgress_) return;
      homeLoadInProgress_ = true;
      const requestToken =
        pageRequestToken_ + 1;

      pageRequestToken_ =
        requestToken;

      setRefreshLoading(true);

      try {
        const ready =
          await ensureLandlordAuthReady();

        if (!ready) {
          return;
        }

        // The three independent reads start together. Each one is painted
        // only once the core shell exists, so a slow chart or action count
        // never delays the first useful screen.
        const homePromise = jsonpRequest(
          'landlord_home_bootstrap',
          { section: 'home' },
          { maxAttempts: 1 }
        );
        const actionsPromise = jsonpRequest(
          'landlord_home_bootstrap', { section: 'actions', read_view: 'summary' }, { maxAttempts: 1 }
        );
        const dashboardReportPromise = requestDashboardReport_(requestToken);
        homePromise.catch(function () {});
        actionsPromise.catch(function () {});
        dashboardReportPromise.catch(function () {});

        const cacheIdentity = await homeCacheIdentity_().catch(function () { return ''; });
        if (requestToken !== pageRequestToken_) return;
        const cached = homeRendered_ ? null : readHomeCache_(cacheIdentity);
        if (cached) {
          renderHome(cached.home, cached.action_summary || null, false, { staleSavedAt: cached.saved_at });
          homeRendered_ = true;
          if (cached.report) renderLandlordDashboardCharts_(cached.report);
          if (cached.action_summary) {
            const status = document.getElementById('homeActionStatus');
            if (status) status.textContent = '顯示上次待辦數量，更新中';
          }
        }
        dashboardReportPromise.then(function (result) {
          if (requestToken === pageRequestToken_) writeHomeCache_(cacheIdentity, { report: unwrapData(result) });
        }).catch(function () {});

        const homeResult =
          await homePromise;
        const home = unwrapData(homeResult).home || {};
        if (requestToken !== pageRequestToken_) return;
        renderHome(home, cached && cached.action_summary || null, false, { keepDashboard: Boolean(cached) });
        homeRendered_ = true;
        writeHomeCache_(cacheIdentity, { home: home });
        if (cached && cached.action_summary) {
          const status = document.getElementById('homeActionStatus');
          if (status) status.textContent = '顯示上次待辦數量，更新中';
        }

        // Secondary work cannot delay the useful first render. Both sections
        // remain independently usable if the other fails.
        loadDashboardReport_(requestToken, dashboardReportPromise);
        try {
          const bootstrap = unwrapData(await actionsPromise);
          if (requestToken !== pageRequestToken_) return;
          const actionSummary = buildActionSummary(
            bootstrap.contract_requests || {}, bootstrap.payment_reports || {},
            bootstrap.messages || {}, bootstrap.landlord_initiated_contracts || {}
          );
          renderHome(home, actionSummary, true);
          writeHomeCache_(cacheIdentity, { action_summary: actionSummary });
          scheduleInnerPagePrefetch_();
        } catch (error) {
          if (requestToken !== pageRequestToken_) return;
          if (/AUTH|SESSION|FORBIDDEN|PERMISSION|WORKSPACE|MEMBERSHIP/.test(error.code || '')) throw error;
          const status = document.getElementById('homeActionStatus');
          if (status) status.textContent = '待辦數量暫時無法更新；可直接進入功能查看';
        }
      } catch (error) {
        if (
          requestToken ===
          pageRequestToken_
        ) {
          const message = error && error.message ? error.message : String(error);
          const transient = /API_TIMEOUT|API_NETWORK_ERROR/.test(error.code || '') ||
            /API 載入逾時|網路/.test(message);
          if (homeRendered_ && transient) {
            setHomeLiveStatus_('error', '無法更新，畫面為上次資料');
            showToast('更新失敗，畫面保留上次資料：' + message);
          } else {
            // Authorization or data errors must never leave old figures behind.
            clearHomeCache_();
            homeShown_ = null;
            homeRendered_ = false;
            renderError(message);
          }
        }
      } finally {
        if (requestToken === pageRequestToken_) {
          homeLoadInProgress_ = false;
          setRefreshLoading(false);
        }
      }
    }

    setAppHeight();

    window.addEventListener(
      'resize',
      setAppHeight
    );

    window.addEventListener(
      'orientationchange',
      function () {
        setTimeout(
          setAppHeight,
          250
        );
      }
    );

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        'resize',
        setAppHeight
      );
    }

    loadPage();
  </script>
</body>
</html>
