name: Rental source and unit verification
on:
  push:
    branches: [main, codex/subscription-membership-transfer-20261011]
  pull_request:
jobs:
  rental:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix cloudflare/read-api
      - run: npm run validate
      - run: npm run test:unit
  read-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/read-api/package-lock.json
      - run: npm ci --prefix cloudflare/read-api
      - name: Worker tests with retained raw diagnostics
        run: |
          set -o pipefail
          npm run test:worker 2>&1 | tee "$RUNNER_TEMP/cmwebs-read-worker.log"
      - name: Bounded terminal Worker evidence
        if: always()
        run: node scripts/summarize-read-worker-ci.mjs "$RUNNER_TEMP/cmwebs-read-worker.log"
      - run: npm run dry-run:worker
