name: Rental source and unit verification
on:
  push:
    branches: [main, codex/subscription-membership-transfer-20261011]
  pull_request:
jobs:
  rental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run test:unit
