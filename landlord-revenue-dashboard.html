<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CMWebs 營收儀表板</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="frontend-release.js"></script>
  <style>
    :root { --app-height: 100vh; --nav-height: 64px; --ink: #152238; --muted: #6b778c; --line: #e5eaf1; --brand: #06c755; --blue: #246bfd; --surface: #fff; --canvas: #f4f7fb; --danger: #c83c4a; }
    * { box-sizing: border-box; }
    html, body { height:100%; overflow:hidden; }
    body { margin:0; color:var(--ink); background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    button, select { font:inherit; }
    .app-shell { position:relative; height:var(--app-height); overflow:hidden; width:100%; max-width:560px; margin:0 auto; background:var(--canvas); }
    .page { height:100%; overflow-y:auto; padding:18px 16px calc(var(--nav-height) + 28px + env(safe-area-inset-bottom)); }
    .header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .eyebrow { margin:0 0 5px; color:var(--brand); font-size:12px; font-weight:900; letter-spacing:.06em; }
    h1 { margin:0; font-size:25px; line-height:1.2; }
    .subtitle { margin:7px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .refresh { border:1px solid var(--line); border-radius:11px; padding:9px 11px; background:var(--surface); color:var(--ink); cursor:pointer; }
    .card { margin-bottom:12px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:0 2px 8px rgba(24,39,75,.04); }
    .filters { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:13px; }
    .field label { display:block; margin:0 0 5px; color:var(--muted); font-size:11px; font-weight:800; }
    .field select { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; color:var(--ink); }
    .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); overflow:hidden; }
    .metric { min-height:88px; padding:14px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .metric:nth-child(2n) { border-right:0; }
    .metric:nth-last-child(-n+2) { border-bottom:0; }
    .metric-label { color:var(--muted); font-size:12px; }
    .metric-value { margin-top:7px; font-size:23px; font-weight:900; }
    .metric-value.green { color:#168653; }
    .metric-value.red { color:var(--danger); }
    .section { padding:16px; }
    .section-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:11px; }
    .section-title { font-size:16px; font-weight:900; }
    .section-hint { color:var(--muted); font-size:11px; }
    .chart-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:#fbfcfe; padding:8px; }
    #revenueChart { display:block; width:100%; min-width:510px; height:auto; }
    .visual-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .visual-card { min-width:0; padding:14px; border:1px solid var(--line); border-radius:14px; background:#fbfcfe; }
    .visual-card.wide { grid-column:1 / -1; }
    .visual-title { margin-bottom:9px; font-size:14px; font-weight:900; }
    .visual-subtitle { min-height:32px; margin-bottom:8px; color:var(--muted); font-size:11px; line-height:1.5; }
    .mini-chart { display:block; width:100%; height:auto; min-height:120px; }
    .donut-chart { display:block; width:100%; max-height:170px; }
    .visual-value { margin-top:7px; font-size:22px; font-weight:900; }
    .visual-value.danger { color:var(--danger); }
    .visual-footnote { margin-top:7px; color:var(--muted); font-size:11px; line-height:1.5; }
    .visual-card .table-wrap { margin-top:10px; }
    .visual-card table { min-width:0; font-size:11px; }
    .visual-card th, .visual-card td { padding:7px 4px; }
    .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; color:var(--muted); font-size:11px; }
    .legend-item { display:inline-flex; align-items:center; gap:5px; }
    .legend-dot { width:9px; height:9px; border-radius:50%; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:520px; border-collapse:collapse; font-size:12px; }
    th, td { padding:9px 7px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
    th:first-child, td:first-child { text-align:left; }
    th { color:var(--muted); font-size:11px; font-weight:800; }
    .empty, .state { padding:30px 18px; text-align:center; }
    .state-title { font-size:17px; font-weight:900; }
    .state-text { margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.6; }
    .download { border:0; border-radius:10px; padding:9px 11px; background:#edf3ff; color:#1e55bb; font-weight:800; cursor:pointer; }
    .download:disabled, .refresh:disabled { cursor:not-allowed; opacity:.55; }
    .updated { margin-top:9px; color:var(--muted); font-size:11px; }
    .bottom-nav { position:absolute; z-index:1000; right:0; bottom:0; left:0; border-top:1px solid var(--line); background:rgba(255,255,255,.98); padding-bottom:env(safe-area-inset-bottom); }
    .bottom-nav-inner { display:grid; grid-template-columns:repeat(4,1fr); height:var(--nav-height); }
    .nav-item { position:relative; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px; border:0; background:transparent; color:#8b919a; font-size:11px; font-weight:700; cursor:pointer; }
    .nav-item svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .nav-item.active { color:var(--brand); font-weight:900; }
    .nav-item.active::after { position:absolute; bottom:5px; width:18px; height:3px; border-radius:999px; background:var(--brand); content:''; }
    .toast { position:absolute; z-index:3000; right:18px; bottom:calc(var(--nav-height) + 22px + env(safe-area-inset-bottom)); left:18px; display:none; border-radius:12px; padding:12px 14px; background:rgba(25,28,33,.94); color:#fff; text-align:center; font-size:13px; font-weight:800; }
    .toast.show { display:block; }
    .toast.error { background:var(--danger); }
    @media (max-width:420px) { .visual-grid { grid-template-columns:1fr; } .visual-card.wide { grid-column:auto; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <main id="app" class="page" aria-live="polite">
      <section class="card state">
        <div class="state-title">正在載入營收儀表板</div>
        <div class="state-text">正在確認目前房東工作區與報表權限。</div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="房東導覽">
      <div class="bottom-nav-inner">
        <button class="nav-item" type="button" onclick="goPage('landlord-home.html')">
          <svg viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5"></path><path d="M6.5 10.5V19h11v-8.5"></path><path d="M9.5 19v-5h5v5"></path></svg><span>首頁</span>
        </button>
        <button class="nav-item" type="button" onclick="goPage('landlord-arrears.html')">
          <svg viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="15" rx="2"></rect><path d="M8.5 9h7"></path><path d="M8.5 13h7"></path><path d="M8.5 17h4"></path></svg><span>欠款</span>
        </button>
        <button class="nav-item" type="button" onclick="goPage('landlord-tenants.html')">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M4 19c.5-3.2 2.2-5 5-5s4.5 1.8 5 5"></path><path d="M15.5 7.5a2.5 2.5 0 0 1 0 5"></path><path d="M16 14c2.2.4 3.5 2 4 5"></path></svg><span>房客</span>
        </button>
        <button class="nav-item active" type="button" onclick="goPage('landlord-more.html')">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></svg><span>更多</span>
        </button>
      </div>
    </nav>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwnnuIFZ22eO6MxMnWOYHovgMT2xuTbcIgzbq4qmxXE3gjGoTJFcBGXlsNDS-lqr3EILQ/exec';
    const LIFF_ID = '2010314940-EjX1qbb8';
    const LANDLORD_ENTRY_URL = new URL('landlord-entry.html', location.href).href.split('?')[0];
    const TEST_LINE_USER_ID = 'Uf708ece75c9c985cfe1dbda48d123511';
    const URL_PARAMS = new URLSearchParams(location.search);
    const TEST_MODE = URL_PARAMS.get('test') === '1';
    let LINE_USER_ID = '';
    let PAGE_DATA = null;
    let SELECTED_RANGE = '12m';
    let SELECTED_PROPERTY = '';
    let toastTimer = null;

    function setAppHeight() {
      const height = window.visualViewport && window.visualViewport.height ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', Math.round(height) + 'px');
    }

    function text(value) { return value === undefined || value === null ? '' : String(value); }
    function safeHtml(value) { return text(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function number(value) { const parsed = Number(value); return Number.isFinite(parsed) ? parsed : 0; }
    function money(value) { return 'NT$ ' + Math.round(number(value)).toLocaleString('zh-TW'); }
    function percent(value) { return value === null || value === undefined ? '—' : (number(value) * 100).toFixed(1) + '%'; }
    function showToast(message, error) {
      const toast = document.getElementById('toast');
      toast.textContent = text(message) || '提示';
      toast.classList.toggle('error', Boolean(error));
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
    }
    function goPage(page) {
      const separator = page.indexOf('?') >= 0 ? '&' : '?';
      location.href = page + separator + 'v=' + (window.CMWEBS_RELEASE_VERSION || 'v2.1-p0-1') + (TEST_MODE ? '&test=1' : '');
    }
    function jsonpRequest(action, params) {
      return new Promise(function (resolve, reject) {
        if (!LINE_USER_ID) { reject(new Error('缺少 LINE User ID')); return; }
        const callbackName = '__cmwebs_revenue_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        let finished = false;
        const timer = setTimeout(function () { if (!finished) { finished = true; cleanup(); reject(new Error('API 載入逾時')); } }, 30000);
        function cleanup() { clearTimeout(timer); if (script.parentNode) script.parentNode.removeChild(script); try { delete window[callbackName]; } catch (error) { window[callbackName] = undefined; } }
        window[callbackName] = function (result) { if (finished) return; finished = true; cleanup(); resolve(result); };
        let url = API_URL + '?v2_action=' + encodeURIComponent(action) + '&line_user_id=' + encodeURIComponent(LINE_USER_ID) + '&callback=' + encodeURIComponent(callbackName) + '&_=' + Date.now();
        Object.keys(params || {}).forEach(function (key) { if (params[key] !== undefined && params[key] !== null && params[key] !== '') url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]); });
        script.src = url;
        script.onerror = function () { console.warn('JSONP script onerror ignored.'); };
        document.body.appendChild(script);
      });
    }
    async function initLineUserId() {
      if (TEST_MODE) { LINE_USER_ID = TEST_LINE_USER_ID; return true; }
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { location.href = LANDLORD_ENTRY_URL; return false; }
      const profile = await liff.getProfile();
      LINE_USER_ID = profile.userId;
      return true;
    }
    function formatTimestamp(value) { return value ? new Date(value).toLocaleString('zh-TW', { hour12: false }) : '—'; }
    function chartPoint(value, max, index, count) {
      const x = count <= 1 ? 40 : 40 + (560 * index / (count - 1));
      const y = 218 - (max > 0 ? (number(value) / max) * 178 : 0);
      return { x: x, y: y };
    }
    function polyline(rows, key, max) {
      return rows.map(function (row, index) { const point = chartPoint(row[key], max, index, rows.length); return point.x.toFixed(1) + ',' + point.y.toFixed(1); }).join(' ');
    }
    function renderChart(rows) {
      const svg = document.getElementById('revenueChart');
      if (!rows.length) { svg.innerHTML = ''; return; }
      const max = Math.max(1, ...rows.map(function (row) { return Math.max(number(row.receivable), number(row.collected), number(row.outstanding)); }));
      const grid = [0, 1, 2, 3, 4].map(function (step) { const y = 218 - step * 44.5; return '<line x1="40" y1="' + y + '" x2="600" y2="' + y + '" stroke="#e5eaf1"/><text x="34" y="' + (y + 4) + '" text-anchor="end" fill="#8792a5" font-size="10">' + Math.round(max * step / 4).toLocaleString('zh-TW') + '</text>'; }).join('');
      const labels = rows.map(function (row, index) { const point = chartPoint(0, max, index, rows.length); return '<text x="' + point.x + '" y="246" text-anchor="middle" fill="#8792a5" font-size="10">' + safeHtml(row.month) + '</text>'; }).join('');
      svg.innerHTML = grid + '<polyline points="' + polyline(rows, 'receivable', max) + '" fill="none" stroke="#246bfd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="' + polyline(rows, 'collected', max) + '" fill="none" stroke="#06c755" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="' + polyline(rows, 'outstanding', max) + '" fill="none" stroke="#c83c4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' + labels;
    }
    function renderBarChart(id, rows, valueKey, color) {
      const svg = document.getElementById(id);
      if (!svg) return;
      rows = Array.isArray(rows) ? rows : [];
      const max = Math.max(1, ...rows.map(function (row) { return number(row[valueKey]); }));
      const width = 320;
      const height = 150;
      const left = 10;
      const bottom = 26;
      const slot = rows.length ? (width - left * 2) / rows.length : width;
      const bars = rows.map(function (row, index) {
        const value = number(row[valueKey]);
        const barHeight = value > 0 ? Math.max(4, (value / max) * 98) : 2;
        const x = left + index * slot + slot * .18;
        const y = height - bottom - barHeight;
        const label = row.label || row.status || row.bucket || row.month || '';
        return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + Math.max(8, slot * .64).toFixed(1) + '" height="' + barHeight.toFixed(1) + '" rx="5" fill="' + color + '" opacity=".88"><title>' + safeHtml(label) + '：' + safeHtml(value) + '</title></rect><text x="' + (x + slot * .32).toFixed(1) + '" y="' + (height - 8) + '" text-anchor="middle" fill="#8792a5" font-size="9">' + safeHtml(label) + '</text>';
      }).join('');
      svg.innerHTML = '<line x1="8" y1="' + (height - bottom) + '" x2="' + (width - 8) + '" y2="' + (height - bottom) + '" stroke="#dfe5ed"/>' + bars;
    }
    function renderDonutChart(id, ratio, color, label) {
      const svg = document.getElementById(id);
      if (!svg) return;
      const value = ratio === null || ratio === undefined ? 0 : Math.max(0, Math.min(1, number(ratio)));
      const circumference = 2 * Math.PI * 42;
      const dash = (circumference * value).toFixed(1);
      svg.innerHTML = '<circle cx="80" cy="80" r="42" fill="none" stroke="#e9edf2" stroke-width="14"/><circle cx="80" cy="80" r="42" fill="none" stroke="' + color + '" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + dash + ' ' + circumference.toFixed(1) + '" transform="rotate(-90 80 80)"/><text x="80" y="78" text-anchor="middle" fill="#152238" font-size="21" font-weight="900">' + percent(ratio) + '</text><text x="80" y="98" text-anchor="middle" fill="#6b778c" font-size="10">' + safeHtml(label) + '</text>';
    }
    function renderVisualCharts() {
      const status = Array.isArray(PAGE_DATA.status_distribution) ? PAGE_DATA.status_distribution : [];
      const aging = Array.isArray(PAGE_DATA.overdue_aging) ? PAGE_DATA.overdue_aging : [];
      const expiry = Array.isArray(PAGE_DATA.contract_expiry) ? PAGE_DATA.contract_expiry : [];
      const occupancy = PAGE_DATA.occupancy || {};
      renderBarChart('paymentStatusChart', status, 'amount', '#246bfd');
      renderBarChart('overdueAgingChart', aging, 'amount', '#c83c4a');
      renderBarChart('contractExpiryChart', expiry, 'count', '#7654c4');
      renderDonutChart('overdueRatioChart', PAGE_DATA.metrics && PAGE_DATA.metrics.overdue_ratio, '#c83c4a', '遲繳金額比例');
      renderDonutChart('occupancyChart', occupancy.occupancy_rate, '#06c755', '可用房間入住率');
    }
    function renderTable(rows) {
      if (!rows.length) return '<div class="empty"><div class="state-title">沒有可顯示的營收資料</div><div class="state-text">目前期間沒有符合工作區範圍的有效帳單。</div></div>';
      return '<div class="table-wrap"><table><thead><tr><th>月份</th><th>應收</th><th>實收</th><th>未收</th><th>收款率</th></tr></thead><tbody>' + rows.map(function (row) { return '<tr><td>' + safeHtml(row.month) + '</td><td>' + money(row.receivable) + '</td><td>' + money(row.collected) + '</td><td>' + money(row.outstanding) + '</td><td>' + percent(row.collection_rate) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    function renderPropertyTable(rows) {
      if (!rows.length) return '<div class="state-text">目前沒有物件營收資料。</div>';
      return '<div class="table-wrap"><table><thead><tr><th>物件</th><th>應收</th><th>實收</th><th>未收</th><th>收款率</th></tr></thead><tbody>' + rows.map(function (row) { return '<tr><td>' + safeHtml(row.property_name || row.property_id) + '</td><td>' + money(row.receivable) + '</td><td>' + money(row.collected) + '</td><td>' + money(row.outstanding) + '</td><td>' + percent(row.collection_rate) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    function renderFilters(properties) {
      const propertyOptions = '<option value="">全部物件</option>' + properties.map(function (property) { return '<option value="' + safeHtml(property.property_id) + '"' + (property.property_id === SELECTED_PROPERTY ? ' selected' : '') + '>' + safeHtml(property.property_name || property.property_id) + '</option>'; }).join('');
      return '<div class="card filters"><div class="field"><label for="rangeSelect">資料期間</label><select id="rangeSelect" onchange="changeRange(this.value)"><option value="month"' + (SELECTED_RANGE === 'month' ? ' selected' : '') + '>本月</option><option value="3m"' + (SELECTED_RANGE === '3m' ? ' selected' : '') + '>近 3 個月</option><option value="12m"' + (SELECTED_RANGE === '12m' ? ' selected' : '') + '>近 12 個月</option></select></div><div class="field"><label for="propertySelect">物件</label><select id="propertySelect" onchange="changeProperty(this.value)">' + propertyOptions + '</select></div></div>';
    }
    function renderStatusTable(rows) {
      if (!rows.length) return '<div class="visual-footnote">目前沒有繳款狀態資料。</div>';
      return '<div class="table-wrap"><table><thead><tr><th>狀態</th><th>筆數</th><th>金額</th></tr></thead><tbody>' + rows.map(function (row) { return '<tr><td>' + safeHtml(row.label || row.status) + '</td><td>' + number(row.count) + '</td><td>' + money(row.amount) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    function renderAgingTable(rows) {
      if (!rows.length) return '<div class="visual-footnote">目前沒有遲繳資料。</div>';
      return '<div class="table-wrap"><table><thead><tr><th>逾期區間</th><th>筆數</th><th>未收</th></tr></thead><tbody>' + rows.map(function (row) { return '<tr><td>' + safeHtml(row.label || row.bucket) + '</td><td>' + number(row.count) + '</td><td>' + money(row.amount) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    function renderExpiryTable(rows) {
      if (!rows.length) return '<div class="visual-footnote">目前沒有即將到期合約。</div>';
      return '<div class="table-wrap"><table><thead><tr><th>到期區間</th><th>合約數</th></tr></thead><tbody>' + rows.map(function (row) { return '<tr><td>' + safeHtml(row.label || row.bucket) + '</td><td>' + number(row.count) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    function renderOccupancyTable(occupancy) {
      const rows = Array.isArray(occupancy.distribution) ? occupancy.distribution : [];
      return '<div class="table-wrap"><table><thead><tr><th>房間狀態</th><th>數量</th></tr></thead><tbody>' + rows.map(function (row) { return '<tr><td>' + safeHtml(row.label || row.status) + '</td><td>' + number(row.count) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    function render(data) {
      PAGE_DATA = data || {};
      const kpis = PAGE_DATA.kpis || { receivable: 0, collected: 0, outstanding: 0, collection_rate: null };
      const metrics = PAGE_DATA.metrics || {};
      const rows = Array.isArray(PAGE_DATA.months) ? PAGE_DATA.months : [];
      const properties = Array.isArray(PAGE_DATA.properties) ? PAGE_DATA.properties : [];
      const status = Array.isArray(PAGE_DATA.status_distribution) ? PAGE_DATA.status_distribution : [];
      const aging = Array.isArray(PAGE_DATA.overdue_aging) ? PAGE_DATA.overdue_aging : [];
      const expiry = Array.isArray(PAGE_DATA.contract_expiry) ? PAGE_DATA.contract_expiry : [];
      const occupancy = PAGE_DATA.occupancy || {};
      const dashboard = '<div class="header"><div><div class="eyebrow">CMWebs 智慧租管</div><h1>營收儀表板</h1><p class="subtitle">只顯示目前房東工作區的聚合資料，數值與圖形同步來自同一份聚合結果。</p></div><button class="refresh" type="button" onclick="loadReport()">重新整理</button></div>' + renderFilters(properties) + '<section class="card summary"><div class="metric"><div class="metric-label">本期應收</div><div class="metric-value">' + money(kpis.receivable) + '</div></div><div class="metric"><div class="metric-label">本期實收</div><div class="metric-value green">' + money(kpis.collected) + '</div></div><div class="metric"><div class="metric-label">本期未收</div><div class="metric-value red">' + money(kpis.outstanding) + '</div></div><div class="metric"><div class="metric-label">收款率</div><div class="metric-value">' + percent(kpis.collection_rate) + '</div></div><div class="metric"><div class="metric-label">遲繳比例</div><div class="metric-value red">' + percent(metrics.overdue_ratio) + '</div></div><div class="metric"><div class="metric-label">入住率</div><div class="metric-value green">' + percent(occupancy.occupancy_rate) + '</div></div></section>' + (PAGE_DATA.has_data ? '<section class="card section"><div class="section-title-row"><div class="section-title">月份營收上升／下降曲線</div><button class="download" type="button" onclick="downloadCsv()">下載 CSV</button></div><div class="chart-wrap"><svg id="revenueChart" viewBox="0 0 640 260" role="img" aria-label="月份應收、實收與未收上升下降折線圖"></svg></div><div class="legend"><span class="legend-item"><i class="legend-dot" style="background:#246bfd"></i>應收</span><span class="legend-item"><i class="legend-dot" style="background:#06c755"></i>實收</span><span class="legend-item"><i class="legend-dot" style="background:#c83c4a"></i>未收</span></div></section><section class="card section"><div class="section-title">繳款狀態、遲繳與營運圖形</div><div class="visual-grid"><div class="visual-card wide"><div class="visual-title">繳款狀態分布</div><div class="visual-subtitle">已繳款、部分繳款、待繳款與遲繳的金額比較。</div><svg id="paymentStatusChart" class="mini-chart" viewBox="0 0 320 150" role="img" aria-label="繳款狀態分布圖"></svg>' + renderStatusTable(status) + '</div><div class="visual-card"><div class="visual-title">遲繳比例</div><div class="visual-subtitle">以目前期間應收金額為分母，遲繳未收金額為分子。</div><svg id="overdueRatioChart" class="donut-chart" viewBox="0 0 160 160" role="img" aria-label="遲繳比例圖"></svg><div class="visual-value danger">' + percent(metrics.overdue_ratio) + '</div><div class="visual-footnote">遲繳 ' + number(metrics.overdue_count) + ' 筆／共 ' + number(metrics.bill_count) + ' 筆</div></div><div class="visual-card"><div class="visual-title">入住率</div><div class="visual-subtitle">依目前 Workspace 房間狀態計算，停用房間不列入分母。</div><svg id="occupancyChart" class="donut-chart" viewBox="0 0 160 160" role="img" aria-label="入住率圖"></svg><div class="visual-value">' + percent(occupancy.occupancy_rate) + '</div>' + renderOccupancyTable(occupancy) + '</div><div class="visual-card wide"><div class="visual-title">遲繳天數分布</div><div class="visual-subtitle">依到期日與報表基準日分組，讓房東快速辨識逾期集中區段。</div><svg id="overdueAgingChart" class="mini-chart" viewBox="0 0 320 150" role="img" aria-label="遲繳天數分布圖"></svg>' + renderAgingTable(aging) + '</div><div class="visual-card wide"><div class="visual-title">合約到期分布</div><div class="visual-subtitle">列出 30／60／90 天內即將到期的有效合約數量。</div><svg id="contractExpiryChart" class="mini-chart" viewBox="0 0 320 150" role="img" aria-label="合約到期分布圖"></svg>' + renderExpiryTable(expiry) + '</div></div></section><section class="card section"><div class="section-title-row"><div class="section-title">月份明細</div><div class="section-hint">數值表格 fallback</div></div>' + renderTable(rows) + '</section><section class="card section"><div class="section-title-row"><div class="section-title">物件績效</div><div class="section-hint">依應收排序</div></div>' + renderPropertyTable(properties) + '</section>' : '<section class="card empty"><div class="state-title">沒有可顯示的營收資料</div><div class="state-text">請調整期間或確認目前工作區已有有效帳單或房間資料。</div></section>') + '<div class="updated">資料更新：' + safeHtml(formatTimestamp(PAGE_DATA.updated_at)) + '</div>';
      document.getElementById('app').innerHTML = dashboard;
      if (PAGE_DATA.has_data) { renderChart(rows); renderVisualCharts(); }
    }
    async function loadReport() {
      const app = document.getElementById('app');
      app.setAttribute('aria-busy', 'true');
      try {
        const result = await jsonpRequest('landlord_revenue_dashboard_init', { range: SELECTED_RANGE, property_id: SELECTED_PROPERTY });
        if (!result || result.success !== true) throw new Error(result && result.message ? result.message : '營收儀表板讀取失敗');
        render(result.data || {});
      } catch (error) {
        app.innerHTML = '<section class="card state"><div class="state-title">營收儀表板載入失敗</div><div class="state-text">' + safeHtml(error.message || '請稍後再試') + '</div></section>';
        showToast(error.message || '營收儀表板載入失敗', true);
      } finally { app.removeAttribute('aria-busy'); }
    }
    function changeRange(value) { SELECTED_RANGE = value || '12m'; loadReport(); }
    function changeProperty(value) { SELECTED_PROPERTY = value || ''; loadReport(); }
    function csvCell(value) { const textValue = text(value); return '"' + textValue.replace(/"/g, '""') + '"'; }
    function downloadCsv() {
      const rows = PAGE_DATA && Array.isArray(PAGE_DATA.months) ? PAGE_DATA.months : [];
      const properties = PAGE_DATA && Array.isArray(PAGE_DATA.properties) ? PAGE_DATA.properties : [];
      const lines = [['月份', '應收', '實收', '未收', '收款率']].concat(rows.map(function (row) { return [row.month, row.receivable, row.collected, row.outstanding, row.collection_rate === null ? '' : row.collection_rate]; }));
      lines.push([]);
      lines.push(['物件', '應收', '實收', '未收', '收款率']);
      properties.forEach(function (row) { lines.push([row.property_name || row.property_id, row.receivable, row.collected, row.outstanding, row.collection_rate === null ? '' : row.collection_rate]); });
      const csv = '\ufeff' + lines.map(function (row) { return row.map(csvCell).join(','); }).join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a'); link.href = url; link.download = 'cmwebs-revenue-dashboard.csv'; link.click(); URL.revokeObjectURL(url);
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    (async function () { try { if (await initLineUserId()) await loadReport(); } catch (error) { showToast(error.message || '登入失敗', true); } }());
  </script>
</body>
</html>
