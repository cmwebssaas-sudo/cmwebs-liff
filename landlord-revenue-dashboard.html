  <style>
    :root { --app-height: 100vh; --nav-height: 64px; --ink: #152238; --muted: #6b778c; --line: #e5eaf1; --brand: #06c755; --blue: #246bfd; --surface: #fff; --canvas: #f4f7fb; --danger: #c83c4a; }
    * { box-sizing: border-box; }
    html, body { height:100%; overflow:hidden; }
    body { margin:0; color:var(--ink); background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    button, select { font:inherit; }
    .app-shell { position:relative; height:var(--app-height); overflow:hidden; width:100%; max-width:560px; margin:0 auto; background:var(--canvas); }
    .page { height:100%; overflow-y:auto; padding:18px 16px calc(var(--nav-height) + 28px + env(safe-area-inset-bottom)); }
    .header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .eyebrow { margin:0 0 5px; color:var(--brand); font-size:12px; font-weight:900; letter-spacing:.06em; }
    h1 { margin:0; font-size:25px; line-height:1.2; }
    .subtitle { margin:7px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .refresh { border:1px solid var(--line); border-radius:11px; padding:9px 11px; background:var(--surface); color:var(--ink); cursor:pointer; }
    .card { margin-bottom:12px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:0 2px 8px rgba(24,39,75,.04); }
    .filters { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:13px; }
    .field label { display:block; margin:0 0 5px; color:var(--muted); font-size:11px; font-weight:800; }
    .field select { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; color:var(--ink); }
    .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); overflow:hidden; }
    .metric { min-height:88px; padding:14px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .metric:nth-child(2n) { border-right:0; }
    .metric:nth-last-child(-n+2) { border-bottom:0; }
    .metric-label { color:var(--muted); font-size:12px; }
    .metric-value { margin-top:7px; font-size:23px; font-weight:900; }
    .section { padding:16px; }
    .section-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:11px; }
    .section-title { font-size:16px; font-weight:900; }
    .section-hint { color:var(--muted); font-size:11px; }
    .chart-wrap { position:relative; border:1px solid var(--line); border-radius:12px; background:#fbfcfe; padding:12px 10px 4px; }
    #revenueChart { display:block; width:100%; height:auto; overflow:visible; }
    .visual-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .visual-card { min-width:0; padding:14px; border:1px solid var(--line); border-radius:14px; background:#fbfcfe; }
    .visual-card.wide { grid-column:1 / -1; }
    .visual-title { margin-bottom:9px; font-size:14px; font-weight:900; }
    .visual-subtitle { min-height:32px; margin-bottom:8px; color:var(--muted); font-size:11px; line-height:1.5; }
    .mini-chart { display:block; width:100%; height:auto; margin:4px 0 6px; overflow:visible; }
    .meter-chart { display:block; width:100%; height:10px; margin:12px 0 6px; }
    .visual-value { margin-top:7px; font-size:30px; font-weight:800; letter-spacing:-.02em; }
    .visual-footnote { margin-top:7px; color:var(--muted); font-size:11px; line-height:1.5; }
    .visual-card .table-wrap { margin-top:10px; }
    .visual-card table { min-width:0; font-size:11px; }
    .visual-card th, .visual-card td { padding:7px 4px; }
    .legend { display:flex; flex-wrap:wrap; gap:16px; margin:0 0 10px; color:var(--muted); font-size:12px; font-weight:700; }
    .legend-item { display:inline-flex; align-items:center; gap:6px; }
    .legend-line { width:14px; height:3px; border-radius:2px; }
    .metric-key { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; vertical-align:1px; }
    /* Chart text and hover layer (dataviz method): ink text, hairline axes,
       one tooltip listing every series at the hovered month. */
    svg .viz-tick { fill:#7a8496; font-size:11px; font-variant-numeric:tabular-nums; }
    svg .viz-label { fill:#4b5565; font-size:12px; }
    svg .viz-value { fill:var(--ink); font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
    .viz-crosshair { opacity:0; }
    svg.is-hovering .viz-crosshair { opacity:1; }
    .viz-hit, .viz-bar { outline:none; cursor:pointer; }
    .viz-bar path { transition:opacity 150ms ease; }
    .viz-bar:is(:hover, :focus-visible) path { opacity:.75; }
    .viz-bar:focus-visible .viz-label { font-weight:800; fill:var(--ink); }
    .viz-tooltip { position:absolute; top:10px; left:0; z-index:5; min-width:156px; padding:10px 12px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.97); box-shadow:0 12px 32px rgba(15,30,54,.12); font-size:12px; opacity:0; pointer-events:none; transition:opacity 120ms ease; }
    .viz-tooltip.show { opacity:1; }
    .viz-tooltip-title { margin-bottom:6px; color:var(--muted); font-weight:700; }
    .viz-tooltip-row { display:flex; align-items:center; gap:8px; padding:2px 0; }
    .viz-tooltip-row i { width:12px; height:3px; flex:0 0 auto; border-radius:2px; }
    .viz-tooltip-row strong { color:var(--ink); font-variant-numeric:tabular-nums; }
    .viz-tooltip-row span { margin-left:auto; color:var(--muted); }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:520px; border-collapse:collapse; font-size:12px; }
    th, td { padding:9px 7px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
    th:first-child, td:first-child { text-align:left; }
    th { color:var(--muted); font-size:11px; font-weight:800; }
    .empty, .state { padding:30px 18px; text-align:center; }
    .state-title { font-size:17px; font-weight:900; }
    .state-text { margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.6; }
    .download { border:0; border-radius:10px; padding:9px 11px; background:#edf3ff; color:#1e55bb; font-weight:800; cursor:pointer; }
    .download:disabled, .refresh:disabled { cursor:not-allowed; opacity:.55; }
    .updated { margin-top:9px; color:var(--muted); font-size:11px; }
    .bottom-nav { position:absolute; z-index:1000; right:0; bottom:0; left:0; border-top:1px solid var(--line); background:rgba(255,255,255,.98); padding-bottom:env(safe-area-inset-bottom); }
    .bottom-nav-inner { display:grid; grid-template-columns:repeat(4,1fr); height:var(--nav-height); }
    .nav-item { position:relative; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px; border:0; background:transparent; color:#8b919a; font-size:11px; font-weight:700; cursor:pointer; }
    .nav-item svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .nav-item.active { color:var(--brand); font-weight:900; }
    .nav-item.active::after { position:absolute; bottom:5px; width:18px; height:3px; border-radius:999px; background:var(--brand); content:''; }
    .toast { position:absolute; z-index:3000; right:18px; bottom:calc(var(--nav-height) + 22px + env(safe-area-inset-bottom)); left:18px; display:none; border-radius:12px; padding:12px 14px; background:rgba(25,28,33,.94); color:#fff; text-align:center; font-size:13px; font-weight:800; }
    .toast.show { display:block; }
    .toast.error { background:var(--danger); }
    @media (max-width:420px) { .visual-grid { grid-template-columns:1fr; } .visual-card.wide { grid-column:auto; } }

    /* Bright glass (2026-10-28): same shell, colours and pills as the other
       landlord pages; the valuation block trades its green for navy. */
    .app-shell .refresh { flex:0 0 auto; min-height:40px; padding:0 16px; white-space:nowrap; border:1px solid var(--glass-edge); border-radius:999px; background:var(--glass-surface-strong); color:var(--glass-ink); font-weight:800; box-shadow:var(--glass-shadow); }
    .app-shell .download { border-radius:999px; padding:9px 16px; background:var(--glass-ink); color:#fff; }
    .app-shell .field select { border-color:var(--glass-hairline); border-radius:999px; padding:9px 14px; background:rgba(255,255,255,.85); }
    .app-shell .metric { border-color:var(--glass-hairline); }
    .app-shell :is(.chart-wrap, .visual-card) { border-color:var(--glass-hairline); background:rgba(255,255,255,.55); }
    .app-shell th, .app-shell td { border-color:var(--glass-hairline); }
    .app-shell .av-overview-value { background:var(--glass-ink); }
    .app-shell .av-overview-income { background:rgba(15,30,54,.05); color:var(--glass-ink); }
    .app-shell .av-rates button { border-color:var(--glass-hairline); border-radius:999px; background:rgba(255,255,255,.7); color:var(--glass-ink); }
    .app-shell .av-rates button[aria-pressed=true] { border-color:var(--glass-ink); background:var(--glass-ink); color:#fff; }
    .app-shell .av-metrics > div { background:rgba(15,30,54,.04); }
    .app-shell .av-investment { border-color:var(--glass-hairline); background:rgba(255,255,255,.5); }
    .app-shell .av-controls :is(input, select) { border-color:var(--glass-hairline); border-radius:12px; }
    .app-shell .av-chart-grid article { border-color:var(--glass-hairline); background:rgba(255,255,255,.55); }
    .desktop-topbar-meta .refresh { margin-left:6px; }
    @media (min-width:1024px) {
      .app-shell .page.desktop-main { padding:16px 32px 48px 24px; }
      .app-shell .header { display:none; }
      .app-shell .summary { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .app-shell .metric { border-right:1px solid var(--glass-hairline); border-bottom:1px solid var(--glass-hairline); }
      .app-shell .metric:nth-child(3n) { border-right:0; }
      .app-shell .metric:nth-last-child(-n+3) { border-bottom:0; }
      .app-shell .visual-card.wide:nth-child(n+4) { grid-column:auto; }
    }
  </style>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwnnuIFZ22eO6MxMnWOYHovgMT2xuTbcIgzbq4qmxXE3gjGoTJFcBGXlsNDS-lqr3EILQ/exec';
    const LIFF_ID = '2010314940-EjX1qbb8';
    const LANDLORD_ENTRY_URL = new URL('landlord-entry.html', location.href).href.split('?')[0];

    const URL_PARAMS = new URLSearchParams(location.search);
    const TEST_MODE = false;
    let LINE_USER_ID = '';
    let PAGE_DATA = null;
    let VALUATION_VISUAL_STATE = null;
    let SELECTED_RANGE = '12m';
    let SELECTED_PROPERTY = '';
    let toastTimer = null;

    function setAppHeight() {
      const height = window.visualViewport && window.visualViewport.height ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', Math.round(height) + 'px');
    }

    function text(value) { return value === undefined || value === null ? '' : String(value); }
    function safeHtml(value) { return text(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function number(value) { const parsed = Number(value); return Number.isFinite(parsed) ? parsed : 0; }
    function money(value) { return 'NT$ ' + Math.round(number(value)).toLocaleString('zh-TW'); }
    function percent(value) { return value === null || value === undefined ? '—' : (number(value) * 100).toFixed(1) + '%'; }
    function showToast(message, error) {
      const toast = document.getElementById('toast');
      toast.textContent = text(message) || '提示';
      toast.classList.toggle('error', Boolean(error));
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
    }
    function desktopLogout() {
      if (window.CMWebsLandlordAuth && typeof window.CMWebsLandlordAuth.logout === 'function') { window.CMWebsLandlordAuth.logout(); return; }
      location.href = LANDLORD_ENTRY_URL;
    }
    function goPage(page) {
      const separator = page.indexOf('?') >= 0 ? '&' : '?';
      location.href = page + separator + 'v=' + (window.CMWEBS_RELEASE_VERSION || 'v2.1-p0-1') + (TEST_MODE ? '&test=1' : '');
    }
    function jsonpRequest(action, params) {
      return window.CMWebsLandlordApi.request({ action: action, params: params || {}, apiUrl: API_URL, lineUserId: LINE_USER_ID, callbackPrefix: '__cmwebs_revenue_', rejectOnFailure: true });
    }
    async function initLineUserId() {

      const auth = window.CMWebsLandlordAuth.init({ apiUrl: API_URL, liffId: LIFF_ID, returnTo: 'landlord-revenue-dashboard.html', entryPage: 'landlord-entry.html', testMode: TEST_MODE });
      if (auth.getMode() === 'email') {
        if (auth.getRequestAuthParams().landlord_session_token) return true;
      }
      // // LINE SDK loads on demand; Email sessions never download it.
      if (window.CMWebsLandlordApi && window.CMWebsLandlordApi.loadLiffSdk) await window.CMWebsLandlordApi.loadLiffSdk();
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { location.href = LANDLORD_ENTRY_URL + '?mode=' + auth.getMode() + '&return_to=landlord-revenue-dashboard.html'; return false; }
      const profile = await liff.getProfile();
      LINE_USER_ID = profile.userId;
      window.CMWebsLandlordAuth.init({ apiUrl: API_URL, liffId: LIFF_ID, lineUserId: LINE_USER_ID, returnTo: 'landlord-revenue-dashboard.html', testMode: TEST_MODE });
      return true;
    }
    function formatTimestamp(value) { return value ? new Date(value).toLocaleString('zh-TW', { hour12: false }) : '—'; }
    // Validated categorical slots (dataviz reference palette). Each money
    // entity keeps its colour on every chart; text stays in ink colours.
    const VIZ = { receivable: '#2a78d6', collected: '#1baf7a', outstanding: '#eb6834', contracts: '#6250d6', grid: '#e6e9ef', axis: '#c9cfd8', surface: '#ffffff' };
    const SERIES = [
      { key: 'receivable', label: '應收', color: VIZ.receivable },
      { key: 'collected', label: '實收', color: VIZ.collected },
      { key: 'outstanding', label: '未收', color: VIZ.outstanding }
    ];
    function compactMoney(value) {
      const amount = number(value);
      if (Math.abs(amount) >= 100000000) return (amount / 100000000).toLocaleString('zh-TW', { maximumFractionDigits: 2 }) + '億';
      return Math.abs(amount) >= 10000 ? (amount / 10000).toLocaleString('zh-TW', { maximumFractionDigits: 1 }) + '萬' : Math.round(amount).toLocaleString('zh-TW');
    }
    function niceScale(max, count) {

      clearTimeout(chartResizeTimer);
      chartResizeTimer = setTimeout(function () {
        if (PAGE_DATA && PAGE_DATA.has_data) { renderChart(Array.isArray(PAGE_DATA.months) ? PAGE_DATA.months : []); renderVisualCharts(); }
      }, 150);
    });
    (async function () { try { if (await initLineUserId()) await loadReport(); } catch (error) { showToast(error.message || '登入失敗', true); } }());
  </script>
</body>
</html>
