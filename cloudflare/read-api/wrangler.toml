name = "cmwebs-read-api"
main = "src/index.js"
compatibility_date = "2026-10-06"
workers_dev = true
preview_urls = false

# Production read replica (APAC), created 2026-10-26.
[[d1_databases]]
binding = "DB"
database_name = "cmwebs-read-replica"
database_id = "876cebb6-c0d2-4931-bf36-32239cdc1952"
migrations_dir = "migrations"

# LINE Login channel that owns the landlord LIFF apps (public value).
[vars]
LINE_LOGIN_CHANNEL_ID = "2010314940"
# The one Workspace allowed to register that channel as its own (修改單 D).
LINE_LOGIN_HOME_WORKSPACE = "W000001"
# Landlord assistant: Workspaces allowed to ask the AI-00 model (comma separated).
ASSISTANT_AI_WORKSPACES = "W000001"
# Apps Script Web App that receives verified LINE webhook events (public URL).
# Empty until the owner approves stage 5; webhooks answer 503 meanwhile.
APPS_SCRIPT_WEBHOOK_URL = ""

# Run next to the D1 primary (APAC, Tokyo): one user round trip, then each of the
# many sequential D1 queries stays inside the region.
[placement]
mode = "smart"
hint = "apac"

# Landlord assistant bridge on AI-00 (loopback port 18760), reached through the
# existing ai-00-office tunnel. Only this one port is exposed to the Worker.
[[vpc_services]]
binding = "ASSISTANT_BRIDGE"
service_id = "01a1cb1f-e5de-7c20-b8b0-f9685f1d8293"
