<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>CMWebs 合約文件管理</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --app-height: 100vh;
      --nav-height: 66px;

      --primary: #06c755;
      --primary-dark: #079641;
      --primary-soft: #edf9f2;
      --page-bg: #f4f6f9;
      --surface: #ffffff;
      --ink: #202124;
      --muted: #6f7580;
      --line: #e6e9ee;

      --blue: #1a73e8;
      --blue-soft: #edf4ff;
      --purple: #6940c6;
      --purple-soft: #efeaff;
      --gray: #7f8790;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--ink);
      font-family:
        Arial,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
      outline: none;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: var(--app-height);
      margin: 0 auto;
      overflow: hidden;
      background: var(--page-bg);
    }

    .page {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding:
        16px
        15px
        calc(
          var(--nav-height) +
          20px +
          env(safe-area-inset-bottom)
        );
      -webkit-overflow-scrolling: touch;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .back-btn,
    .refresh-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: #4f5359;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .back-btn:active,
    .refresh-btn:active {
      transform: translateY(1px);
    }

    .topbar-title {
      min-width: 0;
      flex: 1;
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 900;
    }

    .topbar-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(20, 30, 50, 0.05);
      padding: 14px;
      margin-bottom: 13px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 900;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #49505a;
      font-size: 12px;
      font-weight: 700;
    }

    .field small {
      display: block;
      color: var(--muted);
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.45;
    }

    .overview-note {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .input,
    .input-file {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      padding: 0 11px;
    }

    .input {
      padding: 0 11px;
    }

    .primary {
      width: 100%;
      margin-top: 5px;
      min-height: 44px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.22);
    }

    .primary:disabled {
      background: #9de6af;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .document-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
      background: #fff;
    }

    .doc-main {
      min-width: 0;
      flex: 1;
    }

    .doc-type {
      display: inline-block;
      margin-bottom: 4px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border: 1px solid #d2e4fb;
    }

    .doc-title {
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .doc-meta {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .doc-actions {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .link-btn {
      border: 0;
      border-radius: 8px;
      padding: 7px 10px;
      min-width: 74px;
      font-size: 12px;
      font-weight: 700;
      background: #f5f7fc;
      color: #374047;
      cursor: pointer;
    }

    .link-btn.primary {
      background: #eafaf0;
      color: #0f8b3d;
    }

    .loading,
    .error {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #e1e4ea;
      border-radius: 12px;
      background: #fff;
    }

    .error {
      color: #a83b34;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 15px;
      transform: translateX(-50%);
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(27, 27, 27, 0.95);
      color: #fff;
      font-size: 12px;
      max-width: calc(100% - 32px);
      width: calc(100% - 24px);
      z-index: 90;
      display: none;
      text-align: center;
      line-height: 1.45;
    }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(4px);
      padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));
    }

    .bottom-nav-inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 560px;
      margin: 0 auto;
    }

    .nav-item {
      border: 0;
      border-radius: 13px;
      min-height: 43px;
      background: #fff;
      color: #4f5863;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary-dark);
      border-color: #a7ebbe;
      box-shadow: inset 0 0 0 2px rgba(6, 199, 85, 0.08);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="page" id="page">
      <div class="topbar">
        <button class="back-btn" id="backButton" type="button" aria-label="回到上一頁">
          ‹
        </button>
        <div>
          <h1 class="topbar-title">文件總覽</h1>
          <div class="topbar-subtitle">查詢全部房客的合約與身分文件</div>
        </div>
        <button class="refresh-btn" id="refreshButton" type="button" aria-label="重新整理">
          ⟳
        </button>
      </div>

      <section class="card">
        <h2 class="section-title">文件歸檔方式</h2>
        <p class="overview-note">
          請從「房客名單 → 房客詳細資料」上傳文件，系統會自動歸檔到該房客名下；本頁提供全部房客文件的查詢、下載與列印。
        </p>
        <button class="primary" type="button" id="backToTenantsButton">
          前往房客名單
        </button>
      </section>

      <section class="card">
        <h2 class="section-title">全部文件紀錄</h2>
        <div id="documentsState" class="loading">載入中…</div>
        <div id="documentsList" hidden></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="nav-item" type="button" onclick="goPage('landlord-home.html')">首頁</button>
        <button class="nav-item" type="button" onclick="goPage('landlord-arrears.html')">欠款</button>
        <button class="nav-item" type="button" onclick="goPage('landlord-tenants.html')">房客</button>
        <button class="nav-item active" type="button" onclick="goPage('landlord-more.html')">更多</button>
      </div>
    </nav>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbyrwKb3adOgHVBwbwHwLeSsDoUgYhaUaFXui66tnyMNBrT9eOVbi788oHeVRTif_LA9BA/exec';
    const LIFF_ID =
      '2010314940-EjX1qbb8';
    const LANDLORD_ENTRY_URL =
      new URL(
        'landlord-entry.html',
        location.href
      ).href.split('?')[0];
    const TEST_LINE_USER_ID =
      'Uf708ece75c9c985cfe1dbda48d123511';
    const urlParams = new URLSearchParams(
      location.search
    );
    const TEST_MODE = urlParams.get('test') === '1';

    let LINE_USER_ID = '';
    let inited = false;
    let toastTimer = null;

    function setAppHeight() {
      const height =
        window.visualViewport &&
        window.visualViewport.height
          ? window.visualViewport.height
          : window.innerHeight;

      document.documentElement.style.setProperty(
        '--app-height',
        `${height}px`
      );
    }

    setAppHeight();
    window.addEventListener(
      'resize',
      setAppHeight
    );
    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        'resize',
        setAppHeight
      );
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.display = 'block';
      toast.style.background = isError
        ? 'rgba(183, 52, 45, 0.98)'
        : 'rgba(27, 27, 27, 0.95)';
      if (toastTimer) {
        clearTimeout(toastTimer);
      }
      toastTimer = setTimeout(function () {
        toast.style.display = 'none';
      }, 2200);
    }

    function safeText(value) {
      return value === null || value === undefined ? '' : String(value);
    }

    function safeHtml(value) {
      return safeText(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function buildLandlordLoginRedirectUri() {
      return `${LANDLORD_ENTRY_URL}?redirect=${encodeURIComponent(location.href)}`;
    }

    async function initLine() {
      if (TEST_MODE) {
        LINE_USER_ID = TEST_LINE_USER_ID;
        return true;
      }

      await liff.init({
        liffId: LIFF_ID
      });

      if (!liff.isLoggedIn()) {
        liff.login({
          redirectUri: buildLandlordLoginRedirectUri()
        });
        return false;
      }

      const profile = await liff.getProfile();
      LINE_USER_ID = profile.userId || '';
      return true;
    }

    function jsonpRequest(action, params = {}) {
      return new Promise(function (resolve, reject) {
        const callbackName =
          `landlordCb_${Date.now()}_${Math.random()
            .toString(36)
            .slice(2)}`;
        let resolved = false;

        window[callbackName] = function (result) {
          if (resolved) {
            return;
          }
          resolved = true;
          cleanup();
          resolve(result || {});
        };

        const script = document.createElement('script');
        const cleanup = function () {
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
          delete window[callbackName];
        };
        script.onerror = function () {
          if (resolved) {
            return;
          }
          resolved = true;
          cleanup();
          reject(new Error('API 請求失敗'));
        };

        let url =
          `${API_URL}?v2_action=${encodeURIComponent(action)}&line_user_id=${encodeURIComponent(LINE_USER_ID)}&callback=${encodeURIComponent(callbackName)}&${Date.now()}`;
        Object.keys(params).forEach(function (key) {
          if (params[key] === undefined || params[key] === null || params[key] === '') {
            return;
          }
          url +=
            `&${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`;
        });
        script.src = url;
        document.body.appendChild(script);
      });
    }

    function formatBytes(size) {
      const n = Number(size || 0);
      if (!n) {
        return '0B';
      }
      if (n < 1024) {
        return n + 'B';
      }
      if (n < 1024 * 1024) {
        return (n / 1024).toFixed(1) + 'KB';
      }
      return (n / 1024 / 1024).toFixed(1) + 'MB';
    }

    function documentTypeLabel(type) {
      const map = {
        legacy_contract: '舊合約',
        identity_front: '身份正面',
        identity_back: '身份反面',
        selfie: '自拍照'
      };
      return map[type] || type;
    }

    function renderDocuments(documents) {
      const stateEl = document.getElementById('documentsState');
      const listEl = document.getElementById('documentsList');
      const rows = Array.isArray(documents) ? documents.slice() : [];

      if (rows.length === 0) {
        stateEl.className = 'empty';
        stateEl.hidden = false;
        stateEl.textContent = '目前尚無文件紀錄。';
        listEl.hidden = true;
        return;
      }

      stateEl.hidden = true;
      listEl.hidden = false;
      listEl.innerHTML = '';

      rows.forEach(function (doc) {
        const item = document.createElement('div');
        item.className = 'document-item';
        const fileName = safeText(doc.file_name || '未命名檔案');
        const tenantId = safeText(doc.tenant_id);

        item.innerHTML =
          `<div class="doc-main">
            <span class="doc-type">${safeHtml(documentTypeLabel(safeText(doc.document_type)))}</span>
            <div class="doc-title" title="${safeHtml(fileName)}">${safeHtml(fileName)}</div>
            <p class="doc-meta">
              合約：${safeHtml(doc.contract_id || '未綁定')}&nbsp;｜
              承租人：${safeHtml(tenantId || '未綁定')}
            </p>
            <p class="doc-meta">
              類型：${safeHtml(doc.mime_type || '')} | 大小：${safeHtml(formatBytes(doc.byte_size))}
            </p>
            <p class="doc-meta">上傳時間：${safeHtml(doc.created_at || '')}</p>
          </div>
          <div class="doc-actions">
            <button class="link-btn primary" type="button" data-action="download">下載</button>
            <button class="link-btn" type="button" data-action="print">列印</button>
            ${
              tenantId
                ? '<button class="link-btn" type="button" data-action="tenant">查看房客</button>'
                : ''
            }
          </div>`;

        const id = safeText(doc.document_id);
        const buttons = item.querySelectorAll('button');
        buttons[0].addEventListener('click', function () {
          doDownload(id, false);
        });
        buttons[1].addEventListener('click', function () {
          doDownload(id, true);
        });
        if (tenantId && buttons[2]) {
          buttons[2].addEventListener('click', function () {
            location.href =
              'landlord-tenant-detail.html?tenant_id=' +
              encodeURIComponent(tenantId);
          });
        }
        listEl.appendChild(item);
      });
    }

    function openTenantDocumentPrintWindow() {
      const printWindow = window.open('', '_blank');

      if (!printWindow) {
        throw new Error('請先允許快顯視窗後再試一次');
      }

      printWindow.document.write(
        '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>文件列印</title></head><body style="margin:0;padding:24px;font-family:Arial,sans-serif;">文件載入中…</body></html>'
      );
      printWindow.document.close();
      return printWindow;
    }

    function doDownload(documentId, printOnly) {
      let printWindow = null;

      try {
        printWindow = printOnly ? openTenantDocumentPrintWindow() : null;
      } catch (error) {
        showToast(error.message, true);
        return Promise.resolve();
      }

      return jsonpRequest('landlord_contract_document_download', {
        document_id: documentId
      })
        .then(function (result) {
          if (!result || result.success !== true) {
            throw new Error(safeText((result || {}).message || '下載失敗'));
          }

          const documentData = result.data && result.data.document
            ? result.data.document
            : null;
          if (!documentData || !documentData.base64) {
            throw new Error('下載資料不完整');
          }

          const binary = atob(safeText(documentData.base64));
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          const blob = new Blob(
            [bytes],
            { type: safeText(documentData.mime_type) || 'application/octet-stream' }
          );
          const objectUrl = URL.createObjectURL(blob);

          if (printOnly) {
            const isImage = String(
              safeText(documentData.mime_type || '')
            ).startsWith('image/');
            if (isImage) {
              printWindow.document.write(
                `<img src="${objectUrl}" style="max-width:100%;max-height:100%;display:block;margin:12px auto;" />`
              );
            } else {
              printWindow.document.write(
                `<iframe src="${objectUrl}" style="width:100%;height:98vh;border:none;"></iframe>`
              );
            }
            printWindow.document.close();
            setTimeout(function () {
              printWindow.focus();
              printWindow.print();
            }, 350);
          } else {
            const anchor = document.createElement('a');
            anchor.href = objectUrl;
            anchor.download = safeText(documentData.file_name || 'document');
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
          }

          setTimeout(function () {
            URL.revokeObjectURL(objectUrl);
          }, 12000);
        })
        .catch(function (error) {
          if (printWindow && !printWindow.closed) {
            printWindow.close();
          }
          showToast(error.message, true);
        });
    }

    async function loadData() {
      const state = document.getElementById('documentsState');
      if (!inited) {
        state.hidden = false;
        state.className = 'loading';
        state.textContent = '載入中…';
      }

      try {
        const result = await jsonpRequest('landlord_contract_documents_init', {
          contract_id: ''
        });
        if (!result || result.success !== true) {
          throw new Error(safeText((result || {}).message || '查詢失敗'));
        }
        const data = result.data || {};
        renderDocuments(
          data.documents || []
        );
        inited = true;
      } catch (error) {
        state.className = 'error';
        state.hidden = false;
        state.textContent =
          `載入失敗：${error.message || '請重試'}`;
        document.getElementById('documentsList').hidden = true;
      }
    }

    function goPage(path) {
      location.href = path;
    }

    document.getElementById('backButton').addEventListener(
      'click',
      function () {
        goPage('landlord-more.html');
      }
    );

    document.getElementById('refreshButton').addEventListener(
      'click',
      function () {
        loadData();
      }
    );

    document.getElementById('backToTenantsButton').addEventListener(
      'click',
      function () {
        goPage('landlord-tenants.html');
      }
    );

    (async function bootstrap() {
      const ok = await initLine();
      if (!ok) {
        return;
      }
      await loadData();
    })();
  </script>
</body>
</html>
