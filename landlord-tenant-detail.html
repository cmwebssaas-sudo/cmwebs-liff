<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>CMWebs 房客詳細資料</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="frontend-release.js"></script>

  <style>
    :root {
      --app-height: 100vh;
      --nav-height: 64px;
      --primary: #06c755;
      --primary-dark: #079641;
      --primary-soft: #effcf4;
      --page-bg: #f4f6fa;
      --card-bg: #ffffff;
      --text-main: #171a1f;
      --text-muted: #747b85;
      --border: #e7ebf0;
      --danger: #e5484d;
      --danger-soft: #fff1f2;
      --warning: #e69b00;
      --warning-soft: #fff7df;
      --blue: #246bfd;
      --blue-soft: #eef4ff;
      --purple: #7c3aed;
      --purple-soft: #f4efff;
      --shadow: 0 7px 24px rgba(30, 40, 60, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text-main);
      font-family:
        Arial,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    body.modal-open {
      overflow: hidden;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: var(--app-height);
      margin: 0 auto;
      overflow: hidden;
      background: var(--page-bg);
    }

    .page {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        16px
        16px
        calc(var(--nav-height) + 28px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .back-button,
    .refresh-button {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #ffffff;
      color: #606773;
      box-shadow: 0 4px 14px rgba(30, 40, 60, 0.05);
      cursor: pointer;
    }

    .back-button svg,
    .refresh-button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .refresh-button.loading svg {
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .topbar-title-wrap {
      min-width: 0;
      flex: 1;
      text-align: center;
    }

    .topbar-title {
      overflow: hidden;
      font-size: 18px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-subtitle {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .card {
      margin-bottom: 14px;
      border: 1px solid rgba(231, 235, 240, 0.92);
      border-radius: 18px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .profile-card {
      overflow: hidden;
    }

    .profile-head {
      padding: 19px;
      background:
        linear-gradient(145deg, rgba(6, 199, 85, 0.1), rgba(255, 255, 255, 0.98) 64%);
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 22px;
      font-weight: 900;
    }

    .profile-text {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      overflow: hidden;
      margin-bottom: 5px;
      font-size: 20px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-meta {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #f0f2f5;
      color: #6c727c;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.green {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .badge.warning {
      background: var(--warning-soft);
      color: #b87500;
    }

    .badge.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .badge.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .badge.purple {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .profile-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 0 19px 19px;
    }

    .summary-box {
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fbfcfd;
    }

    .summary-label {
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
    }

    .summary-value {
      overflow: hidden;
      font-size: 15px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-value.green {
      color: var(--primary-dark);
    }

    .summary-value.red {
      color: var(--danger);
    }

    .section-card {
      padding: 17px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 900;
    }

    .section-hint {
      color: var(--text-muted);
      font-size: 11px;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    .detail-row:first-of-type {
      border-top: 0;
    }

    .detail-label {
      flex: 0 0 auto;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .detail-value {
      min-width: 0;
      flex: 1;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.5;
      text-align: right;
      word-break: break-word;
    }

    .detail-value a {
      color: var(--blue);
      text-decoration: none;
    }

    .amount-block {
      margin-bottom: 13px;
      padding: 15px;
      border-radius: 15px;
      background: var(--primary-soft);
    }

    .amount-block.unpaid {
      background: var(--danger-soft);
    }

    .amount-label {
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .amount-value {
      color: var(--primary-dark);
      font-size: 28px;
      font-weight: 900;
    }

    .amount-block.unpaid .amount-value {
      color: var(--danger);
    }

    .request-card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fbfcfd;
    }

    .request-card:first-of-type {
      margin-top: 0;
    }

    .request-card.active {
      border-color: rgba(124, 58, 237, 0.23);
      background: var(--purple-soft);
    }

    .request-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .request-title {
      font-size: 14px;
      font-weight: 900;
    }

    .request-id {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .request-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .request-box {
      min-width: 0;
      padding: 10px;
      border: 1px solid rgba(225, 229, 235, 0.9);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.78);
    }

    .request-label {
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .request-value {
      overflow: hidden;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.45;
      text-overflow: ellipsis;
    }

    .request-note {
      margin-top: 9px;
      padding: 10px 11px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.75);
      color: #5d6470;
      font-size: 11px;
      line-height: 1.55;
    }

    .empty-state {
      padding: 18px 10px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .tenant-document-context {
      margin-bottom: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--blue-soft);
      color: #425b8f;
      font-size: 11px;
      line-height: 1.55;
    }

    .tenant-document-select {
      width: 100%;
      min-height: 44px;
      margin-bottom: 6px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #ffffff;
      color: var(--text-main);
    }

    .tenant-document-hint {
      margin-bottom: 13px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .tenant-document-upload-grid {
      display: grid;
      gap: 10px;
    }

    .tenant-document-upload-item {
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fbfcfd;
    }

    .tenant-document-upload-item.is-complete {
      border-color: rgba(6, 199, 85, 0.34);
      background: var(--primary-soft);
    }

    .tenant-document-upload-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .tenant-document-upload-label {
      display: block;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 900;
    }

    .tenant-document-upload-state {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .tenant-document-upload-state[hidden],
    .tenant-document-upload-status[hidden] {
      display: none;
    }

    .tenant-document-upload-state-icon {
      display: inline-flex;
      width: 19px;
      height: 19px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
    }

    .tenant-document-upload-state-icon svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tenant-document-upload-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .tenant-document-upload-button-stack {
      display: flex;
      min-width: 104px;
      flex-direction: column;
      gap: 6px;
    }

    .tenant-document-file {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      font-size: 11px;
    }

    .tenant-document-upload-item.is-complete .tenant-document-file {
      border-color: rgba(6, 199, 85, 0.22);
      background: rgba(255, 255, 255, 0.68);
      opacity: 0.72;
    }

    .tenant-document-upload-status {
      margin-top: 7px;
      overflow: hidden;
      color: var(--primary-dark);
      font-size: 10px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tenant-document-upload-button {
      min-height: 42px;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }

    .tenant-document-upload-button:disabled {
      background: #9de6af;
      cursor: not-allowed;
      opacity: 0.75;
    }

    .tenant-document-upload-button.is-complete {
      border: 1px solid rgba(6, 199, 85, 0.35);
      background: #ffffff;
      color: var(--primary-dark);
      opacity: 1;
    }

    .tenant-document-upload-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
    }

    .tenant-document-upload-actions[hidden] {
      display: none;
    }

    .tenant-document-upload-action {
      min-height: 30px;
      padding: 5px 4px;
      border: 1px solid rgba(6, 199, 85, 0.35);
      border-radius: 8px;
      background: #ffffff;
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .tenant-document-list {
      display: grid;
      gap: 9px;
      margin-top: 13px;
    }

    .tenant-document-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #ffffff;
    }

    .tenant-document-item-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .tenant-document-name {
      min-width: 0;
      overflow: hidden;
      font-size: 12px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tenant-document-meta {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .tenant-document-overview-link {
      display: inline-flex;
      margin-top: 12px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action-button {
      min-height: 84px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-direction: column;
      gap: 9px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #ffffff;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
    }

    .action-button:active {
      opacity: 0.67;
    }

    .action-button.disabled {
      cursor: default;
      opacity: 0.45;
    }

    .action-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .action-icon.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .action-icon.orange {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .action-icon.purple {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .action-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-title {
      font-size: 13px;
      font-weight: 900;
    }

    .action-desc {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .loading-card,
    .error-card {
      padding: 30px 18px;
      text-align: center;
    }

    .loading-spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 13px;
      border: 3px solid #e5e9ed;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    .loading-text,
    .error-text {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .error-title {
      margin-bottom: 8px;
      color: var(--danger);
      font-size: 17px;
      font-weight: 900;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      min-height: 46px;
      padding: 12px 16px;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary-button {
      border: 0;
      background: var(--primary);
      color: #ffffff;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
    }

    .danger-button {
      border: 0;
      background: var(--danger);
      color: #ffffff;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .bottom-nav {
      position: absolute;
      z-index: 1000;
      right: 0;
      bottom: 0;
      left: 0;
      border-top: 1px solid #e8ecf1;
      background: rgba(255, 255, 255, 0.98);
      padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(12px);
    }

    .bottom-nav-inner {
      height: var(--nav-height);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      border: 0;
      background: transparent;
      color: #8b919a;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-item svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 900;
    }

    .nav-item.active::after {
      position: absolute;
      bottom: 5px;
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--primary);
      content: "";
    }

    .modal-backdrop {
      position: absolute;
      z-index: 1500;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(17, 24, 39, 0.48);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-height:
        calc(
          var(--app-height) -
          var(--nav-height) -
          env(safe-area-inset-bottom) -
          18px
        );
      overflow-y: auto;
      padding: 18px 16px 22px;
      border-radius: 22px 22px 0 0;
      background: #ffffff;
      box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.16);
      transform: translateY(12px);
      animation: sheet-in 0.2s ease forwards;
    }

    @keyframes sheet-in {
      to {
        transform: translateY(0);
      }
    }

    .modal-handle {
      width: 42px;
      height: 4px;
      margin: 0 auto 15px;
      border-radius: 999px;
      background: #d9dde3;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 900;
    }

    .modal-subtitle {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .field-label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: 900;
    }

    .textarea {
      width: 100%;
      min-height: 145px;
      resize: vertical;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      color: var(--text-main);
      background: #ffffff;
      line-height: 1.6;
    }

    .textarea:focus {
      border-color: rgba(6, 199, 85, 0.55);
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.1);
    }

    .field-hint {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .toast {
      position: absolute;
      z-index: 3000;
      right: 18px;
      bottom: calc(var(--nav-height) + 22px + env(safe-area-inset-bottom));
      left: 18px;
      display: none;
      padding: 13px 15px;
      border-radius: 13px;
      background: rgba(25, 28, 33, 0.94);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 390px) {
      .profile-summary,
      .request-grid,
      .action-grid,
      .button-row {
        grid-template-columns: 1fr;
      }

      .page {
        padding-right: 13px;
        padding-left: 13px;
      }
    }
  </style>
</head>

      'https://script.google.com/macros/s/AKfycbyrwKb3adOgHVBwbwHwLeSsDoUgYhaUaFXui66tnyMNBrT9eOVbi788oHeVRTif_LA9BA/exec';

    const LIFF_ID =

    const TEST_LINE_USER_ID =
      'Uf708ece75c9c985cfe1dbda48d123511';

    const URL_PARAMS =

      String(

    function setAppHeight() {
      const height =
        window.visualViewport && window.visualViewport.height
          ? window.visualViewport.height
          : window.innerHeight;

      document.documentElement.style.setProperty(
        '--app-height',
        Math.round(height) + 'px'
      );
    }

    function rawText(value) {
      if (
        value === undefined ||
        value === null ||
        value === ''
      ) {
        return '';
      }

      return String(value);
    }

    function safeHtml(value) {
      return rawText(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function money(value) {
      const number =
        Number(value || 0);

      return (
        'NT$ ' +
        Math.round(number).toLocaleString(
          'zh-TW'
        )
      );
    }

    function formatDate(value) {
      const text =
        rawText(value).trim();

      if (!text) {
        return '-';
      }

      const match =
        text.match(
          /^(\d{4})-(\d{2})-(\d{2})/
        );

      if (match) {
        return (
          match[1] +
          '-' +
          match[2] +
          '-' +
          match[3]
        );
      }

      const date =
        new Date(text);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return text;
      }

      return date.toLocaleDateString(
        'zh-TW',
        {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }
      );
    }

    function goPage(page) {
      const separator =
        page.indexOf('?') >= 0

          TEST_MODE

    function showToast(message) {
      const toast =
        document.getElementById('toast');

      toast.textContent =

      toast.classList.add('show');

      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(function () {
          toast.classList.remove('show');
        }, 2400);
    }

    function jsonpRequest(action, params) {
      return new Promise(function (resolve, reject) {
        const callbackName =
          '__cmwebs_tenant_detail_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() * 1000000
          );

        const script =
          document.createElement('script');

        let finished = false;

        const timer =
          setTimeout(function () {
            if (finished) {
              return;
            }

            finished = true;
            cleanup();

            reject(
              new Error('API 載入逾時')
            );
          }, 30000);

        function cleanup() {
          clearTimeout(timer);

          if (script.parentNode) {
            script.parentNode.removeChild(
              script
            );
          }

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] =
              undefined;
          }
        }

        window[callbackName] =
          function (result) {
            if (finished) {
              return;
            }

            finished = true;
            cleanup();
            resolve(result);
          };

        let url =
          API_URL +
          '?v2_action=' +
          encodeURIComponent(action) +
          '&line_user_id=' +
          encodeURIComponent(
            LINE_USER_ID
          ) +
          '&callback=' +
          encodeURIComponent(
            callbackName
          ) +
          '&_=' +
          Date.now();

        Object.keys(
          params || {}
        ).forEach(function (key) {
          const value =
            params[key];

          if (
            value === undefined ||
            value === null
          ) {
            return;
          }

          url +=
            '&' +
            encodeURIComponent(key) +
            '=' +
            encodeURIComponent(value);
        });

        script.charset = 'UTF-8';

        script.onerror =
          function () {
            console.warn(
              'JSONP script onerror ignored.'
            );
          };

        script.src = url;
        document.body.appendChild(script);
      });
    }

    async function initLineUserId() {
      if (TEST_MODE) {
        LINE_USER_ID =
          TEST_LINE_USER_ID;

        return true;
      }

      if (
        typeof liff ===
        'undefined'
      ) {
        throw new Error(
          'LIFF SDK 載入失敗'
        );
      }

      await liff.init({
        liffId: LIFF_ID
      });

      if (!liff.isLoggedIn()) {
        liff.login({
          redirectUri:
            location.href
        });

        return false;
      }

      const profile =
        await liff.getProfile();

      LINE_USER_ID =
        profile.userId || '';

      if (!LINE_USER_ID) {
        throw new Error(
          '無法取得房東 LINE User ID'
        );
      }

      return true;
    }

    function unwrapData(result) {
      if (
        result &&
        result.success === true
      ) {
        return (
          result.data !== undefined
            ? result.data
            : result
        );
      }

      throw new Error(
        result && result.message
          ? result.message
        : '查詢失敗'
      );
    }

    function formatDocumentBytes(size) {
      const number = Number(size || 0);

      if (!number) {
        return '0B';
      }

      if (number < 1024) {
        return number + 'B';
      }

      if (number < 1024 * 1024) {
        return (number / 1024).toFixed(1) + 'KB';
      }

      return (number / 1024 / 1024).toFixed(1) + 'MB';
    }

    function tenantDocumentTypeLabel(type) {
      const labels = {
        legacy_contract: '舊合約',
        identity_front: '身分證正面',
        identity_back: '身分證反面',
        selfie: '自拍照'
      };

      return labels[type] || type || '文件';
    }

    async function postJsonBody(payload) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          // Apps Script Web Apps do not answer the CORS preflight triggered by
          // application/json. text/plain keeps this cross-origin upload a
          // simple request while the body remains JSON for doPost parsing.
          'Content-Type': 'text/plain;charset=UTF-8'
        },
        body: JSON.stringify(payload)
      });

      const text = await response.text();

      try {
        return JSON.parse(text);
      } catch (_) {
        throw new Error('回應格式錯誤：' + text);
      }
    }

    function readFileAsBase64(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();

        reader.onload = function () {
          const dataUrl = String(reader.result || '');
          const parts = dataUrl.split(',');

          resolve({
            base64: parts.length > 1 ? parts[1] : '',
            mimeType:
              parts.length > 1
                ? parts[0].replace('data:', '').split(';')[0]
                : file.type
          });
        };

        reader.onerror = function () {
          reject(new Error('讀取檔案失敗'));
        };

        reader.readAsDataURL(file);
      });
    }

        selfie:

      return icons[type] || icons.legacy_contract;
    }

    function tenantDocumentUploadItemForType(type) {
      const items = document.querySelectorAll(
        '[data-tenant-document-upload-type]'
      );

      for (let index = 0; index < items.length; index += 1) {
        if (
          items[index].getAttribute('data-tenant-document-upload-type') ===
          type
        ) {
          return items[index];
        }
      }

      return null;
    }

    function bindTenantDocumentUploadActions(item, documentId) {
      if (!item) {
        return;
      }

      const actions = item.querySelector(
        '.tenant-document-upload-actions'
      );
      const buttons = item.querySelectorAll(
        '[data-tenant-document-upload-action]'
      );
      const safeDocumentId = rawText(documentId).trim();

      if (actions) {
        actions.hidden = !safeDocumentId;
      }

      buttons.forEach(function (button) {
        button.disabled = !safeDocumentId;

        if (safeDocumentId) {
          button.setAttribute('data-document-id', safeDocumentId);
          button.onclick = function () {
            downloadTenantDocument(
              safeDocumentId,
              button.getAttribute('data-tenant-document-upload-action') ===
                'print'
            );
          };
        } else {
          button.removeAttribute('data-document-id');
          button.onclick = null;
        }
      });
    }

    function resetTenantDocumentUploadStates() {
      document
        .querySelectorAll('[data-tenant-document-upload-type]')
        .forEach(function (item) {
          const type = item.getAttribute(
            'data-tenant-document-upload-type'
          );
          const input = item.querySelector('.tenant-document-file');
          const button = item.querySelector(
            '.tenant-document-upload-button'
          );
          const state = item.querySelector(
            '.tenant-document-upload-state'
          );
          const status = item.querySelector(
            '.tenant-document-upload-status'
          );

          item.classList.remove('is-complete');

          if (input) {
            input.disabled = false;
            input.title = '';
          }

          if (button) {
            button.disabled = false;
            button.classList.remove('is-complete');
            button.textContent = tenantDocumentUploadButtonLabel(type);
          }

          if (state) {
            state.hidden = true;
          }

          if (status) {
            status.hidden = true;
            status.textContent = '';
          }

          bindTenantDocumentUploadActions(item, '');
        });
    }

    function markTenantDocumentTypeUploaded(type, documentData) {
      const item = tenantDocumentUploadItemForType(type);

      if (!item) {
        return;
      }

      const input = item.querySelector('.tenant-document-file');
      const button = item.querySelector('.tenant-document-upload-button');
      const state = item.querySelector('.tenant-document-upload-state');
      const status = item.querySelector('.tenant-document-upload-status');
      const fileName = rawText(
        documentData && documentData.file_name
          ? documentData.file_name
          : ''
      );

      item.classList.add('is-complete');

      if (input) {
        input.disabled = true;
        input.title = '此項目已上傳，無需重複上傳';
      }

      if (button) {
        button.disabled = true;
        button.classList.add('is-complete');
        button.textContent = '已上傳';
      }

      if (state) {
        state.hidden = false;
      }

      if (status) {
        status.hidden = false;
        status.textContent = fileName
          ? '已歸檔：' + fileName
          : '已歸檔，無需重複上傳';
      }

      bindTenantDocumentUploadActions(
        item,
        documentData && documentData.document_id
      );
    }

    function updateTenantDocumentUploadStates(documents) {
      resetTenantDocumentUploadStates();

      const latestByType = {};
      (Array.isArray(documents) ? documents : []).forEach(function (
        documentData
      ) {
        const type = rawText(documentData && documentData.document_type);

        if (type && !latestByType[type]) {
          latestByType[type] = documentData;
        }
      });

      Object.keys(latestByType).forEach(function (type) {
        markTenantDocumentTypeUploaded(type, latestByType[type]);
      });
    }

    function isTenantDocumentTypeUploaded(type) {
      const item = tenantDocumentUploadItemForType(type);
      return Boolean(item && item.classList.contains('is-complete'));
    }

      updateTenantDocumentUploadStates(rows);

        .map(function (documentData) {

    async function loadTenantDocuments() {
      if (!TENANT_ID) {
        return;
      }

      const result = await jsonpRequest(
        'landlord_contract_documents_init',
        {
          tenant_id: TENANT_ID
        }
      );
      const data = unwrapData(result);
      const contracts = Array.isArray(data.contracts)
        ? data.contracts.filter(function (contract) {
            return rawText(contract.tenant_id).trim() === TENANT_ID;
          })
        : [];

      renderTenantDocumentContracts(contracts);
      renderTenantDocumentList(
        Array.isArray(data.documents) ? data.documents : []
      );
    }

    async function uploadTenantDocument(type, inputId) {
      if (!CURRENT_TENANT || !TENANT_ID) {
        showToast('找不到房客資料', true);
        return;
      }

      if (isTenantDocumentTypeUploaded(type)) {
        showToast('此項目已上傳，無需重複上傳', true);
        return;
      }

      const input = document.getElementById(inputId);
      const file = input && input.files ? input.files[0] : null;

      if (!file) {
        showToast('請先選擇檔案', true);
        return;
      }

      if (file.size <= 0 || file.size > 8 * 1024 * 1024) {
        showToast('檔案大小必須介於 1B 至 8MB', true);
        return;
      }

      const contractSelect = document.getElementById(
        'tenantDocumentContractSelect'
      );
      const button = document.getElementById(
        tenantDocumentUploadButtonId(type)
      );
      const contractId = contractSelect
        ? rawText(contractSelect.value).trim()
        : '';

      if (button) {
        button.disabled = true;
        button.textContent = '上傳中…';
      }

      try {
        const filePayload = await readFileAsBase64(file);
        const result = await postJsonBody({
          v2_action: 'landlord_contract_document_upload',
          line_user_id: LINE_USER_ID,
          tenant_id: TENANT_ID,
          contract_id: contractId,
          document_type: type,
          file_name: file.name,
          mime_type: filePayload.mimeType || file.type,
          base64: filePayload.base64,
          idempotency_key:
            type +
            '_' +
            TENANT_ID +
            '_' +
            (contractId || 'noc') +
            '_' +
            Date.now() +
            '_' +
            Math.random().toString(36).slice(2, 10)
        });

        if (!result || result.success !== true) {
          throw new Error(
            rawText((result || {}).message || '上傳失敗')
          );
        }

        input.value = '';
        showToast('文件已歸檔到此房客資料');
        await loadTenantDocuments();
      } catch (error) {
        showToast(
          rawText(error && error.message ? error.message : '上傳失敗'),
          true
        );
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = tenantDocumentUploadButtonLabel(type);
        }
      }
    }

    async function downloadTenantDocument(documentId, printOnly) {
      if (!documentId) {
        showToast('找不到文件編號', true);
        return;
      }

      try {
        const result = await jsonpRequest(
          'landlord_contract_document_download',
          { document_id: documentId }
        );
        const documentData =
          result &&
          result.success === true &&
          result.data &&
          result.data.document
            ? result.data.document
            : null;

        if (!documentData || !documentData.base64) {
          throw new Error(
            rawText((result || {}).message || '下載資料不完整')
          );
        }

        const binary = atob(rawText(documentData.base64));
        const bytes = new Uint8Array(binary.length);

        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }

        const blob = new Blob([bytes], {
          type: rawText(documentData.mime_type || 'application/octet-stream')
        });
        const objectUrl = URL.createObjectURL(blob);

        if (printOnly) {
          const printWindow = window.open('', '_blank');

          if (!printWindow) {
            throw new Error('請允許快顯視窗後再試一次');
          }

          if (rawText(documentData.mime_type).startsWith('image/')) {
            printWindow.document.write(
              '<img src="' +
                objectUrl +
                '" style="max-width:100%;max-height:100%;display:block;margin:12px auto;" />'
            );
          } else {
            printWindow.document.write(
              '<iframe src="' +
                objectUrl +
                '" style="width:100%;height:98vh;border:none;"></iframe>'
            );
          }

          printWindow.document.close();
          setTimeout(function () {
            printWindow.focus();
            printWindow.print();
          }, 350);
        } else {
          const anchor = document.createElement('a');
          anchor.href = objectUrl;
          anchor.download = rawText(documentData.file_name || 'document');
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
        }

        setTimeout(function () {
          URL.revokeObjectURL(objectUrl);
        }, 12000);
      } catch (error) {
        showToast(
          rawText(error && error.message ? error.message : '下載失敗'),
          true
        );
      }
    }

    function normalizedStatus(value) {
      return rawText(value)
        .trim()
        .toLowerCase();
    }

    function statusLabel(value) {
      const status =
        normalizedStatus(value);

      const labels = {
        active: '有效',
        enabled: '啟用',
        bound: '已綁定',
        checked_in: '已報到',
        pending: '待審核',
        approved: '已核准・待完成',
        completed: '已完成',
        rejected: '已駁回',
        cancelled: '已取消',
        paid: '已繳',
        unpaid: '未繳',
        overdue: '逾期',
        processing: '處理中',
        charged: '收取違約金',
        waived: '免收違約金',
        not_applicable: '不適用'
      };

      return (
        labels[status] ||
        rawText(value) ||
        '-'
      );
    }

    function statusBadgeClass(value) {
      const status =
        normalizedStatus(value);

      if (
        [
          'active',
          'enabled',
          'bound',
          'checked_in',
          'paid',
          'completed'
        ].indexOf(status) >= 0
      ) {
        return 'badge green';
      }

      if (
        [
          'pending',
          'processing'
        ].indexOf(status) >= 0
      ) {
        return 'badge warning';
      }

      if (
        [
          'unpaid',
          'overdue',
          'rejected'
        ].indexOf(status) >= 0
      ) {
        return 'badge danger';
      }

      if (status === 'approved') {
        return 'badge purple';
      }

      return 'badge';
    }

    function requestTypeLabel(item) {
      const type =
        normalizedStatus(
          item.request_type
        );

      if (type === 'renewal') {
        return '續約申請';
      }

      if (type === 'termination') {
        return (
          normalizedStatus(
            item.termination_type
          ) === 'early_termination'
            ? '提前解約'
            : '到期不續約'
        );
      }

      return (
        item.request_type_label ||
        item.request_type ||
        '合約申請'
      );
    }

    function penaltyLabel(item) {
      const status =
        normalizedStatus(
          item.penalty_status
        );

      if (!status) {
        return '-';
      }

      if (status === 'charged') {
        return (
          '收取 ' +
          money(
            item.penalty_amount
          )
        );
      }

      return statusLabel(status);
    }

            <div class="request-box">

                ${safeHtml(secondLeftLabel)}

              <div class="request-value">

              )}
            </div>
          </div>

          <div class="detail-row">
            <div class="detail-label">付款狀態</div>
            <div class="detail-value">
              <span class="${statusBadgeClass(paymentStatus)}">
                ${safeHtml(
                  statusLabel(paymentStatus)
                )}
              </span>
            </div>
          </div>

          <div class="detail-row">
            <div class="detail-label">未繳帳單數</div>
            <div class="detail-value">
              ${Number(
                item.unpaid_bill_count || 0
              )} 筆
            </div>
          </div>
        </section>

        <section class="card section-card">
          <div class="section-title-row">
            <div class="section-title">合約申請紀錄</div>
            <div class="section-hint">
              共 ${requests.length} 筆
            </div>
          </div>

          ${
            requests.length > 0
              ? requests
                  .map(renderRequestCard)
                  .join('')
              : `
                <div class="empty-state">
                  此房客目前沒有續約或解約申請紀錄。
                </div>
              `
          }

          <button
            class="primary-button"
            style="width:100%;margin-top:13px;"
            type="button"
            onclick="goContractRequests()"
          >
            前往合約申請管理
          </button>
        </section>

        ${tenantDocumentPanelHtml()}

        <section class="card section-card">
          <div class="section-title-row">
            <div class="section-title">快速操作</div>
          </div>

          <div class="action-grid">
            <button
              class="action-button ${phone ? '' : 'disabled'}"
              type="button"
              onclick="${phone ? `location.href='tel:${safeHtml(phone)}'` : `showToast('此房客沒有電話資料')`}"
            >
              <div class="action-icon blue">
                <svg viewBox="0 0 24 24">
                  <path d="M7 4l3 4-2 2c1.4 3 3 4.6 6 6l2-2 4 3-1 3c-.3 1-1.3 1.5-2.4 1.3C9.7 20 4 14.3 2.7 7.4 2.5 6.3 3 5.3 4 5z"></path>
                </svg>
              </div>

              <div>
                <div class="action-title">撥打電話</div>
                <div class="action-desc">直接聯絡房客</div>
              </div>
            </button>

            <button
              class="action-button"
              type="button"
              onclick="sendPaymentReminder()"
            >
              <div class="action-icon orange">
                <svg viewBox="0 0 24 24">
                  <path d="M6 3.5h12v17l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2v-17z"></path>
                  <path d="M9 9h6"></path>
                  <path d="M9 13h6"></path>
                </svg>
              </div>

              <div>
                <div class="action-title">傳送繳費提醒</div>
                <div class="action-desc">透過 LINE 發送提醒</div>
              </div>
            </button>

            <button
              class="action-button"
              type="button"
              onclick="openMessageModal()"
            >
              <div class="action-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M5 5.5h14v10H9l-4 3.5z"></path>
                  <path d="M8.5 9.5h7"></path>
                  <path d="M8.5 12.5h5"></path>
                </svg>
              </div>

              <div>
                <div class="action-title">自訂 LINE 訊息</div>
                <div class="action-desc">傳送自訂內容給房客</div>
              </div>
            </button>

            <button
              class="action-button"
              type="button"
              onclick="goTenantLogs()"
            >
              <div class="action-icon purple">
                <svg viewBox="0 0 24 24">
                  <path d="M5 6.5h14V16H8l-3 3z"></path>
                  <path d="M8.5 10h7"></path>
                  <path d="M8.5 13h5"></path>
                </svg>
              </div>

              <div>
                <div class="action-title">LINE 訊息紀錄</div>
                <div class="action-desc">查看發送與接收歷程</div>
              </div>
            </button>
          </div>
        </section>
      `;
    }

    function renderError(message) {
      document.getElementById(
        'app'
      ).innerHTML = `
        <section class="card error-card">
          <div class="error-title">
            房客資料讀取失敗
          </div>

          <div class="error-text">
            ${safeHtml(
              message || '未知錯誤'
            )}
          </div>

          <div class="button-row">
            <button
              class="secondary-button"
              type="button"
              onclick="goPage('landlord-tenants.html')"
            >
              返回房客名單
            </button>

            <button
              class="primary-button"
              type="button"
              onclick="loadPage()"
            >
              重新整理
            </button>
          </div>
        </section>
      `;
    }

    function setRefreshLoading(
      loading
    ) {
      const button =
        document.getElementById(
          'refreshButton'
        );

      if (!button) {
        return;
      }

      button.classList.toggle(
        'loading',
        Boolean(loading)
      );
    }

    async function loadPage() {
      setRefreshLoading(true);

      try {
        if (!TENANT_ID) {
          throw new Error(
            '網址缺少 tenant_id'
          );
        }

        if (!LINE_USER_ID) {
          const ready =
            await initLineUserId();

          if (!ready) {
            return;
          }
        }

        const results =
          await Promise.allSettled([
            jsonpRequest(
              'landlord_tenants',
              {}
            ),
            jsonpRequest(
              'landlord_contract_requests_init',
              {}
            )
          ]);

        if (
          results[0].status !==
          'fulfilled'
        ) {
          throw results[0].reason;
        }

        const tenantData =
          unwrapData(
            results[0].value
          );

        let requests = [];

        if (
          results[1].status ===
          'fulfilled'
        ) {
          try {
            const contractData =
              unwrapData(
                results[1].value
              );

            requests =
              Array.isArray(
                contractData.requests
              )
                ? contractData.requests
                    .filter(
                      function (request) {
                        return (
                          rawText(
                            request.tenant_id
                          ).trim() ===
                          TENANT_ID
                        );
                      }
                    )
                    .sort(
                      function (a, b) {
                        const aTime =
                          new Date(
                            a.updated_at ||
                            a.created_at ||
                            0
                          ).getTime();

                        const bTime =
                          new Date(
                            b.updated_at ||
                            b.created_at ||
                            0
                          ).getTime();

                        return bTime - aTime;
                      }
                    )
                : [];
          } catch (error) {
            console.warn(
              '合約申請資料讀取失敗：',
              error
            );
          }
        }

        renderPage(
          tenantData,
          requests
        );

        try {
          await loadTenantDocuments();
        } catch (error) {
          renderTenantDocumentError(error);
        }
      } catch (error) {
        renderError(
          error && error.message
            ? error.message
            : String(error)
        );
      } finally {
        setRefreshLoading(false);
      }
    }

    function openMessageModal() {
      if (!CURRENT_TENANT) {
        showToast(
          '找不到房客資料'
        );

        return;
      }

      document.getElementById(
        'messageModalSubtitle'
      ).textContent =
        (
          CURRENT_TENANT.tenant_name ||
          '房客'
        ) +
        '・房號 ' +
        (
          CURRENT_TENANT.room_list ||
          '-'
        );

      document.getElementById(
        'customLineMessage'
      ).value = '';

      updateMessageCount();

      document.getElementById(
        'messageModal'
      ).classList.add('show');

      document.body.classList.add(
        'modal-open'
      );
    }

    function closeMessageModal() {
      document.getElementById(
        'messageModal'
      ).classList.remove('show');

      document.body.classList.remove(
        'modal-open'
      );
    }

    function closeMessageModalFromBackdrop(
      event
    ) {
      if (
        event.target &&
        event.target.id ===
        'messageModal'
      ) {
        closeMessageModal();
      }
    }

    function updateMessageCount() {
      const textarea =
        document.getElementById(
          'customLineMessage'
        );

      document.getElementById(
        'messageCount'
      ).textContent =
        (
          textarea
            ? textarea.value.length
            : 0
        ) +
        ' / 500';
    }

    async function sendTenantLineMessage(
      messageType,
      messageText
    ) {
      if (!CURRENT_TENANT) {
        throw new Error(
          '找不到房客資料'
        );
      }

      const result =
        await jsonpRequest(
          'landlord_send_tenant_message',
          {
            tenant_id:
              CURRENT_TENANT.tenant_id || '',
            tenant_user_id:
              CURRENT_TENANT.tenant_user_id || '',
            message_type:
              messageType,
            message_text:
              messageText || ''
          }
        );

      if (
        !result ||
        result.success !== true
      ) {
        throw new Error(
          result && result.message
            ? result.message
            : 'LINE 訊息發送失敗'
        );
      }

      return result;
    }

    async function sendPaymentReminder() {
      if (!CURRENT_TENANT) {
        showToast(
          '找不到房客資料'
        );

        return;
      }

      const confirmed =
        window.confirm(
          '確定要傳送 LINE 繳費提醒給「' +
          (
            CURRENT_TENANT.tenant_name ||
            '房客'
          ) +
          '」嗎？'
        );

      if (!confirmed) {
        return;
      }

      try {
        showToast(
          'LINE 訊息傳送中...'
        );

        await sendTenantLineMessage(
          'payment_reminder',
          ''
        );

        showToast(
          '繳費提醒已送出'
        );
      } catch (error) {
        showToast(
          error && error.message
            ? error.message
            : '發送失敗'
        );
      }
    }

    async function submitCustomMessage() {
      const textarea =
        document.getElementById(
          'customLineMessage'
        );

      const message =
        textarea
          ? textarea.value.trim()
          : '';

      if (!message) {
        showToast(
          '請輸入訊息內容'
        );

        return;
      }

      if (message.length > 500) {
        showToast(
          '自訂訊息最多 500 字'
        );

        return;
      }

      const button =
        document.getElementById(
          'sendMessageButton'
        );

      button.disabled = true;
      button.textContent =
        '傳送中...';

      try {
        await sendTenantLineMessage(
          'custom',
          message
        );

        closeMessageModal();

        showToast(
          'LINE 訊息已送出'
        );
      } catch (error) {
        showToast(
          error && error.message
            ? error.message
            : '發送失敗'
        );
      } finally {
        button.disabled = false;
        button.textContent =
          '傳送訊息';
      }
    }

    setAppHeight();

    window.addEventListener(
      'resize',
      setAppHeight
    );

    window.addEventListener(
      'orientationchange',
      function () {
        setTimeout(
          setAppHeight,
          250
        );
      }
    );

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        'resize',
        setAppHeight
      );
    }

    loadPage();
  </script>
</body>
</html>
