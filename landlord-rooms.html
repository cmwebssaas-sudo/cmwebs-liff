  <style>
    :root {
      --app-height: 100vh;
      --nav-height: 68px;
      --primary: #0f766e;
      --primary-soft: #e8f5f1;
      --page-bg: #f6f8f7;
      --surface: #ffffff;
      --text: #25302c;
      --muted: #6b706c;
      --border: #e3e9e5;
      --shadow: 0 12px 30px rgba(37, 48, 44, 0.08);
      --danger: #c2414b;
      --danger-soft: #fff0f1;
      --warning: #9a6700;
      --warning-soft: #fff7df;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text);
      font-family: Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    button, input { font: inherit; }
    .app-shell {
      position: relative;
      top: var(--app-offset-top, 0px);
      width: 100%;
      max-width: 1180px;
      height: var(--app-height);
      margin: 0 auto;
      overflow: hidden;
      background: var(--page-bg);
    }
    .page {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 26px calc(var(--nav-height) + 34px + env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .eyebrow {
      color: var(--primary);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .05em;
    }
    .page-title { margin-top: 5px; font-size: 30px; font-weight: 900; letter-spacing: -.04em; }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .outline-button, .refresh-button {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      color: var(--primary);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37,48,44,.05);
    }
    .outline-button { padding: 0 15px; }
    .refresh-button { width: 44px; font-size: 20px; }
    .card {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .hero { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 14px 16px; background: #fff; }
    .hero-kicker { color: var(--primary); font-size: 13px; font-weight: 900; }
    .hero h1 { margin: 0; font-size: 18px; letter-spacing: -.04em; }
    .hero p { margin: 9px 0 0; max-width: 700px; color: var(--muted); line-height: 1.6; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 0; }
    .pill { display: inline-flex; align-items: center; min-height: 30px; padding: 0 11px; border-radius: 999px; background: #fff; color: var(--primary); font-size: 12px; font-weight: 900; }
    .hero-action { min-height: 34px; padding: 0 13px; border: 1px solid #b8ddcf; border-radius: 999px; background: var(--primary); color: #fff; font-size: 12px; font-weight: 900; cursor: pointer; }
    .toolbar { padding: 16px; }
    .toolbar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .search { flex: 1 1 260px; min-height: 46px; padding: 0 15px; border: 1px solid var(--border); border-radius: 13px; background: #fbfcfb; color: var(--text); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter { min-height: 42px; padding: 0 13px; border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--muted); font-size: 13px; font-weight: 900; cursor: pointer; }
    .filter.active { border-color: #a9daca; background: var(--primary-soft); color: var(--primary); }
    .section-heading { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin: 22px 2px 12px; }
    .section-heading h2 { margin: 0; font-size: 21px; }
    .section-heading span { color: var(--muted); font-size: 13px; }
    .room-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .room-card { overflow: hidden; padding: 0; }
    .room-card-body { padding: 16px; }
    .room-photo { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #eef2ef; }
    .room-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .room-photo-track { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
    .room-photo-track::-webkit-scrollbar { display: none; }
    .room-photo-slide { flex: 0 0 100%; min-width: 0; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
    .room-photo-counter { position: absolute; bottom: 12px; right: 12px; border-radius: 99px; padding: 5px 10px; background: #25302cbb; color: #fff; font-size: 12px; pointer-events: none; }
    .room-photo-arrow { position: absolute; top: calc(50% - 22px); width: 44px; height: 44px; border: 0; border-radius: 50%; background: #ffffffdd; color: var(--primary); font-size: 26px; cursor: pointer; }
    .room-photo-arrow[data-photo-prev] { left: 10px; }
    .room-photo-arrow[data-photo-next] { right: 10px; }
    .room-photo-arrow:disabled { opacity: .35; cursor: default; }
    .room-share { position: absolute; top: 6px; right: 6px; z-index: 2; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: transparent; color: #24332f; cursor: pointer; }
    .room-share::before { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(0,0,0,.06); border-radius: 50%; background: rgba(255,255,255,.95); box-shadow: 0 1px 4px rgba(0,0,0,.05); pointer-events: none; }
    .room-share svg { position: relative; width: 17px; height: 17px; pointer-events: none; }
    .room-share:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
    .room-share:disabled { opacity: .55; cursor: wait; }
    @media (max-width: 767px) { .room-photo-arrow { display: none; } }
    .room-share-fallback { overflow-wrap: anywhere; user-select: text; font-size: 13px; color: var(--primary); }
    .room-photo [hidden] { display: none !important; }
    .room-photo-empty { display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 13px; }
    .room-photo-empty svg { width: 38px; height: 38px; fill: none; stroke: #a6b5ac; stroke-width: 1.4; }
    .room-photo .status { position: absolute; top: 12px; left: 12px; background: #fff; box-shadow: 0 2px 8px #00000012; }
    .room-card-title { margin: 0; overflow: hidden; color: var(--text); font-size: 18px; line-height: 1.4; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
    .room-card-meta { margin: 7px 0 12px; color: var(--muted); font-size: 13px; }
    .room-card-rent { color: var(--primary); font-size: 24px; font-weight: 900; }
    .room-card-rent small { margin-left: 4px; font-size: 12px; font-weight: 500; }
    .room-card-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 14px; }
    .room-card-actions .z3house-link { display: flex; justify-content: center; align-items: center; min-height: 44px; margin: 0; border-radius: 10px; background: var(--primary); color: #fff; font-size: 14px; text-decoration: none; }
    .room-admin-link { display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #b8ddcf; border-radius: 10px; color: var(--primary); background: #fff; font-size: 13px; font-weight: 800; text-decoration: none; }
    .room-admin-link:hover { background: var(--primary-soft); }

    .z3house-card { margin-top: 15px; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: #fbfcfb; }

    .z3house-media img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .z3house-status.published { background: var(--primary-soft); color: var(--primary); }
    .z3house-status.hidden { background: var(--warning-soft); color: var(--warning); }

    .z3house-link:hover { text-decoration: underline; }
    .z3house-meta { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .desktop-main #app .room-card { display: block; }
    .room-head { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .property-name { color: var(--primary); font-size: 12px; font-weight: 900; }
    .room-name { margin-top: 5px; font-size: 23px; font-weight: 900; letter-spacing: -.03em; }
    .room-id { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .status { display: inline-flex; align-items: center; min-height: 27px; padding: 0 10px; border-radius: 999px; background: #f0f2f1; color: var(--muted); font-size: 11px; font-weight: 900; white-space: nowrap; }
    .status.active, .status.vacant { background: var(--primary-soft); color: var(--primary); }
    .status.maintenance, .status.unavailable { background: var(--warning-soft); color: var(--warning); }
    .status.archived { background: var(--danger-soft); color: var(--danger); }
    .room-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 15px; }
    .summary-cell { padding: 12px; border: 1px solid var(--border); border-radius: 14px; background: #fbfcfb; }
    .summary-label { color: var(--muted); font-size: 11px; }
    .summary-value { margin-top: 5px; overflow: hidden; font-size: 15px; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
    .room-note { margin-top: 14px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .loading, .empty, .error { padding: 38px 20px; text-align: center; color: var(--muted); }
    .loading-title, .empty-title, .error-title { margin-bottom: 7px; color: var(--text); font-size: 18px; font-weight: 900; }
    .error-title { color: var(--danger); }
    .retry-button { min-height: 44px; margin-top: 17px; padding: 0 18px; border: 0; border-radius: 12px; background: #06c755; color: #fff; font-weight: 900; cursor: pointer; }
    .toast { position: fixed; right: 20px; bottom: 24px; z-index: 1200; max-width: min(420px, calc(100vw - 40px)); padding: 13px 16px; border-radius: 13px; background: #26312d; color: #fff; font-size: 13px; opacity: 0; pointer-events: none; transform: translateY(12px); transition: opacity .18s ease, transform .18s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .bottom-nav { position: absolute; right: 0; bottom: 0; left: 0; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid rgba(227, 233, 229, .9); background: rgba(255, 255, 255, .94); backdrop-filter: blur(12px); }
    .bottom-nav-inner { display: grid; height: var(--nav-height); grid-template-columns: repeat(5, 1fr); }
    .nav-item { position: relative; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; border: 0; background: transparent; color: #8b919a; cursor: pointer; flex-direction: column; font-size: 11px; font-weight: 700; }
    .nav-item svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9; }
    .nav-item.active { color: var(--primary); font-weight: 900; }
    .nav-item.active::after { position: absolute; bottom: 5px; width: 18px; height: 3px; border-radius: 999px; background: var(--primary); content: ""; }
    .nav-item:active { opacity: .65; }
    @media (min-width: 1024px) { .bottom-nav { display: none; } .desktop-main > .topbar { display: none; } }
    @media (max-width: 1023px) {
      .room-input-active .bottom-nav { display: none; }
      .room-input-active .page { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    }
    @media (max-width: 700px) {
      .page { padding: 18px 15px calc(var(--nav-height) + 26px + env(safe-area-inset-bottom)); }
      .topbar { align-items: center; }
      .page-title { font-size: 25px; }
      .hero { padding: 12px; }
      .hero h1 { font-size: 16px; }
      .room-grid { grid-template-columns: 1fr; }
      .topbar .outline-button { display: none; }
    }
    @media (max-width: 430px) {
      .room-summary { grid-template-columns: 1fr 1fr; }
      .toolbar-row { align-items: stretch; }
      .filters { width: 100%; }
      .filter { flex: 1 1 auto; }
    }
  </style>
</head>

    function text(value) { return value === undefined || value === null ? '' : String(value); }
    function safeHtml(value) { return text(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function money(value) { const amount = Number(value); return Number.isFinite(amount) && amount > 0 ? 'NT$ ' + new Intl.NumberFormat('zh-TW').format(amount) : '未設定'; }
    function setAppHeight() {
      const height = window.visualViewport && window.visualViewport.height ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', Math.round(height) + 'px');
      const field = document.activeElement;
      const editing = window.innerWidth < 1024 && !!(field && field.matches('input, textarea, select'));
      document.documentElement.classList.toggle('room-input-active', editing);
      // iOS can pan the visual viewport after shrinking it. Height alone leaves
      // the clipped shell above the keyboard; keep its origin visible as well.
      const offset = editing && window.visualViewport ? Math.max(0, Number(window.visualViewport.offsetTop) || 0) : 0;
      document.documentElement.style.setProperty('--app-offset-top', offset + 'px');
    }
    let roomInputRevealTimer = null;
    function scheduleRoomInputReveal() {
      setAppHeight();
      clearTimeout(roomInputRevealTimer);
      const field = document.activeElement;
      if (window.innerWidth >= 1024 || !field || !field.matches('input, textarea, select')) return;
      // Let the browser finish its native keyboard pan before doing any fallback scroll.
      roomInputRevealTimer = setTimeout(function () {
        if (document.activeElement !== field || window.innerWidth >= 1024) return;
        const page = document.querySelector('.page');
        if (!page) return;
        const bounds = page.getBoundingClientRect();
        const inputBounds = field.getBoundingClientRect();
        const viewport = window.visualViewport;
        const top = Math.max(bounds.top, viewport ? viewport.offsetTop || 0 : 0);
        const bottom = Math.min(bounds.bottom, viewport ? (viewport.offsetTop || 0) + viewport.height : window.innerHeight);
        if (bottom - top < inputBounds.bottom - inputBounds.top + 32) return;
        // Already-visible inputs must not move just to reveal the save button below them.
        if (inputBounds.top < top + 16) page.scrollTop += inputBounds.top - top - 16;
        else if (inputBounds.bottom > bottom - 16) page.scrollTop += inputBounds.bottom - bottom + 16;
      }, 180);
    }
    function goPage(page) { const separator = text(page).indexOf('?') >= 0 ? '&' : '?'; location.href = page + separator + 'v=' + (window.CMWEBS_RELEASE_VERSION || 'v2.1-p0-1'); }
    function currentReturnTo() { const url = new URL(location.href); ['code', 'state', 'liff.state', 'friendship_status_changed', 'error', 'error_description'].forEach(function (key) { url.searchParams.delete(key); }); return url.pathname.split('/').pop() + (url.searchParams.toString() ? '?' + url.searchParams.toString() : ''); }
    function loginRedirect() { const url = new URL(LANDLORD_ENTRY_URL); url.searchParams.set('return_to', currentReturnTo()); sessionStorage.setItem('cmwebs_landlord_return_to', currentReturnTo()); return url.href; }
    function initAuth() { LANDLORD_AUTH = window.CMWebsLandlordAuth.init({ apiUrl: API_URL, liffId: LIFF_ID, lineUserId: LINE_USER_ID, returnTo: currentReturnTo(), entryPage: 'landlord-entry.html', testMode: false }); return LANDLORD_AUTH; }
    async function ensureAuth() {
      const auth = LANDLORD_AUTH || initAuth();
      if (auth.getMode() === 'email') return true;
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: loginRedirect() }); return false; }
      const profile = await liff.getProfile();
      LINE_USER_ID = profile.userId || '';
      initAuth();
      return Boolean(LINE_USER_ID);
    }
    function desktopLogout() { if (window.CMWebsLandlordAuth && typeof window.CMWebsLandlordAuth.logout === 'function') { window.CMWebsLandlordAuth.logout().finally(function () { location.href = LANDLORD_ENTRY_URL; }); return; } location.href = LANDLORD_ENTRY_URL; }
    function showToast(message) { const node = document.getElementById('toast'); node.textContent = message; node.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { node.classList.remove('show'); }, 2400); }
    function roomOccupancy(room) { return room.effective_status || room.room_status || 'vacant'; }
    function statusLabel(room) { if (room.account_status === 'archived') return '已封存'; const status = roomOccupancy(room); if (status === 'upcoming') return '已出租・待起租'; if (status === 'needs_review') return '入住狀態待確認'; if (status === 'occupied') return '已出租'; if (status === 'maintenance') return '維修中'; if (status === 'unavailable') return '暫停使用'; return '空房'; }
    function statusClass(room) { if (room.account_status === 'archived') return 'archived'; return roomOccupancy(room); }
    function safeExternalUrl(value) { const url = text(value).trim(); return /^https:\/\/[^\s"'<>]+$/i.test(url) ? url : ''; }
    function publicRoomShareUrl(value) {
      // Only the supported public listing path is shareable. Never forward
      // admin URLs, arbitrary private pages, query tokens or fragments.
      const match = text(value).trim().match(/^https:\/\/([a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.z3house\.com)(\/spaces\/[a-z0-9_-]+\/?)(?:[?#][^\s"'<>\\]*)?$/i);
      return match && match[1].toLowerCase() !== 'admin.z3house.com' ? 'https://' + match[1].toLowerCase() + match[2] : '';
    }
    function updateRoomPhoto(track) {
      const gallery = track.closest('.room-photo');
      const total = track.children.length;
      const index = Math.max(0, Math.min(total - 1, Math.round(track.scrollLeft / (track.clientWidth || 1))));
      gallery.querySelector('.room-photo-counter').textContent = (index + 1) + ' / ' + total;
      gallery.querySelector('[data-photo-prev]').disabled = index === 0;
      gallery.querySelector('[data-photo-next]').disabled = index === total - 1;
    }
    function moveRoomPhoto(button, direction) {
      const track = button.closest('.room-photo').querySelector('.room-photo-track');
      const index = Math.round(track.scrollLeft / (track.clientWidth || 1));
      track.scrollTo({ left: Math.max(0, Math.min(track.children.length - 1, index + direction)) * track.clientWidth, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    async function shareRoomWebsite(button) {
      const url = publicRoomShareUrl(button.dataset.shareUrl);
      if (!url) return;
      button.disabled = true;
      const fallback = button.closest('.room-card').querySelector('.room-share-fallback');
      fallback.hidden = true;
      try {
        if (typeof navigator.share === 'function') {
          try { await navigator.share({title: '查看房源', url: url}); return; }
          catch (error) { if (error.name === 'AbortError') return; }
        }
        try { await navigator.clipboard.writeText(url); showToast('房源連結已複製'); }
        catch (_) { fallback.textContent = '請長按複製房源連結：' + url; fallback.hidden = false; }
      } finally { button.disabled = false; }
    }
    function z3houseStatusLabel(listing) { if (!listing || listing.binding_status === 'unbound') return '尚未連結 z3House'; if (listing.binding_status !== 'bound') return '連結待處理'; if (listing.publication_status === 'published') return '已公開'; if (listing.publication_status === 'hidden') return '未公開'; return '已連結'; }
    function z3houseStatusClass(listing) { if (listing && listing.publication_status === 'published') return 'published'; if (listing && listing.publication_status === 'hidden') return 'hidden'; return ''; }
    function matches(room) { const query = text(document.getElementById('roomSearch').value).trim().toLowerCase(); const haystack = [room.property_name, room.room_name, room.room_id].map(function (value) { return text(value).toLowerCase(); }).join(' '); if (query && haystack.indexOf(query) < 0) return false; if (FILTER === 'all') return true; if (FILTER === 'archived') return room.account_status === 'archived'; if (FILTER === 'active') return room.account_status === 'active'; const status = roomOccupancy(room); return room.account_status === 'active' && (status === FILTER || (FILTER === 'occupied' && status === 'upcoming')); }
    function roomCard(room) {
      const listing = room.z3house || {};
      const manualUrl = safeExternalUrl(room.room_website_url);
      const cover = room.room_website_cover || {};
      const hasPublicSite = manualUrl || (listing.binding_status === 'bound' && safeExternalUrl(listing.independent_site_url));
      const thumbnailUrl = manualUrl ? safeExternalUrl(cover.url) : (listing.binding_status === 'bound' ? safeExternalUrl(cover.url) || safeExternalUrl(listing.thumbnail_url) : '');
      const photos = Array.from(new Set((hasPublicSite && Array.isArray(cover.photos) && cover.photos.length ? cover.photos : [thumbnailUrl]).map(safeExternalUrl).filter(Boolean)));
      const photoMessage = !manualUrl ? '尚未提供照片' : (cover.status === 'unsupported' ? '此網址暫不支援自動取圖' : (cover.status === 'missing' ? '房源頁尚未提供主圖' : '封面照片暫時無法取得，請稍後重新整理'));
      const independentSiteUrl = safeExternalUrl(room.room_website_url) || (listing.binding_status === 'bound' ? safeExternalUrl(listing.independent_site_url) : '');
      const shareUrl = publicRoomShareUrl(independentSiteUrl);
      const title = (listing.binding_status === 'bound' ? text(listing.title).trim() : '') || room.room_name || '未命名房間';
      const media = photos.length
        ? (photos.length > 1 ? '<div class="room-photo-track" onscroll="updateRoomPhoto(this)" role="region" aria-label="房源照片，可左右滑動" tabindex="0">' : '') + photos.map(function (url, index) { return '<div class="room-photo-slide"><img src="' + safeHtml(url) + '" alt="' + safeHtml(title) + ' 房源照片 ' + (index + 1) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="room-photo-empty" hidden>照片暫時無法載入</div></div>'; }).join('') + (photos.length > 1 ? '</div><span class="room-photo-counter" aria-live="polite">1 / ' + photos.length + '</span><button type="button" class="room-photo-arrow" data-photo-prev aria-label="上一張照片" onclick="moveRoomPhoto(this,-1)" disabled>‹</button><button type="button" class="room-photo-arrow" data-photo-next aria-label="下一張照片" onclick="moveRoomPhoto(this,1)">›</button>' : '')
        : '<div class="room-photo-empty"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8" cy="9" r="2"></circle><path d="m3 17 5-5 4 4 4-6 5 7"></path></svg><span>' + safeHtml(photoMessage) + '</span></div>';
      const link = independentSiteUrl
        ? '<a class="z3house-link" href="' + safeHtml(independentSiteUrl) + '" target="_blank" rel="noopener noreferrer">查看房源網站 ↗</a>'
        : '';
      return '<article class="card room-card">' +
        '<div class="room-photo">' + media + '<span class="status ' + safeHtml(statusClass(room)) + '">' + safeHtml(statusLabel(room)) + '</span>' +
          (shareUrl ? '<button type="button" class="room-share" aria-label="分享房源" title="分享房源" data-share-url="' + safeHtml(shareUrl) + '" data-share-title="查看房源" onclick="shareRoomWebsite(this)"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg></button>' : '') + '</div>' +
        '<div class="room-card-body">' +
          '<h2 class="room-card-title">' + safeHtml(title) + '</h2>' +
          '<div class="room-card-meta">' + safeHtml(room.property_name || '未命名物件') + ' · ' + safeHtml(room.room_name || '未命名房間') + '</div>' +
          '<div class="room-card-rent">' + safeHtml(money(room.rent_amount)) + (Number(room.rent_amount) > 0 ? '<small>／月</small>' : '') + '</div>' +
          (shareUrl ? '<p class="room-share-fallback" hidden role="status"></p>' : '') +
          '<div class="room-card-actions">' + link + '<a class="room-admin-link" href="https://admin.z3house.com/" target="_blank" rel="noopener noreferrer">管理刊登房源 ↗</a></div>' +
          '<details class="room-management"><summary>管理</summary>' +
          '<div class="room-website-editor"><label>房源網站網址（選填）<input type="url" class="search" maxlength="2048" placeholder="https://你的房源網站" value="' + safeHtml(room.room_website_url || '') + '"></label><button type="button" class="outline-button" data-room-id="' + safeHtml(room.room_id) + '" onclick="saveRoomWebsite(this)">儲存網址</button><p class="room-note">手動網址優先；清空後儲存即可移除。只更新網址，不更動租金或租約。</p><div class="room-website-result" role="status" aria-live="polite"></div></div>' +
          '</details>' +
        '</div>' +
      '</article>';
    }
    async function saveRoomWebsite(button) {
      const editor = button.closest('.room-website-editor');
      const input = editor.querySelector('input');
      const status = editor.querySelector('.room-website-result');
      const value = input.value.trim();
      if (value) {
        try { const url = new URL(value); if (url.protocol !== 'https:' || url.username || url.password || /[\s"'<>\\]/.test(value)) throw new Error(); }
        catch (_) { status.textContent = '請填寫有效的 HTTPS 網址，不可包含帳號密碼'; return; }
      }
      button.disabled = true; input.disabled = true; status.textContent = '儲存中…';
      try {
        const auth = LANDLORD_AUTH || initAuth();
        const params = {room_id:button.dataset.roomId,room_website_url:value};
        if (auth.getMode() !== 'email') params.id_token = liff.getIDToken();
        const result = await auth.requestProtected('landlord_room_website_save', params);
        if (!result || result.success !== true) throw new Error(result && result.message || '儲存失敗');
        const room = (PAGE_DATA.rooms || []).find(item => item.room_id === button.dataset.roomId);
        if (room) { room.room_website_url = result.data.room_website_url; room.room_website_cover = result.data.room_website_cover || {url:'',status:'unavailable'}; }
        const card = button.closest('.room-card');
        if (room) card.outerHTML = roomCard(room);
        showToast(result.message || '房源網址已儲存');
      } catch (error) {
        status.textContent = (error.message || '儲存失敗') + '。若發生逾時，請重新整理核對；系統不會自動重送。';
      } finally { button.disabled = false; input.disabled = false; }
    }
    function render() { const rooms = (PAGE_DATA.rooms || []).filter(matches); const count = rooms.length; document.getElementById('roomCountPill').textContent = '目前顯示 ' + count + ' 間'; const app = document.getElementById('app'); if (!count) { app.innerHTML = '<section class="card empty"><div class="empty-title">沒有符合條件的房間</div>請調整搜尋或篩選條件。</section>'; return; } app.innerHTML = '<div class="section-heading"><h2>房間清單</h2><span>共 ' + count + ' 間</span></div><section class="room-grid">' + rooms.map(roomCard).join('') + '</section>'; }
    function renderError(error) { document.getElementById('app').innerHTML = '<section class="card error"><div class="error-title">房間資料載入失敗</div>' + safeHtml(error && error.message ? error.message : '請稍後再試') + '<br><button class="retry-button" type="button" onclick="loadPage(false)">重新整理</button></section>'; }
    async function loadPage(showLoading) { if (showLoading !== false) document.getElementById('app').innerHTML = '<section class="card loading"><div class="loading-title">房間資料載入中</div>正在讀取目前 Workspace 的全部房間。</section>'; try { const ready = await ensureAuth(); if (!ready) return; const result = await window.CMWebsLandlordApi.request({ apiUrl: API_URL, action: 'landlord_room_center_init', params: { include_archived: '1' }, lineUserId: LINE_USER_ID, testMode: false, rejectOnFailure: true }); PAGE_DATA = result.data || {}; const workspace = PAGE_DATA.workspace || {}; document.getElementById('workspaceHeading').textContent = workspace.workspace_name ? workspace.workspace_name + '・房間清單' : '房間清單'; document.getElementById('desktopWorkspaceName').textContent = workspace.workspace_name || '目前 Workspace'; document.getElementById('desktopTopbarWorkspaceName').textContent = workspace.workspace_name || '目前 Workspace'; render(); } catch (error) { renderError(error); } }
    document.querySelectorAll('[data-filter]').forEach(function (button) { button.addEventListener('click', function () { FILTER = button.dataset.filter || 'all'; document.querySelectorAll('[data-filter]').forEach(function (item) { item.classList.toggle('active', item === button); }); render(); }); });
    document.getElementById('roomSearch').addEventListener('input', render);
    document.addEventListener('focusin', setAppHeight);
    document.addEventListener('focusout', function () { requestAnimationFrame(setAppHeight); });
    setAppHeight(); window.addEventListener('resize', scheduleRoomInputReveal);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleRoomInputReveal);
      window.visualViewport.addEventListener('scroll', scheduleRoomInputReveal);
    }
    loadPage(true);
  </script>
