<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CMWebs 付款回報審核</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --app-height: 100vh;
      --ink: #152238;
      --muted: #6b778c;
      --line: #e5eaf1;
      --brand: #1f6feb;
      --danger: #c83c4a;
      --warning: #a66400;
      --success: #19734c;
      --surface: #ffffff;
      --canvas: #f4f7fb;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app-shell { position: relative; height: var(--app-height); overflow: hidden; }
    .page { height: 100%; overflow-y: auto; padding: 20px 16px calc(92px + env(safe-area-inset-bottom)); }
    .header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
    .eyebrow { margin: 0 0 4px; color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .06em; }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .refresh { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 9px 11px; font: inherit; }
    .card { margin-bottom: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 2px 8px rgba(24, 39, 75, .04); }
    .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: hidden; }
    .metric { min-height: 86px; padding: 15px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .metric:nth-child(2n) { border-right: 0; }
    .metric:nth-last-child(-n + 2) { border-bottom: 0; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 7px; font-size: 24px; font-weight: 800; }
    .metric-value.warning { color: var(--warning); }
    .section-title { margin: 22px 2px 10px; font-size: 16px; font-weight: 800; }
    .report { padding: 16px; }
    .report + .report { border-top: 1px solid var(--line); }
    .report-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .report-name { font-size: 16px; font-weight: 800; }
    .report-meta { margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .badge { display: inline-flex; border-radius: 999px; padding: 5px 8px; font-size: 12px; font-weight: 800; white-space: nowrap; background: #edf2fa; color: #42516b; }
    .badge.pending { background: #fff3d4; color: var(--warning); }
    .badge.confirmed { background: #dcf5e8; color: var(--success); }
    .badge.rejected, .badge.voided { background: #fde8eb; color: var(--danger); }
    .amount { margin: 14px 0 0; font-size: 21px; font-weight: 800; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 13px; }
    .detail { border-radius: 10px; background: #f7f9fc; padding: 9px; }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 3px; font-size: 13px; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .button { border: 0; border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 800; cursor: pointer; }
    .button.primary { background: var(--brand); color: #fff; }
    .button.danger { background: #fff1f3; color: var(--danger); }
    .button:disabled { cursor: not-allowed; opacity: .55; }
    .empty, .state { padding: 28px 20px; text-align: center; }
    .state-title { font-size: 17px; font-weight: 800; }
    .state-text { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .bottom-nav { position: absolute; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(4, 1fr); min-height: 64px; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--line); background: rgba(255,255,255,.98); }
    .nav-button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; }
    .nav-button.active { color: var(--brand); }
    .modal-backdrop { position: fixed; z-index: 10; inset: 0; display: flex; align-items: flex-end; background: rgba(15, 24, 40, .42); }
    .modal { width: 100%; border-radius: 20px 20px 0 0; background: #fff; padding: 20px 16px calc(18px + env(safe-area-inset-bottom)); }
    .modal h2 { margin: 0; font-size: 19px; }
    .modal p { color: var(--muted); line-height: 1.55; }
    textarea { width: 100%; min-height: 86px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .button.secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); }
    .toast { position: fixed; z-index: 20; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom)); left: 16px; display: none; border-radius: 10px; padding: 12px; background: #26354f; color: #fff; text-align: center; font-size: 14px; }
    .toast.show { display: block; }
    .toast.error { background: var(--danger); }
  </style>
</head>
<body>
  <div class="app-shell">
    <main id="app" class="page" aria-live="polite">
      <section class="card state">
        <div class="state-title">正在載入付款回報</div>
        <div class="state-text">正在確認目前房東工作區與付款審核權限。</div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="房東導覽">
      <button class="nav-button" type="button" onclick="goPage('landlord-home.html')">首頁</button>
      <button class="nav-button" type="button" onclick="goPage('landlord-arrears.html')">欠款</button>
      <button class="nav-button" type="button" onclick="goPage('landlord-tenants.html')">房客</button>
      <button class="nav-button active" type="button" onclick="goPage('landlord-more.html')">更多</button>
    </nav>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbyrwKb3adOgHVBwbwHwLeSsDoUgYhaUaFXui66tnyMNBrT9eOVbi788oHeVRTif_LA9BA/exec';
    const LIFF_ID = '2010314940-EjX1qbb8';
    let LINE_USER_ID = '';
    let PAGE_DATA = null;
    let toastTimer = null;

    function setAppHeight() {
      const height = window.visualViewport && window.visualViewport.height
        ? window.visualViewport.height
        : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', Math.round(height) + 'px');
    }

    function rawText(value) {
      return value === undefined || value === null ? '' : String(value);
    }

    function safeHtml(value) {
      return rawText(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function money(value) {
      return 'NT$ ' + Math.round(Number(value || 0)).toLocaleString('zh-TW');
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? (rawText(value) || '-')
        : new Intl.DateTimeFormat('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
    }

    function statusLabel(status) {
      return ({ pending: '待審核', payment_reported: '已回報', confirmed: '已確認', rejected: '已駁回', voided: '已撤銷', void: '已撤銷' })[rawText(status).toLowerCase()] || rawText(status) || '-';
    }

    function isPending(report) {
      return ['pending', 'payment_reported'].indexOf(rawText(report.status).toLowerCase()) >= 0;
    }

    function showToast(message, isError) {
      const toast = document.getElementById('toast');
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = isError ? 'toast error show' : 'toast show';
      toastTimer = setTimeout(function () { toast.className = 'toast'; }, 3000);
    }

    function goPage(page) {
      location.replace(page + '?v=' + Date.now());
    }

    function buildLandlordEntryUrl() {
      const current = new URL(location.href);
      ['code', 'state', 'liff.state', 'friendship_status_changed', 'error', 'error_description'].forEach(function (key) {
        current.searchParams.delete(key);
      });
      const returnTo = current.pathname.split('/').pop() + (current.searchParams.toString() ? '?' + current.searchParams.toString() : '');
      const entry = new URL('landlord-entry.html', location.href);
      entry.searchParams.set('return_to', returnTo);
      return entry.href;
    }

    async function initLine() {
      if (typeof liff === 'undefined') {
        throw new Error('LIFF SDK 載入失敗');
      }
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        // This review page is a sibling of the registered LIFF endpoint.
        // The gateway owns LINE Login, so this page never supplies itself as redirectUri.
        location.replace(buildLandlordEntryUrl());
        return false;
      }
      const profile = await liff.getProfile();
      LINE_USER_ID = profile.userId || '';
      if (!LINE_USER_ID) {
        throw new Error('無法取得房東 LINE User ID');
      }
      return true;
    }

    function jsonpRequest(action, params) {
      return new Promise(function (resolve, reject) {
        const callbackName = '__cmwebs_payment_review_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        let finished = false;
        const timer = setTimeout(function () {
          if (!finished) {
            finished = true;
            cleanup();
            reject(new Error('API 載入逾時'));
          }
        }, 30000);
        function cleanup() {
          clearTimeout(timer);
          if (script.parentNode) script.parentNode.removeChild(script);
          try { delete window[callbackName]; } catch (error) { window[callbackName] = undefined; }
        }
        window[callbackName] = function (result) {
          if (!finished) {
            finished = true;
            cleanup();
            resolve(result);
          }
        };
        let url = API_URL + '?v2_action=' + encodeURIComponent(action) + '&line_user_id=' + encodeURIComponent(LINE_USER_ID) + '&callback=' + encodeURIComponent(callbackName) + '&_=' + Date.now();
        Object.keys(params || {}).forEach(function (key) {
          if (params[key] !== undefined && params[key] !== null) url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
        });
        script.charset = 'UTF-8';
        script.onerror = function () {
          if (!finished) {
            finished = true;
            cleanup();
            reject(new Error('付款回報服務暫時無法使用'));
          }
        };
        script.src = url;
        document.body.appendChild(script);
      });
    }

    function renderError(message) {
      document.getElementById('app').innerHTML = '<section class="card state"><div class="state-title">付款回報載入失敗</div><div class="state-text">' + safeHtml(message) + '</div><button class="button secondary" type="button" onclick="loadPage()">重新整理</button></section>';
    }

    function reportCard(report, canApprove) {
      const pending = isPending(report);
      const status = rawText(report.status).toLowerCase();
      return '<article class="report">' +
        '<div class="report-top"><div><div class="report-name">' + safeHtml(report.tenant_name || '未命名房客') + '</div><div class="report-meta">房間 ' + safeHtml(report.room_name || '-') + ' ・ 帳單 ' + safeHtml(report.bill_month || '-') + '</div></div><span class="badge ' + safeHtml(status) + '">' + safeHtml(statusLabel(status)) + '</span></div>' +
        '<div class="amount">' + money(report.reported_amount) + '</div>' +
        '<div class="detail-grid"><div class="detail"><div class="detail-label">匯款日期</div><div class="detail-value">' + safeHtml(formatDate(report.reported_paid_date)) + '</div></div><div class="detail"><div class="detail-label">帳號後五碼</div><div class="detail-value">' + safeHtml(report.reported_last5 || '-') + '</div></div><div class="detail"><div class="detail-label">帳單金額</div><div class="detail-value">' + money(report.bill_total_amount) + '</div></div><div class="detail"><div class="detail-label">回報時間</div><div class="detail-value">' + safeHtml(formatDate(report.created_at)) + '</div></div></div>' +
        (report.note ? '<div class="report-meta">房客備註：' + safeHtml(report.note) + '</div>' : '') +
        (pending && canApprove ? '<div class="actions"><button class="button primary" type="button" onclick="openDecision(\'' + safeHtml(report.report_id) + '\', \'confirmed\')">確認並銷帳</button><button class="button danger" type="button" onclick="openDecision(\'' + safeHtml(report.report_id) + '\', \'rejected\')">駁回</button></div>' : '') +
      '</article>';
    }

    function renderPage() {
      const data = PAGE_DATA || {};
      const summary = data.summary || {};
      const reports = Array.isArray(data.reports) ? data.reports : [];
      const canApprove = Boolean(data.permissions && data.permissions.can_approve_payment);
      const pending = reports.filter(isPending);
      const historical = reports.filter(function (report) { return !isPending(report); });
      document.getElementById('app').innerHTML =
        '<header class="header"><div><div class="eyebrow">LANDLORD WORKSPACE</div><h1>付款回報審核</h1><p class="subtitle">只顯示目前已授權工作區的付款回報。</p></div><button class="refresh" type="button" onclick="loadPage()">重新整理</button></header>' +
        '<section class="card summary"><div class="metric"><div class="metric-label">待審核</div><div class="metric-value warning">' + Number(summary.pending || 0) + '</div></div><div class="metric"><div class="metric-label">全部回報</div><div class="metric-value">' + Number(summary.total || 0) + '</div></div><div class="metric"><div class="metric-label">已確認</div><div class="metric-value">' + Number(summary.confirmed || 0) + '</div></div><div class="metric"><div class="metric-label">已駁回／撤銷</div><div class="metric-value">' + (Number(summary.rejected || 0) + Number(summary.voided || 0)) + '</div></div></section>' +
        '<div class="section-title">待處理</div>' +
        (pending.length ? '<section class="card">' + pending.map(function (report) { return reportCard(report, canApprove); }).join('') + '</section>' : '<section class="card empty"><div class="state-title">目前沒有待審核付款回報</div><div class="state-text">新的付款回報會顯示在這裡。</div></section>') +
        '<div class="section-title">歷史紀錄</div>' +
        (historical.length ? '<section class="card">' + historical.map(function (report) { return reportCard(report, false); }).join('') + '</section>' : '<section class="card empty"><div class="state-text">尚無歷史付款回報。</div></section>') +
        (!canApprove ? '<div class="subtitle">目前角色僅可檢視付款回報，沒有付款確認或銷帳權限。</div>' : '');
    }

    function openDecision(reportId, decision) {
      const report = (PAGE_DATA.reports || []).find(function (item) { return item.report_id === reportId; });
      if (!report || !isPending(report)) {
        showToast('此付款回報目前不能處理。', true);
        return;
      }
      const isReject = decision === 'rejected';
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.innerHTML = '<section class="modal"><h2>' + (isReject ? '駁回付款回報' : '確認付款並銷帳') + '</h2><p>' + (isReject ? '請填寫駁回原因；送出後將由既有後端服務處理。' : '請確認匯款資料無誤。送出後將由既有正式銷帳服務處理。') + '</p><textarea id="decisionNote" maxlength="300" placeholder="' + (isReject ? '駁回原因（必填）' : '房東備註（選填）') + '"></textarea><div class="modal-actions"><button class="button secondary" type="button">取消</button><button class="button ' + (isReject ? 'danger' : 'primary') + '" type="button">送出處理</button></div></section>';
      const buttons = modal.querySelectorAll('button');
      buttons[0].onclick = function () { modal.remove(); };
      buttons[1].onclick = function () { submitDecision(reportId, decision, modal); };
      document.body.appendChild(modal);
    }

    async function submitDecision(reportId, decision, modal) {
      const note = rawText(modal.querySelector('#decisionNote').value).trim();
      if (decision === 'rejected' && !note) {
        showToast('請填寫駁回原因。', true);
        return;
      }
      const submit = modal.querySelectorAll('button')[1];
      submit.disabled = true;
      try {
        const result = await jsonpRequest('landlord_payment_report_update', {
          report_id: reportId,
          decision: decision,
          reject_reason: decision === 'rejected' ? note : '',
          landlord_note: decision === 'confirmed' ? note : ''
        });
        if (!result || result.success !== true) throw new Error(result && result.message ? result.message : '付款回報處理失敗');
        modal.remove();
        showToast(result.message || '付款回報已處理。');
        loadPage();
      } catch (error) {
        submit.disabled = false;
        showToast(error.message || '付款回報處理失敗。', true);
      }
    }

    async function loadPage() {
      try {
        const ready = await initLine();
        if (!ready) return;
        const result = await jsonpRequest('landlord_payment_reports_init');
        if (!result || result.success !== true) throw new Error(result && result.message ? result.message : '付款回報資料載入失敗');
        PAGE_DATA = result.data || {};
        renderPage();
      } catch (error) {
        renderError(error.message || String(error));
      }
    }

    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
    loadPage();
  </script>
</body>
</html>
