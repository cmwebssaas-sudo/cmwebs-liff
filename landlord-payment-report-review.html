<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CMWebs 付款回報審核</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="frontend-release.js?v=20261010-receipt-existing-payment-v1"></script>
  <script src="landlord-auth.js?v=20261010-receipt-existing-payment-v1"></script>
  <style>
    :root {
      --app-height: 100vh;
      --ink: #152238;
      --muted: #6b778c;
      --line: #e5eaf1;
      --brand: #1f6feb;
      --danger: #c83c4a;
      --warning: #a66400;
      --success: #19734c;
      --surface: #ffffff;
      --canvas: #f4f7fb;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app-shell { position: relative; width: 100%; max-width: 560px; height: var(--app-height); margin: 0 auto; overflow: hidden; background: var(--canvas); }
    .page { height: 100%; overflow-y: auto; padding: 18px 16px calc(64px + 28px + env(safe-area-inset-bottom)); }
    .header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
    .eyebrow { margin: 0 0 4px; color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .06em; }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .refresh { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 9px 11px; font: inherit; }
    .card { margin-bottom: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 2px 8px rgba(24, 39, 75, .04); }
    .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: hidden; }
    .metric { min-height: 86px; padding: 15px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .metric:nth-child(2n) { border-right: 0; }
    .metric:nth-last-child(-n + 2) { border-bottom: 0; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 7px; font-size: 24px; font-weight: 800; }
    .metric-value.warning { color: var(--warning); }
    .section-title { margin: 22px 2px 10px; font-size: 16px; font-weight: 800; }
    .report { padding: 16px; }
    .report + .report { border-top: 1px solid var(--line); }
    .report-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .report-name { font-size: 16px; font-weight: 800; }
    .report-meta { margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .badge { display: inline-flex; border-radius: 999px; padding: 5px 8px; font-size: 12px; font-weight: 800; white-space: nowrap; background: #edf2fa; color: #42516b; }
    .badge.pending { background: #fff3d4; color: var(--warning); }
    .badge.confirmed { background: #dcf5e8; color: var(--success); }
    .badge.rejected, .badge.voided { background: #fde8eb; color: var(--danger); }
    .amount { margin: 14px 0 0; font-size: 21px; font-weight: 800; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 13px; }
    .detail { border-radius: 10px; background: #f7f9fc; padding: 9px; }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 3px; font-size: 13px; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .button { border: 0; border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 800; cursor: pointer; }
    .button.primary { background: var(--brand); color: #fff; }
    .button.danger { background: #fff1f3; color: var(--danger); }
    .button:disabled { cursor: not-allowed; opacity: .55; }
    .empty, .state { padding: 28px 20px; text-align: center; }
    .state-title { font-size: 17px; font-weight: 800; }
    .state-text { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .bottom-nav { position: absolute; z-index: 1000; right: 0; bottom: 0; left: 0; border-top: 1px solid #e8ecf1; background: rgba(255, 255, 255, .98); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(12px); }
    .bottom-nav-inner { height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); }
    .nav-item { position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 5px; border: 0; background: transparent; color: #8b919a; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; }
    .nav-item svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: #06c755; font-weight: 900; }
    .nav-item.active::after { position: absolute; bottom: 5px; width: 18px; height: 3px; border-radius: 999px; background: #06c755; content: ''; }
    .nav-item:active { opacity: .65; }
    .modal-backdrop { position: fixed; z-index: 2000; inset: 0; display: flex; align-items: flex-end; background: rgba(15, 24, 40, .42); }
    .modal { width: 100%; border-radius: 20px 20px 0 0; background: #fff; padding: 20px 16px calc(18px + env(safe-area-inset-bottom)); }
    .modal h2 { margin: 0; font-size: 19px; }
    .modal p { color: var(--muted); line-height: 1.55; }
    textarea { width: 100%; min-height: 86px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .button.secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); }
    .toast { position: absolute; z-index: 3000; right: 18px; bottom: calc(64px + 22px + env(safe-area-inset-bottom)); left: 18px; display: none; border-radius: 13px; padding: 13px 15px; background: rgba(25, 28, 33, .94); color: #fff; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.5; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); }
    .toast.show { display: block; }
    .toast.error { background: var(--danger); }
    .bank-select { width:100%; margin:12px 0 0; min-height:44px; padding:8px; border:1px solid var(--line); border-radius:10px; background:white; font:inherit; font-size:16px; }
    .bank-receipt .actions { flex-wrap:wrap; }
    .bank-receipt .button { min-height:44px; }
    .bank-receipt details { margin-top:12px; }
    .bank-receipt summary { cursor:pointer; min-height:44px; padding-top:12px; color:var(--brand); }
  </style>
</head>
<body>
  <div class="app-shell">
    <main id="app" class="page" aria-live="polite">
      <section class="card state">
        <div class="state-title">正在載入付款回報</div>
        <div class="state-text">正在確認目前房東工作區與付款審核權限。</div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="房東導覽">
      <div class="bottom-nav-inner">
        <button class="nav-item" type="button" onclick="goPage('landlord-home.html')">
          <svg viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5"></path><path d="M6.5 10.5V19h11v-8.5"></path><path d="M9.5 19v-5h5v5"></path></svg>
          <span>首頁</span>
        </button>
        <button class="nav-item" type="button" onclick="goPage('landlord-arrears.html')">
          <svg viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="15" rx="2"></rect><path d="M8.5 9h7"></path><path d="M8.5 13h7"></path><path d="M8.5 17h4"></path></svg>
          <span>欠款</span>
        </button>
        <button class="nav-item" type="button" onclick="goPage('landlord-tenants.html')">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M4 19c.5-3.2 2.2-5 5-5s4.5 1.8 5 5"></path><path d="M15.5 7.5a2.5 2.5 0 0 1 0 5"></path><path d="M16 14c2.2.4 3.5 2 4 5"></path></svg>
          <span>房客</span>
        </button>
        <button class="nav-item" type="button" onclick="goPage('landlord-rooms.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 7h1m4 0h1M9 11h1m4 0h1M10 21v-6h4v6"></path></svg><span>房源</span></button>
        <button class="nav-item active" type="button" onclick="goPage('landlord-more.html')">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></svg>
          <span>更多</span>
        </button>
      </div>
    </nav>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbwnnuIFZ22eO6MxMnWOYHovgMT2xuTbcIgzbq4qmxXE3gjGoTJFcBGXlsNDS-lqr3EILQ/exec';
    const LIFF_ID = '2010314940-EjX1qbb8';
    let LINE_USER_ID = '';
    let PAGE_DATA = null;
    let BANK_RECEIPT_DATA = null;
    let BANK_RECEIPT_ERROR = '';
    let BANK_RECEIPT_BUSY = false;
    let BANK_RECEIPT_UNCERTAIN = '';
    let PAYMENT_REPORT_BUSY = false;
    let PAYMENT_REPORT_UNCERTAIN = '';
    let REVIEW_AUTH = null;
    let toastTimer = null;

    function setAppHeight() {
      const height = window.visualViewport && window.visualViewport.height
        ? window.visualViewport.height
        : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', Math.round(height) + 'px');
    }

    function rawText(value) {
      return value === undefined || value === null ? '' : String(value);
    }

    function safeHtml(value) {
      return rawText(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function money(value) {
      return 'NT$ ' + Math.round(Number(value || 0)).toLocaleString('zh-TW');
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? (rawText(value) || '-')
        : new Intl.DateTimeFormat('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
    }

    function statusLabel(status) {
      return ({ pending: '待審核', payment_reported: '已回報', confirmed: '已確認', rejected: '已駁回', voided: '已撤銷', void: '已撤銷' })[rawText(status).toLowerCase()] || rawText(status) || '-';
    }

    function isPending(report) {
      return ['pending', 'payment_reported'].indexOf(rawText(report.status).toLowerCase()) >= 0;
    }

    function buildReviewSummary(data) {
      const reports = data && Array.isArray(data.reports)
        ? data.reports
        : null;
      if (!reports) return data && data.summary ? data.summary : {};

      return reports.reduce(function (summary, report) {
        const status = rawText(report && report.status).toLowerCase();
        summary.total += 1;
        if (status === 'pending' || status === 'payment_reported') {
          summary.pending += 1;
        } else if (status === 'confirmed') {
          summary.confirmed += 1;
        } else if (status === 'rejected') {
          summary.rejected += 1;
        } else if (status === 'voided' || status === 'void') {
          summary.voided += 1;
        }
        return summary;
      }, { total: 0, pending: 0, confirmed: 0, rejected: 0, voided: 0 });
    }

    function showToast(message, isError) {
      const toast = document.getElementById('toast');
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = isError ? 'toast error show' : 'toast show';
      toastTimer = setTimeout(function () { toast.className = 'toast'; }, 3000);
    }

    function goPage(page) {
      location.replace(page + '?v=' + (window.CMWEBS_RELEASE_VERSION || 'v2.1-p0-1'));
    }

    function buildLandlordEntryUrl() {
      const current = new URL(location.href);
      ['code', 'state', 'liff.state', 'friendship_status_changed', 'error', 'error_description'].forEach(function (key) {
        current.searchParams.delete(key);
      });
      const returnTo = current.pathname.split('/').pop() + (current.searchParams.toString() ? '?' + current.searchParams.toString() : '');
      const entry = new URL('landlord-entry.html', location.href);
      entry.searchParams.set('return_to', returnTo);
      return entry.href;
    }

    async function initLine() {
      REVIEW_AUTH = window.CMWebsLandlordAuth.init({apiUrl:API_URL,liffId:LIFF_ID});
      if (REVIEW_AUTH.getMode() === 'email') return true;
      if (typeof liff === 'undefined') {
        throw new Error('LIFF SDK 載入失敗');
      }
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        // This review page is a sibling of the registered LIFF endpoint.
        // The gateway owns LINE Login, so this page never supplies itself as redirectUri.
        location.replace(buildLandlordEntryUrl());
        return false;
      }
      let profile;
      try {
        profile = await liff.getProfile();
      } catch (error) {
        if (!/access token.*(expired|invalid)|invalid.*access token/i.test(String(error && error.message || error || ''))) throw error;
        renderReviewLoginExpired();
        return false;
      }
      LINE_USER_ID = profile.userId || '';
      REVIEW_AUTH.init({lineUserId:LINE_USER_ID});
      if (!LINE_USER_ID) {
        throw new Error('無法取得房東 LINE User ID');
      }
      return true;
    }

    let reviewReloginInFlight = false;

    function renderReviewLoginExpired() {
      LINE_USER_ID = '';
      PAGE_DATA = null;
      BANK_RECEIPT_DATA = null;
      document.getElementById('app').innerHTML = '<section class="card state" role="status"><div class="state-title">LINE 登入已過期</div><p class="state-text">請重新登入後確認入帳，原本的入帳紀錄會保留。</p><button id="reviewReloginBtn" class="button primary" type="button" onclick="restartReviewLineLogin()">重新登入 LINE</button><p class="state-text">若未跳轉，請關閉此頁，再從原本的通知連結開啟。</p></section>';
    }

    async function restartReviewLineLogin() {
      if (reviewReloginInFlight) return;
      reviewReloginInFlight = true;
      const button = document.getElementById('reviewReloginBtn');
      if (button) button.disabled = true;
      try {
        const gateway = new URL(buildLandlordEntryUrl());
        if (liff.isInClient()) {
          const entry = new URL('https://liff.line.me/' + LIFF_ID);
          entry.searchParams.set('return_to', gateway.searchParams.get('return_to'));
          location.replace(entry.href);
        } else {
          liff.logout();
          location.replace(gateway.href);
        }
      } catch (error) {
        reviewReloginInFlight = false;
        renderReviewLoginExpired();
      }
    }

    function jsonpRequest(action, params, timeoutMs) {
      if (REVIEW_AUTH && REVIEW_AUTH.getMode() === 'email') {
        return REVIEW_AUTH.request(action,params||{},{timeoutMs:timeoutMs||30000});
      }
      return new Promise(function (resolve, reject) {
        const callbackName = '__cmwebs_payment_review_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        const requestTimeoutMs = Number(timeoutMs) > 0 ? Number(timeoutMs) : 30000;
        let finished = false;
        const timer = setTimeout(function () {
          if (!finished) {
            finished = true;
            cleanup();
            const error = new Error('API 載入逾時');
            error.code = 'API_TIMEOUT';
            reject(error);
          }
        }, requestTimeoutMs);
        function cleanup() {
          clearTimeout(timer);
          if (script.parentNode) script.parentNode.removeChild(script);
          try { delete window[callbackName]; } catch (error) { window[callbackName] = undefined; }
        }
        window[callbackName] = function (result) {
          if (!finished) {
            finished = true;
            cleanup();
            resolve(result);
          }
        };
        let url = API_URL + '?v2_action=' + encodeURIComponent(action) + '&line_user_id=' + encodeURIComponent(LINE_USER_ID) + '&callback=' + encodeURIComponent(callbackName) + '&_=' + Date.now();
        Object.keys(params || {}).forEach(function (key) {
          if (params[key] !== undefined && params[key] !== null) url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
        });
        script.charset = 'UTF-8';
        script.onerror = function () {
          if (!finished) {
            finished = true;
            cleanup();
            reject(new Error('付款回報服務暫時無法使用'));
          }
        };
        script.src = url;
        document.body.appendChild(script);
      });
    }

    function findConfirmedPaymentReport(data, reportId) {
      const reports = data && Array.isArray(data.reports) ? data.reports : [];
      const targetId = rawText(reportId).trim();
      const report = reports.find(function (item) {
        return rawText(item && item.report_id).trim() === targetId;
      });
      if (!report) return null;
      return rawText(report.status).toLowerCase() === 'confirmed' ? report : null;
    }

    function waitForPaymentReportRecoveryDelay() {
      return new Promise(function (resolve) { setTimeout(resolve, 5000); });
    }

    async function recoverTimedOutPaymentReport(reportId) {
      for (let attempt = 0; attempt < 3; attempt += 1) {
        try {
          const result = await jsonpRequest('landlord_payment_reports_init', {}, 60000);
          if (result && result.success === true) {
            const report = findConfirmedPaymentReport(result.data || {}, reportId);
            if (report) return report;
          }
        } catch (error) {
          // The write response is already uncertain; keep checking authoritative state.
        }
        if (attempt < 2) await waitForPaymentReportRecoveryDelay();
      }
      return null;
    }

    function renderError(message) {
      document.getElementById('app').innerHTML = bankReceiptPanel() + '<section class="card state"><div class="state-title">付款回報載入失敗</div><div class="state-text">' + safeHtml(message) + '</div><button class="button secondary" type="button" onclick="loadPage()">重新整理</button></section>';
    }

    function bankReceiptPanel() {
      if (BANK_RECEIPT_ERROR) return '<section class="card state"><div class="state-title">入帳通知暫時無法載入</div><p class="state-text">'+safeHtml(BANK_RECEIPT_ERROR)+'</p><button class="button secondary" onclick="loadPage()">重新整理</button></section>';
      const data = BANK_RECEIPT_DATA;
      if (!data || !Array.isArray(data.receipts) || !data.receipts.length) return '';
      const bills = Array.isArray(data.bills) ? data.bills : [];
      const canApprove = data.can_approve_payment === true;
      const label = function(bill) {return (bill.room_name||'房間')+'／'+rawText(bill.bill_month).slice(0,7)+'／'+money(bill.total_amount);};
      return '<div class="section-title">銀行入帳通知</div><section class="card">'+data.receipts.map(function(receipt) {
        const pending = receipt.status === 'pending' || receipt.status === 'unmatched';
        const matched = bills.find(function(bill){return bill.bill_id===receipt.match_bill_id && Number(bill.total_amount)===Number(receipt.amount);});
        const title = pending ? (matched ? '收到入帳，待確認銷帳' : '收到入帳，但無法配對') : (receipt.status==='settled'?'已銷帳':receipt.status==='paid_bill_review'?'原帳單已銷帳，入帳待核對':'其他款項');
        const eligible = bills.filter(function(bill){return Number(bill.total_amount)===Number(receipt.amount);});
        const options = '<option value="">請選擇帳單</option>'+eligible.map(function(bill){return '<option value="'+safeHtml(bill.bill_id)+'"'+(matched&&matched.bill_id===bill.bill_id?' selected':'')+'>'+safeHtml(label(bill))+'</option>';}).join('');
        const selector = '<select class="bank-select" aria-label="選擇對應帳單">'+options+'</select><div class="actions"><button class="button primary" onclick="submitBankReceipt(this,\''+safeHtml(receipt.receipt_id)+'\',\'choose\')">選擇帳單並確認銷帳</button><button class="button secondary" onclick="submitBankReceipt(this,\''+safeHtml(receipt.receipt_id)+'\',\'other\')">其他款項</button></div>';
        let controls = receipt.status==='paid_bill_review'?'<div class="report-meta">請核對原付款紀錄；此通知不再提供重複銷帳。</div>':'';
        if (pending && canApprove) controls = matched ? '<div class="actions"><button class="button primary" onclick="submitBankReceipt(this,\''+safeHtml(receipt.receipt_id)+'\',\'confirm\')">確認銷帳</button></div><details><summary>配對有誤</summary>'+selector+'</details>' : selector;
        return '<article class="report bank-receipt" data-receipt-id="'+safeHtml(receipt.receipt_id)+'"><div class="report-name">'+safeHtml(title)+'</div><div class="amount">'+money(receipt.amount)+'</div><div class="report-meta">'+safeHtml(receipt.payer_bank||'未提供銀行')+'／末五碼 '+safeHtml(receipt.payer_last5||'未提供')+'<br>入帳時間：'+safeHtml(rawText(receipt.payment_at).replace('T',' ').replace('+08:00',''))+'</div>'+(matched?'<div class="report-meta">配對帳單：'+safeHtml(label(matched))+'</div>':'')+(receipt.source_kind==='forwarded'?'<div class="report-meta">來源：轉寄通知，請核對收款紀錄。</div>':'')+controls+'</article>';
      }).join('')+'</section>';
    }

    async function bankReceiptRequest(action,input) {
      const params = {input_json:JSON.stringify(input||{})};
      if (REVIEW_AUTH.getMode() !== 'email') {
        params.id_token = liff.getIDToken();
        if (!params.id_token) throw new Error('登入憑證已過期，請從房東入口重新登入。');
      }
      return REVIEW_AUTH.requestProtected(action,params,{timeoutMs:action==='landlord_bank_receipt_confirm'?240000:60000});
    }

    async function loadBankReceipts() {
      const result = await bankReceiptRequest('landlord_bank_receipts_init',{});
      if (!result || result.success !== true) throw new Error(result&&result.message||'入帳通知載入失敗');
      BANK_RECEIPT_DATA = result.data || {};
      BANK_RECEIPT_ERROR = '';
      // A successful read allows an explicit retry using the same receipt ID.
      // Never automatically resend the confirmation.
      if (BANK_RECEIPT_UNCERTAIN && (BANK_RECEIPT_DATA.receipts||[]).some(function(r){return r.receipt_id===BANK_RECEIPT_UNCERTAIN && ['settled','other'].indexOf(r.status)>=0;})) BANK_RECEIPT_UNCERTAIN = '';
      return BANK_RECEIPT_DATA;
    }

    async function submitBankReceipt(button,receiptId,decision) {
      if (PAYMENT_REPORT_BUSY || PAYMENT_REPORT_UNCERTAIN) {showToast('上一筆付款結果尚未確認，請先重新整理核對。',true);return;}
      if (BANK_RECEIPT_BUSY) {showToast('目前正在處理另一筆入帳，請稍候。',true);return;}
      if (BANK_RECEIPT_UNCERTAIN) {showToast('上一筆銷帳結果尚未確認，請先重新整理核對。',true);return;}
      const receipt = (BANK_RECEIPT_DATA.receipts||[]).find(function(r){return r.receipt_id===receiptId;});
      if (!receipt || ['pending','unmatched'].indexOf(receipt.status)<0) return;
      const card = button.closest('.bank-receipt');
      const billId = decision==='confirm' ? receipt.match_bill_id : card.querySelector('.bank-select').value;
      if (decision!=='other'&&!billId) {showToast('請先選擇帳單。',true);return;}
      BANK_RECEIPT_BUSY = true;
      const originalLabel = button.textContent;
      button.textContent = '處理中…';
      card.setAttribute('aria-busy','true');
      card.querySelectorAll('button').forEach(function(b){b.disabled=true;});
      try {
        const result = await bankReceiptRequest('landlord_bank_receipt_confirm',{receipt_id:receiptId,bill_id:billId,decision:decision==='other'?'other':'confirm'});
        const outcome = result && result.data;
        if (!result || result.success!==true || !outcome || (outcome.status==='settled'&&outcome.receipt_id!==receiptId) || ['settled','other'].indexOf(outcome.status)<0) {
          BANK_RECEIPT_UNCERTAIN=receiptId;
          throw new Error(result&&result.message||'入帳通知處理結果尚未確認');
        }
        // The verified write response already confirms this receipt. A later
        // list-refresh failure must never turn that success into uncertainty.
        receipt.status = outcome.status;
        receipt.payment_id = outcome.payment_id || receipt.payment_id;
        BANK_RECEIPT_UNCERTAIN='';
        renderPage();
        showToast(outcome.status==='other'?'已標記為其他款項。':'已確認銷帳。');
        try {await loadBankReceipts();renderPage();}
        catch (_) {showToast(outcome.status==='other'?'已標記為其他款項；清單更新暫時失敗，請重新整理。':'已確認銷帳；清單更新暫時失敗，請重新整理。');}
      } catch (error) {
        if (error && (error.code==='API_TIMEOUT' || ['BANK_RECEIPT_FAILED','SETTLEMENT_UNVERIFIED','SETTLEMENT_PENDING'].indexOf(error.code)>=0)) BANK_RECEIPT_UNCERTAIN=receiptId;
        // A timed-out write can still be running. Poll only reads; never retry
        // the confirmation automatically or release its uncertainty on pending.
        for (let attempt=0;attempt<3;attempt++) {
          try {
            await loadBankReceipts();
            const current = (BANK_RECEIPT_DATA.receipts||[]).find(function(r){return r.receipt_id===receiptId;});
            if (current && ['settled','other'].indexOf(current.status)>=0) {
              BANK_RECEIPT_UNCERTAIN='';renderPage();showToast(current.status==='settled'?'已確認銷帳。':'已標記為其他款項。');return;
            }
            if (!BANK_RECEIPT_UNCERTAIN) break;
          } catch (_) {BANK_RECEIPT_UNCERTAIN=receiptId;}
          if (attempt<2) await new Promise(function(resolve){setTimeout(resolve,5000);});
        }
        renderPage();
        showToast(BANK_RECEIPT_UNCERTAIN?'銷帳結果尚未確認，請重新整理核對。':error.message,true);
      } finally {
        BANK_RECEIPT_BUSY=false;
        button.textContent=originalLabel;
        card.setAttribute('aria-busy','false');
        document.querySelectorAll('.bank-receipt button').forEach(function(b){b.disabled=BANK_RECEIPT_UNCERTAIN===b.closest('.bank-receipt').dataset.receiptId;});
      }
    }

    function reportCard(report, canApprove) {
      const pending = isPending(report);
      const status = rawText(report.status).toLowerCase();
      return '<article class="report">' +
        '<div class="report-top"><div><div class="report-name">' + safeHtml(report.tenant_name || '未命名房客') + '</div><div class="report-meta">房間 ' + safeHtml(report.room_name || '-') + ' ・ 帳單 ' + safeHtml(report.bill_month || '-') + '</div></div><span class="badge ' + safeHtml(status) + '">' + safeHtml(statusLabel(status)) + '</span></div>' +
        '<div class="amount">' + money(report.reported_amount) + '</div>' +
        '<div class="detail-grid"><div class="detail"><div class="detail-label">匯款日期</div><div class="detail-value">' + safeHtml(formatDate(report.reported_paid_date)) + '</div></div><div class="detail"><div class="detail-label">帳號後五碼</div><div class="detail-value">' + safeHtml(report.reported_last5 || '-') + '</div></div><div class="detail"><div class="detail-label">帳單金額</div><div class="detail-value">' + money(report.bill_total_amount) + '</div></div><div class="detail"><div class="detail-label">回報時間</div><div class="detail-value">' + safeHtml(formatDate(report.created_at)) + '</div></div></div>' +
        (report.note ? '<div class="report-meta">房客備註：' + safeHtml(report.note) + '</div>' : '') +
        (pending && canApprove ? '<div class="actions"><button class="button primary" type="button" onclick="openDecision(\'' + safeHtml(report.report_id) + '\', \'confirmed\')">確認並銷帳</button><button class="button danger" type="button" onclick="openDecision(\'' + safeHtml(report.report_id) + '\', \'rejected\')">駁回</button></div>' : '') +
      '</article>';
    }

    function renderPage() {
      const data = PAGE_DATA || {};
      const reports = Array.isArray(data.reports) ? data.reports.filter(function(r){return !/^BPR-/.test(r.report_id||'');}) : [];
      const summary = buildReviewSummary(Object.assign({},data,{reports:reports,summary:null}));
      const canApprove = Boolean(data.permissions && data.permissions.can_approve_payment);
      const pending = reports.filter(isPending);
      const historical = reports.filter(function (report) { return !isPending(report); });
      document.getElementById('app').innerHTML =
        '<header class="header"><div><div class="eyebrow">LANDLORD WORKSPACE</div><h1>付款回報審核</h1><p class="subtitle">只顯示目前已授權工作區的付款回報。</p></div><button class="refresh" type="button" onclick="loadPage()">重新整理</button></header>' +
        bankReceiptPanel() +
        '<section class="card summary"><div class="metric"><div class="metric-label">待審核</div><div class="metric-value warning">' + Number(summary.pending || 0) + '</div></div><div class="metric"><div class="metric-label">全部回報</div><div class="metric-value">' + Number(summary.total || 0) + '</div></div><div class="metric"><div class="metric-label">已確認</div><div class="metric-value">' + Number(summary.confirmed || 0) + '</div></div><div class="metric"><div class="metric-label">已駁回／撤銷</div><div class="metric-value">' + (Number(summary.rejected || 0) + Number(summary.voided || 0)) + '</div></div></section>' +
        '<div class="section-title">待處理</div>' +
        (pending.length ? '<section class="card">' + pending.map(function (report) { return reportCard(report, canApprove); }).join('') + '</section>' : '<section class="card empty"><div class="state-title">目前沒有待審核付款回報</div><div class="state-text">新的付款回報會顯示在這裡。</div></section>') +
        '<div class="section-title">歷史紀錄</div>' +
        (historical.length ? '<section class="card">' + historical.map(function (report) { return reportCard(report, false); }).join('') + '</section>' : '<section class="card empty"><div class="state-text">尚無歷史付款回報。</div></section>') +
        (!canApprove ? '<div class="subtitle">目前角色僅可檢視付款回報，沒有付款確認或銷帳權限。</div>' : '');
    }

    function focusBankReceipt() {
      const id = new URLSearchParams(window.location.search).get('receipt_id') || '';
      if (!/^BRE-[a-f0-9]{32}$/.test(id)) return;
      const card = Array.from(document.querySelectorAll('.bank-receipt')).find(function(el){return el.dataset.receiptId===id;});
      if (card) {card.style.outline='2px solid var(--brand)';card.scrollIntoView({block:'start'});}
    }

    function openDecision(reportId, decision) {
      if (PAYMENT_REPORT_BUSY || PAYMENT_REPORT_UNCERTAIN || BANK_RECEIPT_BUSY || BANK_RECEIPT_UNCERTAIN) {
        showToast('上一筆處理結果尚未確認，請重新整理核對。', true); return;
      }
      const report = (PAGE_DATA.reports || []).find(function (item) { return item.report_id === reportId; });
      if (!report || !isPending(report)) {
        showToast('此付款回報目前不能處理。', true);
        return;
      }
      const isReject = decision === 'rejected';
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.innerHTML = '<section class="modal"><h2>' + (isReject ? '駁回付款回報' : '確認付款並銷帳') + '</h2><p>' + (isReject ? '請填寫駁回原因；送出後將由既有後端服務處理。' : '請確認匯款資料無誤。送出後將由既有正式銷帳服務處理。') + '</p><textarea id="decisionNote" maxlength="300" placeholder="' + (isReject ? '駁回原因（必填）' : '房東備註（選填）') + '"></textarea><div class="modal-actions"><button class="button secondary" type="button">取消</button><button class="button ' + (isReject ? 'danger' : 'primary') + '" type="button">送出處理</button></div></section>';
      const buttons = modal.querySelectorAll('button');
      buttons[0].onclick = function () { modal.remove(); };
      buttons[1].onclick = function () { submitDecision(reportId, decision, modal); };
      document.body.appendChild(modal);
    }

    async function submitDecision(reportId, decision, modal) {
      if (PAYMENT_REPORT_BUSY || PAYMENT_REPORT_UNCERTAIN || BANK_RECEIPT_BUSY || BANK_RECEIPT_UNCERTAIN) {
        showToast('上一筆處理結果尚未確認，請重新整理核對。', true); return;
      }
      const note = rawText(modal.querySelector('#decisionNote').value).trim();
      if (decision === 'rejected' && !note) {
        showToast('請填寫駁回原因。', true);
        return;
      }
      const submit = modal.querySelectorAll('button')[1];
      submit.disabled = true;
      submit.textContent = '處理中，請稍候…';
      PAYMENT_REPORT_BUSY = true;
      try {
        const result = await jsonpRequest('landlord_payment_report_update', {
          report_id: reportId,
          decision: decision,
          reject_reason: decision === 'rejected' ? note : '',
          landlord_note: decision === 'confirmed' ? note : ''
        }, 240000);
        if (!result || result.success !== true) throw new Error(result && result.message ? result.message : '付款回報處理失敗');
        modal.remove();
        showToast(result.message || '付款回報已處理。');
        loadPage();
      } catch (error) {
        if (error && error.code === 'API_TIMEOUT') {
          PAYMENT_REPORT_UNCERTAIN = reportId;
          submit.textContent = '正在核對處理結果…';
          const confirmedReport = await recoverTimedOutPaymentReport(reportId);
          if (confirmedReport) {
            PAYMENT_REPORT_UNCERTAIN = '';
            modal.remove();
            showToast('付款回報已完成銷帳。');
            loadPage();
            return;
          }
        }
        if (PAYMENT_REPORT_UNCERTAIN) {
          submit.textContent = '結果待確認';
          showToast('處理結果尚未確認，請重新整理核對，勿重複送出。', true);
        } else {
          submit.disabled = false;
          submit.textContent = '送出處理';
          showToast(error.message || '付款回報處理失敗。', true);
        }
      } finally {
        PAYMENT_REPORT_BUSY = false;
      }
    }

    async function loadPage() {
      try {
        const ready = await initLine();
        if (!ready) return;
        try {await loadBankReceipts();} catch (error) {BANK_RECEIPT_DATA=null;BANK_RECEIPT_ERROR=error.message;}
        const result = await jsonpRequest('landlord_payment_reports_init', {}, 60000);
        if (!result || result.success !== true) throw new Error(result && result.message ? result.message : '付款回報資料載入失敗');
        PAGE_DATA = result.data || {};
        if (PAYMENT_REPORT_UNCERTAIN && (PAGE_DATA.reports || []).some(function (r) { return r.report_id === PAYMENT_REPORT_UNCERTAIN && ['confirmed','rejected','voided','void'].indexOf(r.status) >= 0; })) PAYMENT_REPORT_UNCERTAIN = '';
        renderPage();
        focusBankReceipt();
      } catch (error) {
        renderError(error.message || String(error));
      }
    }

    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
    loadPage();
  </script>
</body>
</html>
