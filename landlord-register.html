<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>CMWebs 建立房東帳號</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="frontend-release.js?v=20261012-read-routing-v1"></script>
  <script src="liff-request-auth.js?v=20261012-read-routing-v1"></script>

  <style>
    :root {
      --app-height: 100vh;
      --primary: #06c755;
      --primary-dark: #079641;
      --primary-soft: #edf9f2;
      --page-bg: #f4f6f9;
      --surface: #ffffff;
      --text: #1d2025;
      --muted: #747a83;
      --border: #e7eaee;
      --danger: #d93025;
      --danger-soft: #fff0ef;
      --blue: #1a73e8;
      --blue-soft: #edf4ff;
      --orange-soft: #fff5df;
      --shadow: 0 12px 38px rgba(25, 35, 55, 0.09);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text);
      font-family:
        Arial,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: var(--app-height);
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(6, 199, 85, 0.16),
          transparent 31%
        ),
        var(--page-bg);
    }

    .page {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        max(22px, env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }

    .brand-icon {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: var(--primary);
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 8px 23px rgba(6, 199, 85, 0.24);
    }

    .brand-name {
      font-size: 17px;
      font-weight: 900;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .card {
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero-card {
      overflow: hidden;
    }

    .hero {
      position: relative;
      padding: 24px 20px;
      color: #ffffff;
      background:
        linear-gradient(
          145deg,
          #08a94b 0%,
          #06c755 58%,
          #05a947 100%
        );
    }

    .hero::after {
      position: absolute;
      top: -62px;
      right: -42px;
      width: 185px;
      height: 185px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      content: "";
    }

    .hero-eyebrow,
    .hero-title,
    .hero-desc {
      position: relative;
      z-index: 1;
    }

    .hero-eyebrow {
      margin-bottom: 7px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 11px;
      font-weight: 800;
    }

    .hero-title {
      margin: 0;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -0.55px;
    }

    .hero-desc {
      margin-top: 9px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 12px;
      line-height: 1.7;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 18px;
    }

    .profile-avatar {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 17px;
      font-weight: 900;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-main {
      min-width: 0;
      flex: 1;
    }

    .profile-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .profile-name {
      overflow: hidden;
      font-size: 14px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
    }

    .form-card {
      padding: 19px;
    }

    .section-title {
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 900;
    }

    .section-desc {
      margin-bottom: 17px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
    }

    .field {
      margin-top: 15px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 900;
    }

    .required {
      color: var(--danger);
      font-size: 10px;
    }

    .optional {
      color: var(--muted);
      font-size: 10px;
    }

    .input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      background: #ffffff;
      color: var(--text);
    }

    .input:focus {
      border-color: rgba(6, 199, 85, 0.55);
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.1);
    }

    .field-help {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .team-note {
      margin-top: 17px;
      padding: 13px 14px;
      border: 1px solid #d8e5fb;
      border-radius: 14px;
      background: var(--blue-soft);
      color: #315a92;
      font-size: 10px;
      line-height: 1.65;
    }

    .team-note strong {
      color: var(--blue);
    }

    .agreement {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #f7f9fb;
      color: #5e6570;
      font-size: 10px;
      line-height: 1.6;
    }

    .agreement input {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      margin: 1px 0 0;
      accent-color: var(--primary);
    }

    .submit-button,
    .primary-button,
    .secondary-button {
      width: 100%;
      min-height: 49px;
      margin-top: 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .submit-button,
    .primary-button {
      border: 0;
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(6, 199, 85, 0.2);
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
    }

    .submit-button:disabled {
      cursor: default;
      opacity: 0.55;
      box-shadow: none;
    }

    .security-note {
      margin-top: 11px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.6;
      text-align: center;
    }

    .loading-card,
    .error-card {
      padding: 30px 20px;
      text-align: center;
    }

    .loading-spinner {
      width: 33px;
      height: 33px;
      margin: 0 auto 14px;
      border: 3px solid #e5e9ed;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .state-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 28px;
      font-weight: 900;
    }

    .state-icon.red {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .state-title {
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: 900;
    }

    .state-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.75;
    }

    .notice {
      margin-bottom: 14px;
      padding: 13px 14px;
      border: 1px solid #f0dfb9;
      border-radius: 14px;
      background: var(--orange-soft);
      color: #74500c;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.65;
    }

    .modal-backdrop {
      position: absolute;
      z-index: 1500;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px 16px;
      background: rgba(17, 24, 39, 0.5);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      padding: 20px;
      border-radius: 19px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
      text-align: center;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 900;
    }

    .modal-message {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-line;
    }

    @media (max-width: 390px) {
      .page {
        padding-right: 13px;
        padding-left: 13px;
      }
    }
    .field { display: block; margin: 18px 0; }
    .field > span { display: block; margin-bottom: 7px; font-weight: 600; }
    .field > input { width: 100%; min-height: 46px; border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; background: #fff; }
    .field > input:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    .checkbox-row { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.7; }
    .checkbox-row > input { margin-top: 6px; }
    [aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
    #registrationStatus { min-height: 24px; font-size: 14px; line-height: 1.6; color: var(--muted); }
    a.submit-button { display: block; text-align: center; text-decoration: none; }
  </style>
</head>

<body>
  <div class="app-shell">
    <main class="page">
      <div class="brand">
        <div class="brand-icon">CM</div>

        <div>
          <div class="brand-name">CMWebs 智慧租管</div>
          <div class="brand-subtitle">建立你的管理團隊</div>
        </div>
      </div>

      <div id="app">
        <section class="card loading-card">
          <div class="loading-spinner"></div>
          <div class="state-title">正在準備註冊資料</div>
          <div class="state-text">
            請選擇 Email 或 LINE 完成身分驗證。
          </div>
        </section>
      </div>
    </main>

  </div>

  <script src="landlord-auth.js?v=20261012-read-routing-v1"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwnnuIFZ22eO6MxMnWOYHovgMT2xuTbcIgzbq4qmxXE3gjGoTJFcBGXlsNDS-lqr3EILQ/exec';
    const LIFF_ID = '2010314940-EjX1qbb8';
    const auth = CMWebsLandlordAuth.init({apiUrl:API_URL,liffId:LIFF_ID,entryPage:'landlord-entry.html',testMode:false});
    let method = new URLSearchParams(location.search).get('method') === 'line' ? 'line' : 'email';
    let challengeId = '', busy = false;
    const escapeText = value => String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function setAppHeight(){document.documentElement.style.setProperty('--app-height',(window.innerHeight || 800)+'px');}
    function showMessage(message){document.getElementById('registrationStatus').textContent=message;}
    function render(){
      document.getElementById('app').innerHTML = `
        <section class="card">
          <h1>建立房東帳號</h1>
          <p>先建立自己的管理團隊，再選擇適合的訂閱方案。</p>
          <div style="display:flex;gap:12px;margin:20px 0" aria-label="註冊方式">
            <button type="button" id="emailMethod" class="secondary-button" aria-pressed="${method==='email'}">Email 註冊</button>
            <button type="button" id="lineMethod" class="secondary-button" aria-pressed="${method==='line'}">LINE 註冊</button>
          </div>
          <form id="registrationForm">
            <label class="field"><span>姓名</span><input id="landlordName" name="name" required maxlength="60" autocomplete="name"></label>
            <label class="field"><span>手機</span><input id="phone" name="phone" required inputmode="tel" autocomplete="tel" placeholder="0912345678"></label>
            <label class="field"><span>Email ${method==='email'?'（需驗證）':'（選填，完成另行驗證後可用來登入）'}</span><input id="email" name="email" type="email" ${method==='email'?'required':''} maxlength="254" autocomplete="email"></label>
            <label class="field"><span>管理團隊名稱</span><input id="workspaceName" name="workspace" required maxlength="80" placeholder="我的管理團隊"></label>
            <label class="checkbox-row"><input id="termsConfirm" type="checkbox" required><span>我同意服務條款與資料使用說明，並確認使用自己的帳號註冊。</span></label>
            <div id="codeSection" hidden><label class="field"><span>Email 驗證碼</span><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="六位數驗證碼"></label><button type="button" id="resendCode" class="secondary-button">重新寄送</button></div>
            <p id="registrationStatus" role="status" aria-live="polite"></p>
            <button id="submitButton" class="submit-button" type="submit">${method==='email'?'寄送驗證碼':'使用 LINE 建立帳號'}</button>
          </form>
          <p><a href="landlord-entry.html">已有帳號？回登入頁</a></p>
        </section>`;
      document.getElementById('emailMethod').onclick=()=>{if(busy)return;method='email';challengeId='';render();};
      document.getElementById('lineMethod').onclick=()=>{if(busy)return;method='line';challengeId='';render();};
      document.getElementById('registrationForm').onsubmit=submitRegistration;
      document.getElementById('resendCode').onclick=async()=>{challengeId='';document.getElementById('email').readOnly=false;document.getElementById('codeSection').hidden=true;document.getElementById('submitButton').textContent='寄送驗證碼';showMessage('請確認 Email 後重新寄送。');};
    }
    function input(){return {landlord_name:document.getElementById('landlordName').value.trim(),phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim().toLowerCase(),workspace_name:document.getElementById('workspaceName').value.trim(),terms_accepted:document.getElementById('termsConfirm').checked};}
    async function verifiedLineToken(){
      await liff.init({liffId:LIFF_ID});
      if(!liff.isLoggedIn()){const target=new URL('landlord-register.html',location.href);target.searchParams.set('method','line');liff.login({redirectUri:target.href});return null;}
      const token=liff.getIDToken();if(!token)throw new Error('無法取得 LINE 登入驗證，請重新登入。');return token;
    }
    async function submitRegistration(event){
      event.preventDefault();if(busy)return;
      const values=input(),button=document.getElementById('submitButton');busy=true;button.disabled=true;showMessage('正在處理，請稍候…');
      try{
        let result;
        if(method==='email' && !challengeId){
          result=await auth.requestRegistrationEmail(values.email);
          if(result.code==='ALREADY_REGISTERED'){showMessage(result.message);return;}
          challengeId=result.data.challenge_id;document.getElementById('email').readOnly=true;document.getElementById('codeSection').hidden=false;document.getElementById('code').required=true;button.textContent='驗證並建立帳號';showMessage('驗證碼已寄出，請直接輸入收到的六位數驗證碼。');document.getElementById('code').focus();return;
        }
        if(method==='email')result=await auth.verifyRegistrationEmail(challengeId,document.getElementById('code').value,values);
        else {const token=await verifiedLineToken();if(!token)return;result=await auth.registerVerifiedLine(token,values);}
        if(result.code==='ALREADY_REGISTERED'){showMessage(result.message);return;}
        const data=result.data || {},pending=data.provisioning_status!=='READY';
        document.getElementById('app').innerHTML=`<section class="card"><h1>帳號已建立</h1><p>${escapeText(data.workspace_name || values.workspace_name)}</p><p>${pending?'訂閱帳號正在等待連線，可在訂閱頁重新連線。':'現在可以查看與選擇訂閱方案。'}</p><a class="submit-button" href="landlord-subscription.html">前往訂閱與會員中心</a></section>`;
      }catch(error){showMessage(error.message || '建立未完成，請稍後重試。');}
      finally{busy=false;if(document.getElementById('submitButton'))document.getElementById('submitButton').disabled=false;}
    }
    setAppHeight();window.addEventListener('resize',setAppHeight);render();
  </script>
</body>
</html>
