<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>CMWebs 建立房客與租約</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="frontend-release.js"></script>

  <style>
    :root {
      --app-height: 100vh;
      --nav-height: 68px;
      --primary: #06c755;
      --primary-dark: #079641;
      --primary-soft: #edf9f2;
      --purple: #7654c4;
      --purple-soft: #f3efff;
      --blue: #1a73e8;
      --blue-soft: #edf4ff;
      --orange: #ef8f00;
      --orange-soft: #fff5df;
      --danger: #d93025;
      --danger-soft: #fff0ef;
      --page-bg: #f4f6f9;
      --surface: #ffffff;
      --surface-soft: #fafbfc;
      --text: #1d2025;
      --muted: #747a83;
      --border: #e7eaee;
      --shadow: 0 10px 34px rgba(25, 35, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text);
      font-family:
        Arial,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 620px;
      height: var(--app-height);
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(6, 199, 85, 0.1),
          transparent 28%
        ),
        var(--page-bg);
    }

    .page {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        max(16px, env(safe-area-inset-top))
        15px
        calc(
          var(--nav-height) +
          24px +
          env(safe-area-inset-bottom)
        );
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .eyebrow {
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
    }

    .page-title {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.35px;
    }

    .back-button {
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      color: #5f6670;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .card {
      margin-bottom: 13px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 18px;
      color: #ffffff;
      background:
        linear-gradient(
          145deg,
          #079641 0%,
          #06c755 58%,
          #059943 100%
        );
    }

    .hero::after {
      position: absolute;
      top: -65px;
      right: -45px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.13);
      content: "";
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-label {
      color: rgba(255, 255, 255, 0.78);
      font-size: 9px;
      font-weight: 900;
    }

    .workspace-name {
      margin-top: 5px;
      font-size: 21px;
      font-weight: 900;
    }

    .hero-desc {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 10px;
      line-height: 1.65;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 15px;
    }

    .progress-item {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-number {
      font-size: 15px;
      font-weight: 900;
    }

    .progress-label {
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 8px;
    }

    .section-card {
      padding: 16px;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 900;
    }

    .section-desc {
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.6;
    }

    .section-index {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
    }

    .field {
      margin-top: 13px;
    }

    .field:first-child {
      margin-top: 0;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 900;
    }

    .required {
      color: var(--danger);
      font-size: 8px;
    }

    .optional {
      color: var(--muted);
      font-size: 8px;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #ffffff;
      color: var(--text);
    }

    .input,
    .select {
      height: 46px;
      padding: 0 13px;
    }

    .textarea {
      min-height: 88px;
      padding: 11px 13px;
      resize: vertical;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: rgba(6, 199, 85, 0.55);
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.08);
    }

    .field-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1.55;
    }

    .room-preview {
      display: none;
      margin-top: 13px;
      padding: 12px;
      border: 1px solid #d9d0f3;
      border-radius: 12px;
      background: var(--purple-soft);
    }

    .room-preview.show {
      display: block;
    }

    .room-preview-title {
      color: var(--purple);
      font-size: 11px;
      font-weight: 900;
    }

    .room-preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 9px;
    }

    .preview-item {
      padding: 9px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
    }

    .preview-label {
      color: #78679d;
      font-size: 7px;
    }

    .preview-value {
      margin-top: 3px;
      color: #4c3c73;
      font-size: 10px;
      font-weight: 900;
    }

    .contract-warning {
      display: none;
      margin-top: 10px;
      padding: 10px 11px;
      border: 1px solid #f0dfb9;
      border-radius: 10px;
      background: var(--orange-soft);
      color: #74500c;
      font-size: 8px;
      line-height: 1.65;
    }

    .contract-warning.show {
      display: block;
    }

    .amount-preview {
      margin-top: 13px;
      padding: 13px;
      border: 1px solid #ccebd8;
      border-radius: 12px;
      background: var(--primary-soft);
    }

    .amount-preview-title {
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
    }

    .amount-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 9px;
    }

    .amount-item {
      min-width: 0;
      padding: 9px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
    }

    .amount-label {
      color: #64806e;
      font-size: 7px;
    }

    .amount-value {
      margin-top: 4px;
      overflow: hidden;
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .confirmation-card {
      padding: 15px;
      border-color: #d7e8dd;
    }

    .confirmation-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .confirmation-check {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      margin-top: 1px;
      accent-color: var(--primary);
    }

    .confirmation-text {
      color: #4d555f;
      font-size: 10px;
      line-height: 1.65;
    }

    .confirmation-text strong {
      color: var(--text);
    }

    .submit-button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 9px 22px rgba(6, 199, 85, 0.2);
    }

    .submit-button:disabled {
      opacity: 0.52;
      cursor: default;
      box-shadow: none;
    }

    .loading-card,
    .error-card,
    .empty-card {
      padding: 30px 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 14px;
      border: 3px solid #e5e9ed;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-title,
    .error-title {
      margin-bottom: 7px;
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
    }

    .error-title {
      color: var(--danger);
    }

    .retry-button {
      width: 100%;
      min-height: 44px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .success-card {
      overflow: hidden;
    }

    .success-head {
      padding: 21px 18px;
      color: #ffffff;
      background:
        linear-gradient(
          145deg,
          #079641,
          #06c755
        );
      text-align: center;
    }

    .success-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      font-size: 27px;
      font-weight: 900;
    }

    .success-title {
      margin-top: 11px;
      font-size: 20px;
      font-weight: 900;
    }

    .success-desc {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.86);
      font-size: 10px;
      line-height: 1.6;
    }

    .success-body {
      padding: 17px;
    }

    .success-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .success-item {
      min-width: 0;
      padding: 10px;
      border-radius: 11px;
      background: var(--surface-soft);
    }

    .success-label {
      color: var(--muted);
      font-size: 8px;
    }

    .success-value {
      margin-top: 4px;
      overflow: hidden;
      font-size: 10px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .invite-box {
      margin-top: 14px;
      padding: 13px;
      border: 1px solid #d9d0f3;
      border-radius: 13px;
      background: var(--purple-soft);
    }

    .invite-title {
      color: var(--purple);
      font-size: 11px;
      font-weight: 900;
    }

    .invite-qr {
      display: flex;
      margin-top: 11px;
      align-items: center;
      gap: 12px;
      color: #5c5273;
      font-size: 9px;
      line-height: 1.6;
    }

    .invite-qr img {
      width: 132px;
      height: 132px;
      flex: 0 0 132px;
      padding: 6px;
      border-radius: 10px;
      background: #ffffff;
    }

    .invite-text {
      width: 100%;
      min-height: 150px;
      margin-top: 9px;
      padding: 11px;
      border: 1px solid #ddd5f5;
      border-radius: 10px;
      background: #ffffff;
      color: #4d435f;
      font-size: 9px;
      line-height: 1.65;
      resize: none;
    }

    .success-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 13px;
    }

    .success-button {
      min-height: 44px;
      border-radius: 11px;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .success-button.primary {
      border: 0;
      background: var(--primary);
      color: #ffffff;
    }

    .success-button.secondary {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
    }

    .success-button.full {
      grid-column: 1 / -1;
    }

    .toast {
      position: absolute;
      z-index: 2000;
      right: 16px;
      bottom:
        calc(
          var(--nav-height) +
          16px +
          env(safe-area-inset-bottom)
        );
      left: 16px;
      max-width: 470px;
      margin: 0 auto;
      padding: 12px 14px;
      border-radius: 13px;
      background: #22252a;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.55;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      background: var(--danger);
    }

    .bottom-nav {
      position: absolute;
      z-index: 1000;
      right: 0;
      bottom: 0;
      left: 0;
      border-top: 1px solid #e8ecf1;
      background: rgba(255, 255, 255, 0.98);
      padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(12px);
    }

    .app-shell.keyboard-open .bottom-nav {
      display: none;
    }

    .app-shell.keyboard-open .page {
      padding-bottom: 24px;
      scroll-padding-bottom: 24px;
    }

    .bottom-nav-inner {
      height: var(--nav-height);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      border: 0;
      background: transparent;
      color: #8b919a;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-item svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 900;
    }

    .nav-item.active::after {
      position: absolute;
      bottom: 5px;
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--primary);
      content: "";
    }

    .simple-hero {
      padding-bottom: 17px;
    }

    .simple-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .simple-step {
      padding: 9px 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.82);
      font-size: 9px;
      line-height: 1.5;
    }

    .simple-step strong {
      display: block;
      color: #ffffff;
      font-size: 14px;
    }

    .simple-inherited {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #d9e8de;
      border-radius: 13px;
      background: #f7fcf8;
    }

    .simple-inherited-title {
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
    }

    .simple-inherited-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 9px;
    }

    .simple-inherited-item {
      padding: 8px 9px;
      border-radius: 10px;
      background: #ffffff;
    }

    .simple-inherited-label {
      color: var(--muted);
      font-size: 8px;
    }

    .simple-inherited-value {
      margin-top: 3px;
      color: var(--text);
      font-size: 10px;
      font-weight: 900;
    }

    .simple-date-result {
      margin-top: 8px;
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
    }

    .simple-note {
      margin-top: 10px;
      padding: 10px 11px;
      border-radius: 11px;
      background: var(--orange-soft);
      color: #74500c;
      font-size: 9px;
      line-height: 1.65;
    }

    @media (max-width: 430px) {
      .field-grid {
        grid-template-columns: 1fr;
      }

      .amount-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <main class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow">Tenant Onboarding</div>
          <div id="pageTitle" class="page-title">建立租約</div>
        </div>

        <button
          class="back-button"
          type="button"
          onclick="goPage('landlord-tenants.html')"
        >
          返回房客
        </button>
      </div>

      <div id="app">
        <section class="card loading-card">
          <div class="loading-spinner"></div>
          <div class="loading-title">建立資料載入中</div>
          正在讀取物件、房間與租金設定。
        </section>
      </div>
    </main>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="nav-item" type="button" onclick="goPage('landlord-home.html')">
          <svg viewBox="0 0 24 24">
            <path d="M4 11.5L12 5l8 6.5"></path>
            <path d="M6.5 10.5V19h11v-8.5"></path>
            <path d="M9.5 19v-5h5v5"></path>
          </svg>
          <span>首頁</span>
        </button>

        <button class="nav-item" type="button" onclick="goPage('landlord-arrears.html')">
          <svg viewBox="0 0 24 24">
            <rect x="5" y="4.5" width="14" height="15" rx="2"></rect>
            <path d="M8.5 9h7"></path>
            <path d="M8.5 13h7"></path>
            <path d="M8.5 17h4"></path>
          </svg>
          <span>欠款</span>
        </button>

        <button class="nav-item active" type="button" onclick="goPage('landlord-tenants.html')">
          <svg viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3"></circle>
            <path d="M4 19c.5-3.2 2.2-5 5-5s4.5 1.8 5 5"></path>
            <path d="M15.5 7.5a2.5 2.5 0 0 1 0 5"></path>
            <path d="M16 14c2.2.4 3.5 2 4 5"></path>
          </svg>
          <span>房客</span>
        </button>

        <button class="nav-item" type="button" onclick="goPage('landlord-more.html')">
          <svg viewBox="0 0 24 24">
            <circle cx="6" cy="12" r="1.5"></circle>
            <circle cx="12" cy="12" r="1.5"></circle>
            <circle cx="18" cy="12" r="1.5"></circle>
          </svg>
          <span>更多</span>
        </button>
      </div>
    </nav>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbwnnuIFZ22eO6MxMnWOYHovgMT2xuTbcIgzbq4qmxXE3gjGoTJFcBGXlsNDS-lqr3EILQ/exec';

    const LIFF_ID =
      '2010314940-EjX1qbb8';

    const LANDLORD_ENTRY_URL =
      new URL(
        'landlord-entry.html',
        location.href
      ).href.split('?')[0];

    const TEST_LINE_USER_ID =
      'Uf708ece75c9c985cfe1dbda48d123511';

    const URL_PARAMS =
      new URLSearchParams(
        location.search
      );

    const TEST_MODE =
      URL_PARAMS.get('test') ===
      '1';

    const PRESELECTED_PROPERTY_ID =
      URL_PARAMS.get(
        'property_id'
      ) || '';

    const PRESELECTED_ROOM_ID =
      URL_PARAMS.get(
        'room_id'
      ) || '';

    const REQUESTED_CONTRACT_MODE =
      URL_PARAMS.get('mode') ===
      'renewal'
        ? 'renewal'
        : 'new';

    const SIMPLE_NEW_MODE =
      REQUESTED_CONTRACT_MODE === 'new' &&
      URL_PARAMS.get('mode') !== 'advanced_new';

    const REQUESTED_PREVIOUS_CONTRACT_ID =
      URL_PARAMS.get(
        'previous_contract_id'
      ) || '';

    let LINE_USER_ID = '';
    let LANDLORD_REVIEW_SESSION_TOKEN = '';
    let PAGE_DATA = null;
    let CREATED_DATA = null;
    let CONTRACT_MODE = REQUESTED_CONTRACT_MODE;

    function buildLandlordLoginRedirectUri() {
      const currentUrl =
        new URL(
          location.href
        );

      [
        'code',
        'state',
        'liff.state',
        'friendship_status_changed',
        'error',
        'error_description'
      ].forEach(
        function (key) {
          currentUrl.searchParams.delete(
            key
          );
        }
      );

      const returnTo =
        currentUrl.pathname
          .split('/')
          .pop() +
        (
          currentUrl.searchParams
            .toString()
            ? '?' +
              currentUrl.searchParams
                .toString()
            : ''
        );

      sessionStorage.setItem(
        'cmwebs_landlord_return_to',
        returnTo
      );

      const entryUrl =
        new URL(
          LANDLORD_ENTRY_URL
        );

      entryUrl.searchParams.set(
        'return_to',
        returnTo
      );

      return entryUrl.href;
    }

    function jsonpRequest(
      action,
      params,
      retryCount
    ) {
      return new Promise(
        function (resolve, reject) {
          const callbackName =
            '__cmwebs_tenant_create_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              'script'
            );

          let finished = false;

          const timer =
            setTimeout(
              function () {
                if (finished) {
                  return;
                }

                finished = true;
                cleanup();

                if (
                  Number(
                    retryCount || 0
                  ) < 1
                ) {
                  jsonpRequest(
                    action,
                    params,
                    1
                  ).then(
                    resolve
                  ).catch(
                    reject
                  );

                  return;
                }

                reject(
                  new Error(
                    'API 載入逾時。請確認已替換快速修正版後端並重新部署。'
                  )
                );
              },
              45000
            );

          function cleanup() {
            clearTimeout(timer);

            if (script.parentNode) {
              script.parentNode.removeChild(
                script
              );
            }

            try {
              delete window[
                callbackName
              ];
            } catch (error) {
              window[callbackName] =
                undefined;
            }
          }

          window[callbackName] =
            function (result) {
              if (finished) {
                return;
              }

              finished = true;
              cleanup();
              resolve(result);
            };

          let url =
            API_URL +
            '?v2_action=' +
            encodeURIComponent(
              action
            ) +
            '&line_user_id=' +
            encodeURIComponent(
              LINE_USER_ID
            ) +
            '&callback=' +
            encodeURIComponent(
              callbackName
            ) +
            '&_=' +
            Date.now();

          Object.keys(
            params || {}
          ).forEach(
            function (key) {
              url +=
                '&' +
                encodeURIComponent(
                  key
                ) +
                '=' +
                encodeURIComponent(
                  params[key]
                );
            }
          );

          script.onerror =
            function () {
              if (finished) {
                return;
              }

              finished = true;
              cleanup();

              reject(
                new Error(
                  'API 路由執行失敗'
                )
              );
            };

          script.src = url;
          document.body.appendChild(
            script
          );
        }
      );
    }

    function randomUrlToken(bytes) {
      const value = new Uint8Array(bytes);
      crypto.getRandomValues(value);
      return btoa(String.fromCharCode.apply(null, value))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    async function fetchStatusJson(url) {
      const response = await fetch(url, {
        method: 'GET',
        credentials: 'omit',
        cache: 'no-store'
      });
      if (!response.ok) {
        throw new Error('房東身分驗證連線失敗');
      }
      return response.json();
    }

    function callLandlordReviewAuthStatus(requestId, pollSecret) {
      const url = API_URL +
        '?v2_action=landlord_contract_signing_review_auth_status' +
        '&request_id=' + encodeURIComponent(requestId) +
        '&poll_secret=' + encodeURIComponent(pollSecret) +
        '&_=' + Date.now();
      return fetchStatusJson(url);
    }

    async function initializeLandlordReviewSession() {
      if (TEST_MODE) return false;
      const idToken = liff.getIDToken();
      if (!idToken) throw new Error('無法取得房東審核身分憑證');
      const requestId = randomUrlToken(16);
      const pollSecret = randomUrlToken(32);
      await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ action: 'landlord_contract_signing_review_auth_init', id_token: idToken, request_id: requestId, poll_secret: pollSecret }) });
      for (let attempt = 0; attempt < 6; attempt += 1) {
        await new Promise(function(resolve) { setTimeout(resolve, 500); });
        const result = await callLandlordReviewAuthStatus(requestId, pollSecret);
        if (result.code === 'AUTH_EXCHANGE_NOT_FOUND') continue;
        if (!result.success || !result.data || !result.data.session_token) throw new Error(result.message || '房東審核身分驗證失敗');
        LANDLORD_REVIEW_SESSION_TOKEN = result.data.session_token;
        return true;
      }
      throw new Error('房東身分驗證逾時');
    }

    function callLandlordInitiatedStatus(action, requestId, pollSecret) {
      const url = API_URL +
        '?v2_action=landlord_contract_initiated_status' +
        '&operation=' + encodeURIComponent(action) +
        '&request_id=' + encodeURIComponent(requestId) +
        '&poll_secret=' + encodeURIComponent(pollSecret) +
        '&_=' + Date.now();
      return fetchStatusJson(url);
    }

    async function postLandlordInitiatedContract(action, input) {
      if (!LANDLORD_REVIEW_SESSION_TOKEN) throw new Error('房東審核身分驗證已失效，請重新整理頁面。');
      const requestId = randomUrlToken(16);
      const pollSecret = randomUrlToken(32);
      await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(Object.assign({}, input || {}, { action: action, request_id: requestId, poll_secret: pollSecret, session_token: LANDLORD_REVIEW_SESSION_TOKEN })) });
      for (let attempt = 0; attempt < 6; attempt += 1) {
        await new Promise(function(resolve) { setTimeout(resolve, 500); });
        const result = await callLandlordInitiatedStatus(action, requestId, pollSecret);
        if (result.code === 'LANDLORD_INITIATED_CONTRACT_EXCHANGE_NOT_FOUND' || result.code === 'LANDLORD_INITIATED_CONTRACT_EXCHANGE_PENDING') continue;
        if (!result.success) throw new Error(result.message || '合約操作失敗');
        return result.data || {};
      }
      throw new Error('合約操作處理逾時');
    }

    function normalizePhone(value) {
      let digits =
        rawText(value)
          .replace(/\D/g, '');

      if (
        digits.indexOf('8860') === 0 &&
        digits.length === 13
      ) {
        digits =
          '0' +
          digits.slice(4);
      } else if (
        digits.indexOf('886') === 0 &&
        digits.length === 12
      ) {
        digits =
          '0' +
          digits.slice(3);
      } else if (
        digits.length === 9 &&
        digits.charAt(0) === '9'
      ) {
        digits =
          '0' +
          digits;
      }

      return digits;
    }

    function formatPhoneInput() {
      const input =
        document.getElementById(
          'tenantPhone'
        );

      if (!input) {
        return;
      }

      input.value =
        normalizePhone(
          input.value
        );
    }

    function addOneYearMinusOneDay(value) {
      const start =
        new Date(
          value +
          'T00:00:00'
        );

      if (
        Number.isNaN(
          start.getTime()
        )
      ) {
        return '';
      }

      start.setFullYear(
        start.getFullYear() +
        1
      );

      start.setDate(
        start.getDate() -
        1
      );

      return [
        start.getFullYear(),
        String(
          start.getMonth() +
          1
        ).padStart(2, '0'),
        String(
          start.getDate()
        ).padStart(2, '0')
      ].join('-');
    }

    function simpleContractEndDate_(value, termMonths) {
      const start = new Date(rawText(value) + 'T00:00:00');
      const months = Number(termMonths);
      if (Number.isNaN(start.getTime()) || !Number.isInteger(months) || months < 1) {
        return '';
      }
      start.setMonth(start.getMonth() + months);
      start.setDate(start.getDate() - 1);
      return [
        start.getFullYear(),
        String(start.getMonth() + 1).padStart(2, '0'),
        String(start.getDate()).padStart(2, '0')
      ].join('-');
    }

            <label class="confirmation-text" for="confirmCreate">
              <strong id="confirmationHeadline">我確認房間、租約日期與收費條件均正確。</strong>
              <span id="confirmationBody">房客姓名與手機可留白，系統會建立待認領邀請，核准後才啟用房客資料。</span>

        'rentAmount',
        'managementFee',
        'depositMonths',

            );

          if (element) {
            element.addEventListener(
              'input',
              updateAmountPreview

          }

    function numberField(
      id,
      label,
      value,
      min,
      step,
      max
    ) {
      return `
        <div class="field">
          <div class="field-label">
            <span>${safeHtml(label)}</span>
            <span class="required">必填</span>
          </div>

          <input
            id="${safeHtml(id)}"
            class="input"
            type="number"
            min="${safeHtml(min)}"
            step="${safeHtml(step)}"
            ${
              max
                ? 'max="' +
                  safeHtml(max) +
                  '"'
                : ''
            }
            value="${safeHtml(value)}"
          />
        </div>
      `;
    }

    function handlePropertyChange() {
      const propertyId =
        inputValue(
          'propertyId'
        );

      const roomSelect =
        document.getElementById(
          'roomId'
        );

      roomSelect.innerHTML =
        roomOptions(
          propertyId,
          ''
        );

      handleRoomChange(
        true
      );
    }

    function resolveRoomLeaseDefaults_(room) {
      const rent = Number(
        room && room.rent_amount || 0
      );
      const management = Number(
        room && room.management_fee || 0
      );
      const monthlyTotal =
        rent + management;
      const explicitDeposit = Number(
        room && room.deposit_amount || 0
      );
      const storedMonths = Number(
        room && room.deposit_months || 0
      );
      const depositMonths =
        explicitDeposit > 0 && monthlyTotal > 0
          ? Math.round(
              (explicitDeposit / monthlyTotal) * 100
            ) / 100
          : storedMonths > 0
            ? storedMonths
            : 2;

      return {
        rent_amount: rent,
        management_fee: management,
        deposit_months: depositMonths,
        deposit_amount: explicitDeposit > 0
          ? Math.round(explicitDeposit)
          : Math.round(monthlyTotal * depositMonths),
        payment_day: Number(
          room && room.payment_day || 10
        ),
        electricity_fee_rate: Number(
          room && room.electricity_fee_rate || 0
        ),
        equipment_fee_rate: Number(
          room && room.equipment_fee_rate || 0
        )
      };
    }

    function handleRoomChange(
      applyDefaults
    ) {
      const room =
        getRoom(
          inputValue(
            'roomId'
          )
        );

      const renewalSource = PAGE_DATA && PAGE_DATA.renewal_source;
      const roomHasSelectedRenewal = Boolean(
        room &&
        PREVIOUS_CONTRACT_ID &&
        (
          (room.existing_contract && rawText(room.existing_contract.contract_id) === PREVIOUS_CONTRACT_ID) ||
          (renewalSource && rawText(renewalSource.contract_id) === PREVIOUS_CONTRACT_ID && rawText(renewalSource.room_id) === rawText(room.room_id))
        )
      );

      if (
        CONTRACT_MODE === 'renewal' &&
        PREVIOUS_CONTRACT_ID &&
        !roomHasSelectedRenewal
      ) {
        CONTRACT_MODE = 'new';
        PREVIOUS_CONTRACT_ID = '';
        setContractModeUi();
      }

      const preview =
        document.getElementById(
          'roomPreview'
        );

      const warning =
        document.getElementById(
          'contractWarning'
        );

      if (!room) {
        preview.classList.remove(
          'show'
        );

        warning.classList.remove(
          'show'
        );

        return;
      }

      preview.innerHTML = `
        <div class="room-preview-title">
          ${safeHtml(
            room.property_name +
            '・' +
            room.room_name
          )}
        </div>

        <div class="room-preview-grid">
          ${previewItem(
            '房間月租',
            'NT$ ' +
            money(
              room.rent_amount
            )
          )}

          ${previewItem(
            '管理費',
            'NT$ ' +
            money(
              room.management_fee
            )
          )}

          ${previewItem(
            '每月繳款日',
            '每月 ' +
            Number(
              room.payment_day ||
              10
            ) +
            ' 日'
          )}

          ${previewItem(
            '目前狀態',
            room.has_current_or_upcoming_contract
              ? '已有租約'
              : '可建立租約'
          )}
        </div>
      `;

      preview.classList.add(
        'show'
      );

      if (
        room.has_current_or_upcoming_contract &&
        room.existing_contract
      ) {
        const contract =
          room.existing_contract;

        warning.innerHTML =
          safeHtml(
            '此房間已有租約 ' +
            (contract.contract_id || '') +
            '，期間 ' +
            (rawText(contract.start_date) || '-') +
            ' 至 ' +
            (rawText(contract.end_date) || '-') +
            '。若是同一房客續約，請由房東主動發起新版本。'
          ) +
          '<button class="retry-button" type="button" onclick="startRenewalFromRoom()">從此合約發起續約</button>';

        warning.classList.add(
          'show'
        );
      } else {
        warning.classList.remove(
          'show'
        );
      }

      if (applyDefaults) {
        const defaults =
          resolveRoomLeaseDefaults_(
            room
          );

        setInputValue(
          'rentAmount',
          defaults.rent_amount
        );

        setInputValue(
          'managementFee',
          defaults.management_fee
        );

        setInputValue(
          'depositMonths',
          defaults.deposit_months
        );

        setInputValue(
          'depositAmount',
          defaults.deposit_amount
        );

        setInputValue(
          'paymentDay',
          defaults.payment_day
        );

        setInputValue(
          'electricityRate',
          defaults.electricity_fee_rate
        );

        setInputValue(
          'equipmentRate',
          defaults.equipment_fee_rate
        );

        updateAmountPreview();
      }
    }

    function setContractModeUi() {
      const renewal = CONTRACT_MODE === 'renewal';
      const heroDescription = document.getElementById('heroDescription');
      const tenantDataDescription = document.getElementById('tenantDataSectionDesc');
      const confirmationHeadline = document.getElementById('confirmationHeadline');
      const confirmationBody = document.getElementById('confirmationBody');
      const submitButton = document.getElementById('submitButton');
      const renewalClauseField = document.getElementById('renewalClauseField');
      const pageTitle = document.getElementById('pageTitle');
      if (renewalClauseField) renewalClauseField.style.display = renewal ? 'block' : 'none';
      if (pageTitle) pageTitle.textContent = renewal ? '建立續約' : '建立新租約';
      if (heroDescription) heroDescription.textContent = renewal
        ? '由房東主動建立新的續約版本，房客只需確認差異並完成線上簽名。'
        : '建立待房客認領的新空房合約，現場可先收款，房客再補資料與簽署。';
      if (tenantDataDescription) tenantDataDescription.textContent = renewal
        ? '續約沿用既有房客身份，不會要求重新上傳身分證；下方資料僅供房東確認。'
        : '房客姓名與手機可先留白，房客會在邀請頁補填並用 LINE 身分確認。';
      if (confirmationHeadline) confirmationHeadline.textContent = renewal
        ? '我確認這是正確的既有房客與續約條件。'
        : '我確認房間、租約日期與收費條件均正確。';
      if (confirmationBody) confirmationBody.textContent = renewal
        ? '系統會使用新版合約建立新的待簽版本，舊合約保留不覆寫；送出後可直接把邀請交給房客簽署。'
        : '房客姓名與手機可留白，系統會建立待認領邀請，核准後才啟用房客資料。';
      if (submitButton) submitButton.textContent = renewal
        ? '建立新版續約並發送簽署邀請'
        : '建立待房客認領的合約';
    }

    function renewalSourceForRoom_(room) {
      const source = PAGE_DATA && PAGE_DATA.renewal_source;
      if (source && rawText(source.contract_id).trim() === PREVIOUS_CONTRACT_ID && rawText(source.room_id).trim() === rawText(room && room.room_id).trim()) return source;
      const existing = room && room.existing_contract;
      if (existing && rawText(existing.contract_id).trim() === PREVIOUS_CONTRACT_ID) return existing;
      return null;
    }

    function applyRenewalSourceToForm_(previous) {
      if (!previous) return;
      setInputValue('tenantName', previous.tenant_name || previous.name || '');
      setInputValue('tenantPhone', previous.tenant_phone || previous.phone || '');
      setInputValue('tenantEmail', previous.tenant_email || previous.email || '');
      setInputValue('rentAmount', previous.rent_amount || previous.monthly_rent || '');
      setInputValue('managementFee', previous.management_fee || previous.monthly_management_fee || 0);
      setInputValue('depositMonths', previous.deposit_months || '');
      setInputValue('depositAmount', previous.deposit_amount || '');
      setInputValue('paymentDay', previous.payment_day || previous.monthly_payment_day || 10);
      setInputValue('electricityRate', previous.electricity_fee_rate || 0);
      setInputValue('equipmentRate', previous.equipment_fee_rate || 0);
      setInputValue('note', previous.note || '');

      if (previous.end_date) {
        const nextStart = rawText(previous.end_date).trim();
        const nextEnd = addOneYearMinusOneDay(nextStart);
        if (nextStart && nextEnd) {
          setInputValue('startDate', nextStart);
          setInputValue('endDate', nextEnd);
        }
      }

      const clauseCheckbox = document.getElementById('specialOfferEnabled');
      if (clauseCheckbox) clauseCheckbox.checked = previous.special_offer_enabled === true || rawText(previous.special_offer_enabled).toLowerCase() === 'true';
      updateAmountPreview();
    }

    function startRenewalFromRoom() {
      const room = getRoom(inputValue('roomId'));
      const previous = renewalSourceForRoom_(room);
      if (!previous || !rawText(previous.contract_id).trim()) {
        showToast('找不到可續約的現有合約。', true);
        return;
      }
      CONTRACT_MODE = 'renewal';
      PREVIOUS_CONTRACT_ID = rawText(previous.contract_id).trim();
      applyRenewalSourceToForm_(previous);
      setContractModeUi();
      showToast('已切換為續約模式，請確認新租期與收費條件。');
      document.getElementById('startDate').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function previewItem(
      label,
      value
    ) {
      return `
        <div class="preview-item">
          <div class="preview-label">
            ${safeHtml(label)}
          </div>

          <div class="preview-value">
            ${safeHtml(value)}
          </div>
        </div>
      `;
    }

    function setInputValue(
      id,
      value
    ) {
      const element =
        document.getElementById(
          id
        );

      if (element) {
        element.value =
          value ===
          undefined ||
          value ===
          null
            ? ''
            : value;
      }
    }

    function handleStartDateChange() {
      const startDate =
        inputValue(
          'startDate'
        );

      if (!startDate) {
        return;
      }

      setInputValue(
        'endDate',
        addOneYearMinusOneDay(
          startDate
        )
      );
    }

    function updateAmountPreview() {
      const rent =
        Number(
          inputValue(
            'rentAmount'
          ) || 0
        );

      const management =
        Number(
          inputValue(
            'managementFee'
          ) || 0
        );

      const deposit =
        Number(
          inputValue(
            'depositAmount'
          ) || 0
        );

      const monthlyElement =
        document.getElementById(
          'monthlyTotalPreview'
        );

      const depositElement =
        document.getElementById(
          'depositPreview'
        );

      if (monthlyElement) {
        monthlyElement.textContent =
          'NT$ ' +
          money(
            rent +
            management
          );
      }

      if (depositElement) {
        depositElement.textContent =
          'NT$ ' +
          money(
            deposit
          );
      }
    }

    function updateSubmitState() {
      const checkbox =
        document.getElementById(
          'confirmCreate'
        );

      const button =
        document.getElementById(
          'submitButton'
        );

      if (button) {
        button.disabled =
          !checkbox ||
          checkbox.checked !==
            true;
      }
    }

    function validateForm() {
      if (SIMPLE_NEW_MODE) {
        const roomId = inputValue('roomId');
        const startDate = inputValue('startDate');
        const termMonths = Number(inputValue('termMonths'));
        const rentAmount = Number(inputValue('rentAmount'));
        const depositAmount = Number(inputValue('depositAmount'));

        if (!roomId) return '請選擇房號。';
        if (!/^\d{4}-\d{2}-\d{2}$/.test(startDate)) return '請輸入租約開始日。';
        if (!Number.isInteger(termMonths) || termMonths < 1 || termMonths > 120) return '租期請輸入 1 至 120 個月。';
        if (!inputValue('endDate')) return '租約結束日計算失敗，請重新選擇開始日與租期。';
        if (!Number.isFinite(rentAmount) || rentAmount <= 0) return '每月租金必須大於 0。';
        if (!Number.isFinite(depositAmount) || depositAmount <= 0) return '押金必須大於 0。';
        return '';
      }

      const tenantName =
        inputValue(
          'tenantName'
        );

      const tenantPhone =
        normalizePhone(
          inputValue(
            'tenantPhone'
          )
        );

      const tenantEmail =
        inputValue(
          'tenantEmail'
        );

      const propertyId =
        inputValue(
          'propertyId'
        );

      const roomId =
        inputValue(
          'roomId'
        );

      const startDate =
        inputValue(
          'startDate'
        );

      const endDate =
        inputValue(
          'endDate'
        );

      if (tenantPhone && !/^09\d{8}$/.test(tenantPhone)) {
        return '請輸入正確的台灣手機號碼。';
      }

      if (
        tenantEmail &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
          tenantEmail
        )
      ) {
        return '房客 Email 格式不正確。';
      }

      if (
        !propertyId ||
        !roomId
      ) {
        return '請選擇物件與房間。';
      }

      if (
        !startDate ||
        !endDate
      ) {
        return '請輸入租約開始與結束日期。';
      }

      if (
        new Date(
          startDate +
          'T00:00:00'
        ).getTime() >
        new Date(
          endDate +
          'T00:00:00'
        ).getTime()
      ) {
        return '租約結束日期不得早於開始日期。';
      }

      if (
        Number(
          inputValue(
            'rentAmount'
          )
        ) <= 0
      ) {
        return '每月租金必須大於 0。';
      }

      const paymentDay =
        Number(
          inputValue(
            'paymentDay'
          )
        );

      if (
        !Number.isInteger(
          paymentDay
        ) ||
        paymentDay < 1 ||
        paymentDay > 28
      ) {
        return '每月繳款日請輸入 1 至 28。';
      }

      return '';
    }

    async function submitCreate() {
      const validation =
        validateForm();

      if (validation) {
        showToast(
          validation,
          true
        );

        return;
      }

      const button =
        document.getElementById(
          'submitButton'
        );

      button.disabled =
        true;

      button.textContent =
        '建立中...';

      try {
        const result =
          await postLandlordInitiatedContract(
            CONTRACT_MODE === 'renewal'
              ? 'landlord_contract_initiate_renewal_direct'
              : 'landlord_contract_initiate_new',
            {
              tenant_name:
                inputValue(
                  'tenantName'
                ),
              tenant_phone:
                normalizePhone(
                  inputValue(
                    'tenantPhone'
                  )
                ),
              tenant_email:
                inputValue(
                  'tenantEmail'
                ),
              property_id:
                inputValue(
                  'propertyId'
                ),
              room_id:
                inputValue(
                  'roomId'
                ),
              start_date:
                inputValue(
                  'startDate'
                ),
              end_date:
                inputValue(
                  'endDate'
                ),
              rent_amount:
                inputValue(
                  'rentAmount'
                ),
              management_fee:
                inputValue(
                  'managementFee'
                ),
              deposit_months:
                inputValue(
                  'depositMonths'
                ),
              deposit_amount:
                inputValue(
                  'depositAmount'
                ),
              payment_day:
                inputValue(
                  'paymentDay'
                ),
              electricity_fee_rate:
                inputValue(
                  'electricityRate'
                ),
              equipment_fee_rate:
                inputValue(
                  'equipmentRate'
                ),
              term_months:
                SIMPLE_NEW_MODE
                  ? inputValue('termMonths')
                  : '',
              simple_flow:
                SIMPLE_NEW_MODE,
              identity_document_mode:
                SIMPLE_NEW_MODE
                  ? 'required'
                  : undefined,
              note:
                inputValue(
                  'note'
                ),
              special_offer_enabled:
                CONTRACT_MODE === 'renewal' &&
                Boolean(document.getElementById('specialOfferEnabled') && document.getElementById('specialOfferEnabled').checked),
              special_offer_notice_days:
                CONTRACT_MODE === 'renewal'
                  ? 30
                  : 0,
              special_offer_clause:
                CONTRACT_MODE === 'renewal' &&
                Boolean(document.getElementById('specialOfferEnabled') && document.getElementById('specialOfferEnabled').checked)
                  ? '租約期滿如不再續約，提前30個日曆日通知，免收違約金。'
                  : '',
              previous_contract_id:
                CONTRACT_MODE === 'renewal'
                  ? PREVIOUS_CONTRACT_ID
                  : ''
            }
          );

        if (!result || !result.contract || (CONTRACT_MODE === 'new' && !result.invite)) {
          throw new Error('房東合約邀請建立失敗');
        }

        result.mode = CONTRACT_MODE;
        result.simple_flow = SIMPLE_NEW_MODE;
        CREATED_DATA = result;

        renderSuccess();

      } catch (error) {
        showToast(
          error &&
          error.message
            ? error.message
            : '房客與租約建立失敗',
          true
        );

        button.disabled =
          false;

        button.textContent = CONTRACT_MODE === 'renewal'
          ? '建立新版續約並發送簽署邀請'
          : SIMPLE_NEW_MODE
            ? '建立租約並產生簽署邀請'
            : '建立待房客認領的合約';
      }
    }

    function renderSuccess() {
      const tenant =
        CREATED_DATA.tenant || {};

      const contract =
        CREATED_DATA.contract || {};

      const property =
        CREATED_DATA.property || {};

      const room =
        CREATED_DATA.room || {};

      const binding =
        CREATED_DATA.binding || {};
      const invite = CREATED_DATA.invite || {};
      const initiated = Boolean(invite.invite_id);
      const renewal = CREATED_DATA.mode === 'renewal';
      const simpleNew = CREATED_DATA.simple_flow === true;
      const selectedRoom = getRoom(contract.room_id) || {};
      const selectedProperty = (PAGE_DATA && Array.isArray(PAGE_DATA.properties)
        ? PAGE_DATA.properties.find(function(item) { return rawText(item.property_id) === rawText(contract.property_id); })
        : null) || {};
      const propertyName = property.property_name || selectedProperty.property_name || selectedRoom.property_name || '';
      const roomName = room.room_name || selectedRoom.room_name || contract.room_name || '';
      const invitationMessage = initiated
        ? (renewal ? '請開啟房客續約簽署邀請：\n' : '請開啟房客合約邀請：\n') + invite.url + '\n\n確認碼：' + invite.confirmation_code + '\n\n請用本人 LINE 開啟連結，確認新版合約內容並完成線上簽署。房東審核通過後合約才會生效。'
        : renewal
          ? '房東已建立新的續約合約：' + contract.contract_id + '\n\n請開啟 CMWebs 房客合約頁，確認新舊條款差異並完成線上簽名。房東審核通過後，新合約才會生效。'
        : binding.invitation_message || '';

      document.getElementById(
        'app'
      ).innerHTML = `
        <section class="card success-card">
          <div class="success-head">
            <div class="success-icon">✓</div>
            <div class="success-title">
              ${initiated && renewal ? '新版續約簽署邀請已建立' : initiated && simpleNew ? '簡易租約簽署邀請已建立' : initiated ? '待房客認領的合約已建立' : renewal ? '待房客簽署的續約合約已建立' : '房客與租約已建立'}
            </div>

            <div class="success-desc">
              ${initiated && renewal ? '新版合約已建立，請將下方邀請連結與確認碼交給既有房客簽署；舊合約保持不變。' : initiated && simpleNew ? '租約已建立，請將下方邀請連結與確認碼交給房客；房客會補上身分資料與簽名，房東審核後才生效。' : initiated ? '將下方邀請連結與確認碼交給房客，房客現場完成資料與簽署。' : renewal ? '請通知既有房客開啟合約頁確認差異並簽名；核准前不會改動原合約。' : '現在將下方綁定訊息傳給房客即可。'}
            </div>
          </div>

          <div class="success-body">
            <div class="success-grid">
              ${successItem(
                '房客',
                contract.tenant_name || tenant.tenant_name || '待房客填寫'
              )}

              ${successItem(
                '房客 ID',
                contract.tenant_id || tenant.tenant_id
              )}

              ${successItem(
                '物件',
                propertyName
              )}

              ${successItem(
                '房間',
                roomName
              )}

              ${successItem(
                '租約 ID',
                contract.contract_id
              )}

              ${successItem(
                '租約期間',
                contract.start_date +
                ' 至 ' +
                contract.end_date
              )}

              ${successItem(
                '手機',
                contract.tenant_phone || tenant.tenant_phone
              )}

              ${successItem(
                'LINE 狀態',
                initiated && renewal ? '待房客簽署' : initiated ? '待房客認領' : renewal ? '沿用既有綁定' : '尚未綁定'
              )}
            </div>

            <div class="invite-box">
              <div class="invite-title">
                ${initiated && renewal ? '傳給房客的新版續約簽署邀請（含確認碼）' : initiated ? '傳給房客的合約邀請（含確認碼）' : renewal ? '傳給房客的續約通知' : '傳給房客的 LINE 綁定訊息'}
              </div>

              ${initiated ? `<div class="invite-qr"><img src="https://quickchart.io/qr?size=220&text=${encodeURIComponent(invite.url)}" alt="房客合約邀請 QR Code" /><span>房客掃描後，請再輸入下方一次性確認碼。QR 只包含邀請連結，不包含登入憑證或個資。</span></div>` : ''}

              <textarea
                id="inviteMessage"
                class="invite-text"
                readonly
              >${safeHtml(invitationMessage)}</textarea>
            </div>

            <div class="success-actions">
              <button
                class="success-button primary"
                type="button"
                onclick="copyInvitation()"
              >
                ${initiated && renewal ? '複製續約簽署邀請' : initiated ? '複製合約邀請' : renewal ? '複製續約通知' : '複製綁定訊息'}
              </button>

              ${initiated ? `<button
                class="success-button secondary"
                type="button"
                onclick="openTenantLiff()"
              >
                開啟房客 LIFF
              </button>` : ''}

              <button
                class="success-button secondary full"
                type="button"
                onclick="goPage('landlord-tenants.html')"
              >
                返回房客名單
              </button>

              <button
                class="success-button secondary full"
                type="button"
                onclick="resetCreatePage()"
              >
                繼續建立另一位房客
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function successItem(
      label,
      value
    ) {
      return `
        <div class="success-item">
          <div class="success-label">
            ${safeHtml(label)}
          </div>

          <div class="success-value">
            ${safeHtml(value || '-')}
          </div>
        </div>
      `;
    }

    async function copyInvitation() {
      const message =
        inputValue(
          'inviteMessage'
        );

      try {
        await navigator.clipboard.writeText(
          message
        );

        showToast(
          '綁定訊息已複製'
        );

      } catch (error) {
        const textarea =
          document.getElementById(
            'inviteMessage'
          );

        textarea.focus();
        textarea.select();

        document.execCommand(
          'copy'
        );

        showToast(
          '綁定訊息已複製'
        );
      }
    }

    function openTenantLiff() {
      const binding =
        CREATED_DATA &&
        CREATED_DATA.binding
          ? CREATED_DATA.binding
          : {};

      const url =
        (CREATED_DATA && CREATED_DATA.invite && CREATED_DATA.invite.url) ||
        binding.tenant_liff_url ||
        PAGE_DATA.tenant_liff_url ||
        '';

      if (!url) {
        showToast(
          '找不到房客 LIFF 網址。',
          true
        );

        return;
      }

      window.open(
        url,
        '_blank',
        'noopener'
      );
    }

    function resetCreatePage() {
      CREATED_DATA =
        null;
      CONTRACT_MODE = 'new';
      PREVIOUS_CONTRACT_ID = '';

      renderPage();
    }

    function renderLoading() {
      document.getElementById(
        'app'
      ).innerHTML = `
        <section class="card loading-card">
          <div class="loading-spinner"></div>
          <div class="loading-title">建立資料載入中</div>
          正在讀取物件、房間與租金設定。
        </section>
      `;
    }

    function renderError(message) {
      document.getElementById(
        'app'
      ).innerHTML = `
        <section class="card error-card">
          <div class="error-title">
            建立資料載入失敗
          </div>

          ${safeHtml(
            message ||
            '未知錯誤'
          )}

          <button
            class="retry-button"
            type="button"
            onclick="loadPage()"
          >
            重新整理
          </button>
        </section>
      `;
    }

    async function loadPage() {
      renderLoading();

      try {
        if (!LINE_USER_ID) {
          const ready =
            await initLine();

          if (!ready) {
            return;
          }
        }

        if (!TEST_MODE && !LANDLORD_REVIEW_SESSION_TOKEN) {
          await initializeLandlordReviewSession();
        }

        const result =
          await jsonpRequest(
            'landlord_tenant_create_init',
            {
              property_id:
                PRESELECTED_PROPERTY_ID,
              room_id:
                PRESELECTED_ROOM_ID,
              previous_contract_id:
                PREVIOUS_CONTRACT_ID
            }
          );

        if (
          !result ||
          result.success !== true
        ) {
          throw new Error(
            result &&
            result.message
              ? result.message
              : '建立資料載入失敗'
          );
        }

        PAGE_DATA =
          result.data || {};

        renderPage();

      } catch (error) {
        renderError(
          error &&
          error.message
            ? error.message
            : String(error)
        );
      }
    }

    setAppHeight();

    window.addEventListener(
      'resize',
      setAppHeight
    );

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        'resize',
        setAppHeight
      );
    }

    document.addEventListener(
      'focusin',
      function (event) {
        const target =
          event.target;

        if (
          !target ||
          !target.matches ||
          !target.matches(
            'input, select, textarea'
          )
        ) {
          return;
        }

        setTimeout(
          function () {
            target.scrollIntoView({
              block: 'center',
              inline: 'nearest'
            });
          },
          250
        );
      }
    );

    loadPage();
  </script>
</body>
</html>
