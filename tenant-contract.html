<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>CMWebs 我的合約</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="frontend-release.js?v=20260902-landlord-led-renewal-checkout-v1"></script>

  <style>
    :root {
      --app-height: 100vh;
      --nav-height: 66px;

      --primary: #06c755;
      --primary-dark: #05a847;
      --primary-soft: #eaf9f0;

      --background: #f4f6f9;
      --surface: #ffffff;
      --text: #222222;
      --muted: #747981;
      --border: #e7eaee;

      --blue: #1a73e8;
      --blue-soft: #eaf2ff;

      --orange: #ef8f00;
      --orange-soft: #fff4dc;

      --purple: #7654c4;
      --purple-soft: #f2edff;

      --danger: #d93025;
      --danger-soft: #fff0ef;

      --shadow: 0 4px 16px rgba(0, 0, 0, 0.065);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--background);
      color: var(--text);
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: var(--app-height);
      margin: 0 auto;
      overflow: hidden;
      background: var(--background);
    }

    .page {
      width: 100%;
      height: 100%;
      padding:
        18px
        15px
        calc(
          var(--nav-height) +
          28px +
          env(safe-area-inset-bottom)
        );
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    .page-header {
      margin-bottom: 15px;
    }

    .page-title {
      margin: 0 0 5px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.4px;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .card {
      padding: 17px;
      margin-bottom: 13px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-title {
      margin-bottom: 12px;
      font-size: 17px;
      font-weight: 900;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .avatar {
      display: flex;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 20px;
      font-weight: 900;
    }

    .profile-content {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.4;
      word-break: break-word;
    }

    .profile-desc {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .status-badge {
      display: inline-flex;
      min-height: 24px;
      padding: 4px 9px;
      align-items: center;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
    }

    .status-active {
      background: var(--primary-soft);
      color: #10893e;
    }

    .status-pending {
      background: var(--orange-soft);
      color: #a76500;
    }

    .status-approved {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .status-rejected {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .status-cancelled,
    .status-completed,
    .status-default {
      background: #f0f2f4;
      color: #666c75;
    }

    .contract-hero {
      position: relative;
      overflow: hidden;
      padding: 18px;
      margin-bottom: 13px;
      border-radius: 18px;
      background:
        linear-gradient(
          145deg,
          #0bb95a 0%,
          #06c755 56%,
          #05aa49 100%
        );
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(6, 199, 85, 0.22);
    }

    .contract-hero::after {
      position: absolute;
      top: -44px;
      right: -38px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      content: "";
    }

    .hero-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .hero-room {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.3;
    }

    .hero-landlord {
      margin-top: 5px;
      font-size: 12px;
      opacity: 0.9;
    }

    .days-box {
      min-width: 82px;
      padding: 10px 11px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.18);
      text-align: center;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .days-value {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .days-label {
      margin-top: 5px;
      font-size: 11px;
      opacity: 0.92;
    }

    .contract-progress {
      position: relative;
      z-index: 1;
      margin-top: 18px;
    }

    .progress-line {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: #ffffff;
      transition: width 0.35s ease;
    }

    .progress-dates {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.95;
    }

    .detail-list {
      margin-top: 2px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-top: 1px solid #eeeeee;
      font-size: 13px;
      line-height: 1.55;
    }

    .detail-row:first-child {
      border-top: none;
    }

    .detail-label {
      flex: 0 0 auto;
      color: var(--muted);
    }

    .detail-value {
      min-width: 0;
      font-weight: 800;
      text-align: right;
      word-break: break-word;
    }

    .money {
      color: #10893e;
    }

    .bank-box {
      padding: 14px;
      border: 1px solid #dcefe3;
      border-radius: 13px;
      background: #f3fcf6;
    }

    .bank-title {
      margin-bottom: 9px;
      color: #10893e;
      font-size: 13px;
      font-weight: 900;
    }

    .bank-account {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.8px;
      word-break: break-all;
    }

    .bank-meta {
      margin-top: 7px;
      color: #607368;
      font-size: 12px;
      line-height: 1.6;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-card {
      width: 100%;
      min-height: 112px;
      padding: 15px 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      text-align: left;
      cursor: pointer;
    }

    .action-card:active {
      opacity: 0.72;
      transform: scale(0.995);
    }

    .action-card:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .action-icon {
      display: flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      margin-bottom: 11px;
      border-radius: 12px;
    }

    .action-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-icon.renewal {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .action-icon.termination {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .action-title {
      font-size: 15px;
      font-weight: 900;
    }

    .action-desc {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .request-card {
      position: relative;
      padding: 15px;
      margin-bottom: 11px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
    }

    .request-card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: var(--blue);
      content: "";
    }

    .request-card.termination::before {
      background: var(--danger);
    }

    .request-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .request-title {
      font-size: 15px;
      font-weight: 900;
    }

    .request-time {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }


    .request-status-hint {
      padding: 10px 12px;
      margin-top: 11px;
      border: 1px solid #e5e9ef;
      border-radius: 11px;
      background: #f8f9fb;
      color: #5c626c;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.6;
    }

    .request-status-hint.pending {
      border-color: #f5dfad;
      background: #fff9e9;
      color: #9a6400;
    }

    .request-status-hint.approved {
      border-color: #cfe0ff;
      background: #f3f7ff;
      color: #315b9b;
    }

    .request-status-hint.completed {
      border-color: #d5eadc;
      background: #f2fbf5;
      color: #237541;
    }

    .request-summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }

    .request-summary-box {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #f8f9fb;
    }

    .request-summary-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .request-summary-value {
      color: #20242a;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.45;
      word-break: break-word;
    }

    .request-section {
      padding: 12px;
      margin-top: 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
    }

    .request-section.approved-terms {
      border-color: #cfe0ff;
      background: #f6f9ff;
    }

    .request-section-title {
      margin-bottom: 9px;
      color: #444a53;
      font-size: 12px;
      font-weight: 900;
    }

    .price-comparison {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .price-compare-box {
      padding: 10px 11px;
      border: 1px solid #e5e8ed;
      border-radius: 10px;
      background: #ffffff;
    }

    .price-compare-title {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .price-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
      color: #5e646d;
      font-size: 11px;
    }

    .price-line strong {
      color: #272b31;
      font-size: 12px;
      white-space: nowrap;
    }

    .price-line.requested {
      color: #10893e;
      font-weight: 900;
    }

    .price-line.requested strong {
      color: #06a94b;
    }

    .approved-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
    }

    .approved-item {
      min-width: 0;
    }

    .approved-label {
      margin-bottom: 4px;
      color: #6980a3;
      font-size: 10px;
      font-weight: 800;
    }

    .approved-value {
      color: #244a83;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.45;
      word-break: break-word;
    }

    .penalty-box {
      padding: 12px;
      margin-top: 11px;
      border: 1px solid #f2dfb6;
      border-radius: 12px;
      background: #fff9e9;
    }

    .penalty-box.charged {
      border-color: #f3c9c5;
      background: #fff4f3;
    }

    .penalty-box.waived,
    .penalty-box.not-applicable {
      border-color: #d8e8de;
      background: #f3fbf6;
    }

    .penalty-title {
      margin-bottom: 5px;
      color: #8b5b00;
      font-size: 12px;
      font-weight: 900;
    }

    .penalty-box.charged .penalty-title {
      color: #b33a30;
    }

    .penalty-box.waived .penalty-title,
    .penalty-box.not-applicable .penalty-title {
      color: #237541;
    }

    .penalty-value {
      color: #3c3f44;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.5;
    }

    .penalty-note {
      margin-top: 6px;
      color: #6c6355;
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .request-reason,
    .landlord-note {
      padding: 12px 13px;
      margin-top: 11px;
      border-radius: 11px;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .request-reason {
      background: #f7f8fa;
      color: #555555;
    }

    .landlord-note {
      border: 1px solid #dbe6ff;
      background: #f4f7ff;
      color: #38517a;
    }

    .box-title {
      margin-bottom: 5px;
      font-weight: 900;
    }

    .btn {
      width: 100%;
      min-height: 44px;
      padding: 11px 13px;
      border: 0;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn:active {
      opacity: 0.72;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-light {
      background: #eef1f5;
      color: #333333;
    }

    .btn-black {
      background: #222222;
      color: #ffffff;
    }

    .btn-danger-soft {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .request-actions {
      margin-top: 12px;
    }

    .empty {
      padding: 38px 18px;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon {
      margin-bottom: 9px;
      font-size: 35px;
    }

    .empty-title {
      color: #444444;
      font-size: 16px;
      font-weight: 900;
    }

    .empty-desc {
      margin-top: 7px;
      font-size: 12px;
      line-height: 1.7;
    }

    .page-actions {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .loading,
    .error-box {
      padding: 42px 20px;
      text-align: center;
    }

    .loading {
      color: var(--muted);
    }

    .error-card {
      padding: 18px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .error-title {
      color: var(--danger);
      font-size: 19px;
      font-weight: 900;
      text-align: left;
    }

    .error-message {
      margin-top: 9px;
      color: #555555;
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-code {
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      background: #f7f8fa;
      color: #777777;
      font-size: 11px;
      text-align: left;
      word-break: break-all;
    }

    /* Modal */

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.48);
    }

    .modal-mask.show {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      max-height: 92dvh;
      padding:
        18px
        18px
        calc(18px + env(safe-area-inset-bottom));
      overflow-y: auto;
      border-radius: 22px 22px 0 0;
      background: #ffffff;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.22);
    }

    .modal-handle {
      width: 40px;
      height: 5px;
      margin: 0 auto 15px;
      border-radius: 999px;
      background: #d9dde2;
    }

    .modal-title {
      font-size: 21px;
      font-weight: 900;
    }

    .modal-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-top: 16px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #444444;
      font-size: 13px;
      font-weight: 900;
    }

    .field-textarea {
      width: 100%;
      min-height: 105px;
      padding: 13px 14px;
      resize: vertical;
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
      color: #222222;
      font-size: 15px;
      line-height: 1.7;
    }

    .field-textarea:focus {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(217, 48, 37, 0.1);
    }

    .char-count {
      margin-top: 6px;
      color: #999999;
      font-size: 12px;
      text-align: right;
    }

    .modal-warning {
      padding: 12px 13px;
      margin-top: 15px;
      border: 1px solid #efd9a7;
      border-radius: 11px;
      background: #fffaf0;
      color: #7c5b00;
      font-size: 12px;
      line-height: 1.7;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .alert-mask {
      position: fixed;
      inset: 0;
      z-index: 1000000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.48);
    }

    .alert-mask.show {
      display: flex;
    }

    .alert-box {
      width: 100%;
      max-width: 350px;
      padding: 22px 18px 16px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
      text-align: center;
    }

    .alert-title {
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: 900;
    }

    .alert-message {
      margin-bottom: 18px;
      color: #555555;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Bottom navigation */

    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 99999;
      width: 100%;
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid #eceff3;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .bottom-nav-inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: var(--nav-height);
    }

    .nav-item {
      position: relative;
      display: flex;
      appearance: none;
      -webkit-appearance: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      border: 0;
      background: transparent;
      color: #8b9098;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 900;
    }

    .nav-item.active::after {
      position: absolute;
      bottom: 5px;
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--primary);
      content: "";
    }

    .nav-item:active {
      opacity: 0.65;
    }

    /* Native signing workflow: intentionally quiet, single-action mobile UI. */
    .signing-page {
      min-height: 100%;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
      background: #ffffff;
    }

    .signing-header {
      padding: 8px 2px 22px;
    }

    .signing-kicker {
      margin-bottom: 8px;
      color: #6b717a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .signing-title {
      margin: 0;
      color: #202124;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
      line-height: 1.24;
    }

    .signing-description {

    .signing-section {

    .signing-summary {

    .signing-summary-item {

    .signing-summary-label {

    .signing-summary-value {

    .contract-history-list {
      display: grid;

    .contract-history-item {

    .contract-history-item.current {

    .contract-history-item-id {

    .contract-history-item-status {

    .contract-history-item-grid {

      min-height: 52px;

      border-radius: 12px;

    @media (max-width: 420px) {

  </style>
</head>

  <!-- 取消申請 Modal -->
  <div id="cancelModal" class="modal-mask">

  <script>
    // ==================================================
    // 基本設定
    // ==================================================

    const API_URL =
      'https://script.google.com/macros/s/AKfycbwnnuIFZ22eO6MxMnWOYHovgMT2xuTbcIgzbq4qmxXE3gjGoTJFcBGXlsNDS-lqr3EILQ/exec';

    const LIFF_ID =
      '2010314940-iJB1D6sN';

    const TENANT_ARTIFACT_MAX_EDGE = 1600;

    const QUERY_PARAMS =
      new URLSearchParams(location.search);

    const TEST_MODE =
      QUERY_PARAMS.get('test') === '1';

    const INVITE_ID =
      rawText(QUERY_PARAMS.get('invite_id')).trim();

    const TENANT_INVITE_FLOW =
      Boolean(INVITE_ID);

    let LINE_USER_ID = '';
    let PAGE_DATA = null;
    let REQUESTS = [];
    let ACTIVE_REQUEST_ID = '';
    let TENANT_SIGNING_SESSION_TOKEN = '';
    let TENANT_SIGNING_MODE = '';
    let TENANT_SIGNING_DATA = null;
    let TENANT_SIGNING_ARTIFACT_STATE = {};
    let TENANT_SIGNING_UPLOAD_STATE = {};
    let TENANT_SIGNATURE_PAD = null;
    let TENANT_SIGNATURE_HAS_STROKE = false;
    let TENANT_SIGNING_SUBMITTING = false;
    let READ_ONLY_CONTRACT_FALLBACK = false;
    let ALERT_CALLBACK = null;

    const app =
      document.getElementById('app');

    // ==================================================
    // 固定畫面高度
    // ==================================================

    function updateAppHeight() {
      const height =
        window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;

      document.documentElement
        .style
        .setProperty(
          '--app-height',
          height + 'px'
        );
    }

    updateAppHeight();

    window.addEventListener(
      'resize',
      updateAppHeight
    );

    if (window.visualViewport) {
      window.visualViewport
        .addEventListener(
          'resize',
          updateAppHeight
        );
    }

    // ==================================================
    // 工具函式
    // ==================================================

    function rawText(value) {
      if (
        value === undefined ||
        value === null
      ) {
        return '';
      }

      return String(value);
    }

    function escapeHtml(value) {
      return rawText(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function safeText(value) {
      const text =
        rawText(value).trim();

      return text
        ? escapeHtml(text)
        : '-';
    }

    function money(value) {
      const number =
        Number(value || 0);

      return (
        'NT$ ' +
        Math.round(
          isFinite(number)
            ? number
            : 0
        ).toLocaleString('zh-TW')
      );
    }

    function getInitial(name) {
      const text =
        rawText(name).trim();

      return text
        ? text.slice(0, 1)
        : '房';
    }

    function dateFromValue(value) {
      if (
        value === undefined ||
        value === null ||
        value === ''
      ) {
        return null;
      }

      if (
        typeof value === 'number' ||
        /^\d{5}(\.\d+)?$/.test(
          rawText(value).trim()
        )
      ) {
        const serial =
          Number(value);

        if (
          isFinite(serial) &&
          serial > 20000 &&
          serial < 100000
        ) {
          return new Date(
            Date.UTC(1899, 11, 30) +
            serial * 86400000
          );
        }
      }

      const text =
        rawText(value).trim();

      if (/^\d{4}-\d{2}$/.test(text)) {
        return new Date(
          text + '-01T12:00:00+08:00'
        );
      }

      const parsed =
        new Date(text);

      return isNaN(parsed.getTime())
        ? null
        : parsed;
    }

    function formatDateOnly(value) {
      const date =
        dateFromValue(value);

      if (!date) {
        return safeText(value);
      }

      return new Intl.DateTimeFormat(
        'en-CA',
        {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }
      ).format(date);
    }

    function formatDateTime(value) {
      const date =
        dateFromValue(value);

      if (!date) {
        return safeText(value);
      }

      return new Intl.DateTimeFormat(
        'zh-TW',
        {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }
      ).format(date);
    }

    function statusText(value) {
      const status =
        rawText(value)
          .trim()
          .toLowerCase();

      const map = {
        active: '有效',
        valid: '有效',
        current: '有效',
        pending: '待處理',
        approved: '已核准',
        rejected: '已駁回',
        cancelled: '已取消',
        completed: '已完成',
        expired: '已到期',
        terminated: '已終止'
      };

      return map[status] || safeText(value);
    }

    function statusClass(value) {
      const status =
        rawText(value)
          .trim()
          .toLowerCase();

      const map = {
        active: 'status-active',
        valid: 'status-active',
        current: 'status-active',
        pending: 'status-pending',
        approved: 'status-approved',
        rejected: 'status-rejected',
        cancelled: 'status-cancelled',
        completed: 'status-completed'
      };

      return map[status] || 'status-default';
    }

    function requestTypeText(value) {
      const type =
        rawText(value)
          .trim()
          .toLowerCase();

      return type === 'renewal'
        ? '續約申請'
        : type === 'termination'
          ? '解約／退租申請'
          : safeText(value);
    }


    function requestStatusText(value) {
      const status =
        rawText(value)
          .trim()
          .toLowerCase();

      const map = {
        pending: '待房東審核',
        approved: '已核准・待完成',
        rejected: '已駁回',
        cancelled: '已取消',
        completed: '已完成'
      };

      return map[status] || statusText(value);
    }

    function requestStatusHint(status) {
      const normalized =
        rawText(status)
          .trim()
          .toLowerCase();

      const map = {
        pending: '申請已送出，正在等待房東審核。審核前仍可取消申請。',
        approved: '房東已核准申請，目前等待雙方完成續約或退租程序。',
        rejected: '房東未核准本次申請，請查看房東說明。',
        cancelled: '此申請已由房客取消，不會再進入審核流程。',
        completed: '本次申請程序已完成，正式合約資料會依完成結果更新。'
      };

      return map[normalized] || '請查看申請內容與目前處理狀態。';
    }

    function terminationTypeText(value) {
      const type =
        rawText(value)
          .trim()
          .toLowerCase();

      const map = {

    function contractProgress(contract) {
      const start =
        dateFromValue(contract.start_date);

      const end =
        dateFromValue(contract.end_date);

      if (!start || !end) {
        return 0;
      }

      const total =
        end.getTime() -
        start.getTime();

      if (total <= 0) {
        return 100;
      }

      const elapsed =
        Date.now() -
        start.getTime();

      return Math.max(
        0,
        Math.min(
          100,
          Math.round(
            elapsed /
            total *
            100
          )
        )
      );
    }

      return String(days);

    function callApi(action, params) {
      return new Promise(
        function (resolve, reject) {
          if (!LINE_USER_ID && !TEST_MODE) {
            reject(
              new Error(
                '缺少房客 LINE User ID'
              )
            );

            return;
          }

          params = params || {};

          const callbackName =
            'cmwebsJsonp_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() *
              1000000
            );

          const script =
            document.createElement(
              'script'
            );

          let finished = false;
          let timer = null;

          function cleanup() {
            if (timer) {
              clearTimeout(timer);
            }

            if (script.parentNode) {
              script.parentNode
                .removeChild(script);
            }

            try {
              delete window[callbackName];
            } catch (error) {
              window[callbackName] =
                undefined;
            }
          }

          window[callbackName] =
            function (json) {
              if (finished) {
                return;
              }

              finished = true;
              cleanup();
              resolve(json || {});
            };

          timer =
            setTimeout(
              function () {
                if (finished) {
                  return;
                }

                finished = true;
                cleanup();

                reject(
                  new Error(
                    'API 載入逾時'
                  )
                );
              },
              30000
            );

          let url =
            API_URL +
            '?v2_action=' +
            encodeURIComponent(action) +
            '&line_user_id=' +
            encodeURIComponent(
              LINE_USER_ID
            ) +
            '&callback=' +
            encodeURIComponent(
              callbackName
            ) +
            '&_=' +
            Date.now();

          Object.keys(params)
            .forEach(
              function (key) {
                const value =
                  params[key];

                if (
                  value === undefined ||
                  value === null
                ) {
                  return;
                }

                url +=
                  '&' +
                  encodeURIComponent(key) +
                  '=' +
                  encodeURIComponent(value);
              }
            );

          if (TEST_MODE) {
            url += '&test=1';
          }

          script.charset = 'UTF-8';

          script.onerror =
            function () {
              console.warn(
                'JSONP script onerror ignored.'
              );
            };

          script.src = url;

          document.body
            .appendChild(script);
        }
      );
    }

    function randomUrlToken(bytes) {
      const value = new Uint8Array(bytes);
      crypto.getRandomValues(value);
      return btoa(String.fromCharCode.apply(null, value))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    async function initializeTenantSigningSession() {
      const idToken = liff.getIDToken();
      if (!idToken) throw new Error('無法取得簽署身分憑證');
      const requestId = randomUrlToken(16);
      const pollSecret = randomUrlToken(32);
      const payload = {
        action: 'tenant_contract_auth_init',
        id_token: idToken,
        request_id: requestId,
        poll_secret: pollSecret
      };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      });

      for (let attempt = 0; attempt < 6; attempt++) {
        await new Promise(function(resolve) { setTimeout(resolve, 500); });
        const result = await callTenantSigningStatus(requestId, pollSecret);
        if (result.code === 'AUTH_EXCHANGE_NOT_FOUND') continue;
        if (!result.success || !result.data || !result.data.session_token) {
          const error = new Error(
            tenantSigningErrorMessage(
              result.code,
              result.message
            )
          );
          error.code = result.code || 'SIGNING_AUTH_FAILED';
          throw error;
        }
        TENANT_SIGNING_SESSION_TOKEN = result.data.session_token;
        const mode = String((result.data.contract || {}).signing_mode || '').toLowerCase();
        TENANT_SIGNING_MODE = ['new_tenant', 'renewal'].indexOf(mode) !== -1 ? mode : '';
        TENANT_SIGNING_DATA = result.data;
        TENANT_SIGNING_ARTIFACT_STATE = result.data.artifact_state || {};
        TENANT_SIGNING_UPLOAD_STATE = {};
        return result;
      }
      throw new Error('簽署身分驗證逾時');
    }

    async function uploadTenantContractArtifact(artifactType, file, idempotencyKey) {
      if (!TENANT_SIGNING_SESSION_TOKEN) throw new Error('簽署身分驗證已失效');
      if (['new_tenant', 'renewal'].indexOf(TENANT_SIGNING_MODE) === -1) {
        throw new Error('簽署模式尚未就緒，請重新驗證');
      }
      const type = String(artifactType || '').toLowerCase();
      const allowed = TENANT_SIGNING_MODE === 'renewal'
        ? ['signature']
        : ['identity_front', 'identity_back', 'signature'];
      if (allowed.indexOf(type) === -1) throw new Error('此簽署流程不允許上傳此附件');
      if (!(file instanceof Blob)) throw new Error('附件格式無效');

      const preparedFile = await prepareTenantContractArtifactFile(file, type);
      const requestId = randomUrlToken(16);
      const pollSecret = randomUrlToken(32);
      const payload = {
        action: 'tenant_contract_artifact_upload_submit',
        request_id: requestId,
        poll_secret: pollSecret,
        session_token: TENANT_SIGNING_SESSION_TOKEN,
        artifact_type: type,
        idempotency_key: idempotencyKey,
        file: {
          mime_type: preparedFile.type,
          base64: await tenantContractArtifactBase64(preparedFile)
        }
      };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      });
      return tenantContractArtifactStatus(requestId, pollSecret);
    }

    async function prepareTenantContractArtifactFile(file, artifactType) {
      const accepted = artifactType === 'signature'
        ? ['image/png']
        : ['image/jpeg', 'image/png'];
      if (accepted.indexOf(String(file.type || '').toLowerCase()) === -1) {
        throw new Error('附件格式不支援');
      }
      if (typeof createImageBitmap !== 'function') {
        throw new Error('此裝置無法安全處理圖片');
      }
      const image = await createImageBitmap(file);
      const scale = Math.min(1, TENANT_ARTIFACT_MAX_EDGE / Math.max(image.width, image.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      const context = canvas.getContext('2d', { alpha: artifactType === 'signature' });
      if (!context) {
        image.close();
        throw new Error('此裝置無法安全處理圖片');
      }
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      image.close();
      const outputType = artifactType === 'signature' ? 'image/png' : 'image/jpeg';
      const output = await new Promise(function(resolve, reject) {
        canvas.toBlob(function(blob) {
          if (blob) resolve(blob);
          else reject(new Error('附件壓縮失敗'));
        }, outputType, outputType === 'image/jpeg' ? 0.82 : undefined);
      });
      if (output.size === 0 || output.size > 2.5 * 1024 * 1024) {
        throw new Error('附件壓縮後仍超過安全上限');
      }
      return output;
    }

    function tenantContractArtifactBase64(file) {
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onerror = function() { reject(new Error('附件讀取失敗')); };
        reader.onload = function() {
          const value = String(reader.result || '');
          const marker = value.indexOf(',');
          if (marker < 0) {
            reject(new Error('附件編碼失敗'));
            return;
          }
          resolve(value.slice(marker + 1));
        };
        reader.readAsDataURL(file);
      });
    }

    function tenantContractArtifactStatus(requestId, pollSecret) {
      let url = API_URL +
        '?v2_action=tenant_contract_artifact_upload_status' +

        '&poll_secret=' + encodeURIComponent(pollSecret) +
        '&_=' + Date.now();
      if (TEST_MODE) url += '&test=1';
      return fetchStatusJson(url);
    }

    function shouldFallbackToReadOnlyContract_(code) {
      const fallbackCodes = [
        'SIGNABLE_CONTRACT_NOT_FOUND',
        'SIGNING_MODE_NOT_READY',
        'LINE_LOGIN_CHANNEL_NOT_CONFIGURED',
        'LIFF_SESSION_SECRET_NOT_CONFIGURED',
        'LINE_TOKEN_VERIFY_FAILED',
        'LINE_TOKEN_CLAIMS_INVALID',
        'TENANT_USER_NOT_ACTIVE',
        'TENANT_MAPPING_NOT_FOUND',
        'WORKSPACE_MEMBERSHIP_INVALID',
        'SIGNING_AUTH_FAILED'
      ];

      return !rawText(code) || fallbackCodes.indexOf(rawText(code)) >= 0;
    }

    function tenantSigningModeTitle() {
      return TENANT_SIGNING_MODE === 'renewal'
        ? '續約合約'
        : '新租客簽約';
    }

    function tenantSigningModeDescription() {
      return TENANT_SIGNING_MODE === 'renewal'
        ? '請確認本次續約條件並完成親筆簽名。既有個資與身分證資料不需要重新提交。'
        : '請依序確認合約內容、上傳必要證件並完成親筆簽名。';
    }

    function tenantSigningUploadCopy(type) {
      const state = TENANT_SIGNING_UPLOAD_STATE[type] || 'idle';
      const copy = {
        idle: ['尚未選擇', ''],
        processing: ['圖片處理中…', ''],
        uploading: ['安全上傳中…', ''],
        success: ['已安全儲存', 'success'],
        error: ['上傳失敗，可重新選擇檔案後再試。', 'error']
      };
      return copy[state] || copy.idle;
    }

    function tenantSigningRequiredArtifacts() {
      return Array.isArray(
        TENANT_SIGNING_DATA && TENANT_SIGNING_DATA.artifact_requirements
      )
        ? TENANT_SIGNING_DATA.artifact_requirements
        : [];
    }

    function tenantSigningStatusLabel() {
      const status = rawText(
        TENANT_SIGNING_DATA && TENANT_SIGNING_DATA.signing_status
      ).toLowerCase();
      if (status === 'submitted') return '已送交簽署資料';
      if (status === 'rejected') return '審核退回，請補正後重新送交';
      return '待您確認';
    }

    function tenantSigningSummaryItem(label, value, className) {
      return `
        <div class="signing-summary-item">
          <div class="signing-summary-label">${escapeHtml(label)}</div>
          <div class="signing-summary-value ${className || ''}">${value}</div>
        </div>
      `;
    }

    function tenantSigningSignatureImageHtml_(signatureImage) {
      const image = signatureImage || {};
      const mimeType = rawText(image.mime_type).toLowerCase();
      const base64 = rawText(image.base64);
      if (
        mimeType !== 'image/png' ||
        !base64 ||
        base64.length > 4 * 1024 * 1024 ||
        base64.length % 4 !== 0 ||
        !/^[A-Za-z0-9+/]+={0,2}$/.test(base64)
      ) {
        return '';
      }
      return `<img class="signing-signature-image" src="data:${mimeType};base64,${base64}" alt="房客親筆簽名" />`;
    }

    function renderTenantSigningTerms_(terms) {
      const content = safeText(terms && terms.content);
      const image = tenantSigningSignatureImageHtml_(terms && terms.signature_image);
      if (!image) return content;
      return content.replace(
        '✅ 親筆簽名圖片已回寫至簽署版 Google 文件',
        image
      );
    }

    function renderTenantContractHistory_(contracts, currentContractId) {
      const rows = Array.isArray(contracts) ? contracts : [];
      if (!rows.length) return '';

      const normalizedCurrentId = rawText(currentContractId).trim();
      return `
        <section class="signing-section contract-history-section">

          <div class="contract-history-list">
            ${rows.map(function (item) {
              const contractId = rawText(item.contract_id).trim();
              const current = item.is_current === true || contractId === normalizedCurrentId;
              const sequence = Number(item.renewal_sequence || 1) || 1;
              const status = rawText(item.tenant_signing_submission_status || item.contract_status).trim().toLowerCase();
              const statusLabel = status === 'approved' || status === 'active'
                ? '已簽署／有效'
                : status === 'submitted'

          <div class="signing-kicker">CMWebs 合約簽署</div>

          <p class="signing-description">${safeText(message)}</p>

    function renderTenantSigningWorkflow() {
      const data = TENANT_SIGNING_DATA || {};

      const terms = contract.terms_document || {};
      const submittedAt = contract.tenant_signing_submitted_at || contract.tenant_signed_at;
      const comparison = contract.renewal_comparison || {};
      const changedItems = Array.isArray(comparison.items)
        ? comparison.items.filter(function(item) { return item.changed === true; })
        : [];
      const summary = [
        tenantSigningSummaryItem('房號', safeText(contract.room_name || tenant.room_name)),
        tenantSigningSummaryItem('租期', safeText(formatDateOnly(contract.start_date)) + '<br>至 ' + safeText(formatDateOnly(contract.end_date))),
        tenantSigningSummaryItem('月租', safeText(money(contract.rent_amount)), 'money'),
        tenantSigningSummaryItem('管理費', safeText(money(contract.management_fee)), 'money'),
        tenantSigningSummaryItem('押金', safeText(money(contract.deposit_amount)), 'money'),
        tenantSigningSummaryItem('繳款日', '每月 ' + safeText(contract.monthly_payment_day || '-') + ' 日')
      ].join('');

      app.className = 'signing-page';
      app.innerHTML = `
        <header class="signing-header">
          <div class="signing-kicker">CMWebs 合約簽署</div>
          <h1 class="signing-title">${tenantSigningModeTitle()}</h1>
          <p class="signing-description">${tenantSigningModeDescription()}</p>
          <div class="signing-status ${submitted ? 'ready' : 'pending'}">${tenantSigningStatusLabel()}</div>
        </header>

        ${submitted ? `
          <section class="signing-section">
            <h2 class="signing-section-title">簽署成功，資料已送交房東審核</h2>
            <p class="signing-section-help">簽署時間：${safeText(formatDateTime(submittedAt))}。簽名圖片與簽署日期已寫入簽署版 Google 文件；這不代表合約已核准或生效，請留意後續通知。</p>
          </section>
        ` : ''}

        ${rejected ? `
          <section class="signing-section">
            <h2 class="signing-section-title">請補正後重新送交</h2>
            <p class="signing-section-help">房東已退回這次簽署資料。您可確認合約內容與附件後再次送交。</p>
            ${contract.tenant_signing_review_note ? `<div class="signing-notice">房東說明：${safeText(contract.tenant_signing_review_note)}</div>` : ''}
          </section>
        ` : ''}

        <section class="signing-section">
          <h2 class="signing-section-title">合約重要摘要</h2>
          <p class="signing-section-help">請先確認下列主要條件。</p>
          <div class="signing-summary">${summary}</div>
        </section>

        ${renderTenantContractHistory_(data.contract_history, contract.contract_id)}

        ${isRenewal ? `
          <section class="signing-section">
            <h2 class="signing-section-title">本次續約的主要變更</h2>
            ${comparison.available ? `
              <div class="signing-diff">
                ${changedItems.length ? changedItems.map(function(item) {
                  return `
                    <div class="signing-diff-row">
                      <div class="signing-diff-label">${safeText(item.label)}</div>
                      <div class="signing-diff-value">${safeText(item.old_value)}</div>
                      <div class="signing-diff-arrow">→</div>
                      <div class="signing-diff-value changed">${safeText(item.new_value)}</div>
                    </div>
                  `;
                }).join('') : '<div class="signing-notice">主要條件沒有異動，請閱讀完整續約合約確認。</div>'}
              </div>
              ${contract.landlord_note ? `<div class="signing-notice">房東補充條件：${safeText(contract.landlord_note)}</div>` : ''}
            ` : `
              <div class="signing-notice warning">${safeText(comparison.message || '續約前一份合約關聯尚未提供，暫時無法確認差異。')}</div>
            `}
          </section>
        ` : ''}

        <section class="signing-section">
          <h2 class="signing-section-title">${submitted ? '完整合約內容（已簽署版）' : '完整合約內容（固定版型）'}</h2>
          ${terms.available ? `
            <details class="signing-details" open>
              <summary>閱讀完整合約與簽署條款</summary>
              <div class="signing-terms-content">${renderTenantSigningTerms_(terms)}</div>
            </details>
          ` : `
            <div class="signing-notice warning">${safeText(terms.message || '完整合約內容尚未提供。')}</div>
          `}
        </section>

        ${!submitted && !isRenewal ? `
          <section class="signing-section">
            <h2 class="signing-section-title">身分證件</h2>
            <p class="signing-section-help">證件只會依後端驗證的簽署模式安全保存，不會顯示公開連結。</p>
            <div class="signing-upload-list">
              ${renderTenantArtifactUpload('identity_front', '身分證正面', '請上傳清晰的 JPG 或 PNG 圖片。')}
              ${renderTenantArtifactUpload('identity_back', '身分證反面', '請上傳清晰的 JPG 或 PNG 圖片。')}
            </div>
          </section>
        ` : ''}

        ${!submitted ? `
          <section class="signing-section">
            <h2 class="signing-section-title">親筆簽名</h2>
            <p class="signing-section-help">請在下方以手指或觸控筆簽名。簽名只在您送交時安全上傳。</p>
            ${TENANT_SIGNING_ARTIFACT_STATE.signature === true ? `
              <div class="signing-notice">親筆簽名已安全儲存，可直接送交簽署資料。</div>
            ` : `
              <div id="tenantSignaturePad" class="signature-pad">
                <canvas id="tenantSignatureCanvas" aria-label="親筆簽名區"></canvas>
                <div class="signature-pad-hint">請在這裡親筆簽名</div>
              </div>
              <div class="page-actions">
                <button class="signing-secondary-button" type="button" onclick="clearTenantSignature()">清除簽名</button>
              </div>
            `}
          </section>

          <section class="signing-section">
            <h2 class="signing-section-title">同意與確認</h2>
            <label class="signing-consent">
              <input id="tenantSigningConsent" type="checkbox" onchange="updateTenantSigningActionState()" />
              <span>我已閱讀並確認以上合約內容與條件，並同意送交本次簽署資料供後續確認。</span>
            </label>
          </section>

          <div class="signing-action">
            <button id="tenantSigningSubmitButton" class="signing-primary-button" type="button" onclick="submitTenantSigningWorkflow()">送交簽署資料</button>
            <div id="tenantSigningActionHint" class="signing-action-hint"></div>
          </div>
        ` : ''}
      `;

      if (!submitted) {
        setupTenantSignaturePad();
        updateTenantSigningActionState();
      }
    }

    async function handleTenantArtifactSelect(type, input) {
      const file = input && input.files ? input.files[0] : null;
      if (!file) return;
      TENANT_SIGNING_UPLOAD_STATE[type] = 'processing';
      renderTenantSigningWorkflow();
      try {
        TENANT_SIGNING_UPLOAD_STATE[type] = 'uploading';
        renderTenantSigningWorkflow();
        const result = await uploadTenantContractArtifact(
          type,
          file,
          randomUrlToken(18)
        );
        if (!result || result.success !== true) {
          throw new Error(tenantSigningErrorMessage(result && result.code, result && result.message));
        }
        TENANT_SIGNING_ARTIFACT_STATE[type] = true;
        TENANT_SIGNING_UPLOAD_STATE[type] = 'success';
      } catch (error) {
        TENANT_SIGNING_UPLOAD_STATE[type] = 'error';
        showAlert(error.message || '附件上傳失敗，請重新選擇檔案後再試。', null, '上傳未完成');
      }
      renderTenantSigningWorkflow();
    }

    function setupTenantSignaturePad() {
      const canvas = document.getElementById('tenantSignatureCanvas');
      const pad = document.getElementById('tenantSignaturePad');
      if (!canvas || !pad) return;
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * ratio));
      canvas.height = Math.max(1, Math.round(rect.height * ratio));
      const context = canvas.getContext('2d');
      if (!context) return;
      context.scale(ratio, ratio);
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.lineWidth = 2.2;
      context.strokeStyle = '#202124';
      let drawing = false;
      let lastPoint = null;

      function point(event) {
        const bounds = canvas.getBoundingClientRect();
        return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
      }

      canvas.addEventListener('pointerdown', function(event) {
        drawing = true;
        lastPoint = point(event);
        TENANT_SIGNATURE_HAS_STROKE = true;
        pad.classList.add('has-signature');
        context.beginPath();
        context.arc(lastPoint.x, lastPoint.y, 1.1, 0, Math.PI * 2);
        context.fillStyle = '#202124';
        context.fill();
        canvas.setPointerCapture(event.pointerId);
        updateTenantSigningActionState();
      });
      canvas.addEventListener('pointermove', function(event) {
        if (!drawing || !lastPoint) return;
        const next = point(event);
        context.beginPath();
        context.moveTo(lastPoint.x, lastPoint.y);
        context.lineTo(next.x, next.y);
        context.stroke();
        lastPoint = next;
      });
      function stopDrawing(event) {
        drawing = false;
        lastPoint = null;
        if (event && canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
      }
      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointercancel', stopDrawing);
      TENANT_SIGNATURE_PAD = canvas;
    }

    function clearTenantSignature() {
      if (!TENANT_SIGNATURE_PAD) return;
      const context = TENANT_SIGNATURE_PAD.getContext('2d');
      context.clearRect(0, 0, TENANT_SIGNATURE_PAD.width, TENANT_SIGNATURE_PAD.height);
      TENANT_SIGNATURE_HAS_STROKE = false;
      const pad = document.getElementById('tenantSignaturePad');
      if (pad) pad.classList.remove('has-signature');
      updateTenantSigningActionState();
    }

    function tenantSignatureBlob() {
      if (!TENANT_SIGNATURE_PAD || !TENANT_SIGNATURE_HAS_STROKE) {
        return Promise.reject(new Error('請先完成親筆簽名。'));
      }
      return new Promise(function(resolve, reject) {
        TENANT_SIGNATURE_PAD.toBlob(function(blob) {
          if (blob && blob.size > 0) resolve(blob);
          else reject(new Error('簽名處理失敗，請重新簽名。'));
        }, 'image/png');
      });
    }

    function tenantSigningReadyToSubmit() {
      const data = TENANT_SIGNING_DATA || {};
      const contract = data.contract || {};
      if (TENANT_SIGNING_SUBMITTING) return { ready: false, hint: '簽署資料處理中，請勿離開此頁。' };
      if (!contract.terms_document || contract.terms_document.available !== true) return { ready: false, hint: '完整合約內容尚未備妥，暫時無法送交。' };
      if (TENANT_SIGNING_MODE === 'renewal' && (!contract.renewal_comparison || contract.renewal_comparison.available !== true)) return { ready: false, hint: '續約條件差異尚未備妥，暫時無法送交。' };
      if (Object.keys(TENANT_SIGNING_UPLOAD_STATE).some(function(type) {
        return ['processing', 'uploading'].indexOf(TENANT_SIGNING_UPLOAD_STATE[type]) >= 0;
      })) return { ready: false, hint: '附件處理中，請稍候。' };
      const required = tenantSigningRequiredArtifacts();
      const missing = required.some(function(type) {
        return TENANT_SIGNING_ARTIFACT_STATE[type] !== true && !(type === 'signature' && TENANT_SIGNATURE_HAS_STROKE);
      });
      if (missing) return { ready: false, hint: '請完成所有必要附件與親筆簽名。' };
      const consent = document.getElementById('tenantSigningConsent');
      if (!consent || consent.checked !== true) return { ready: false, hint: '請先勾選同意確認。' };
      return { ready: true, hint: '送交後將進入後續確認，不代表合約立即生效。' };
    }

    function updateTenantSigningActionState() {
      const button = document.getElementById('tenantSigningSubmitButton');
      const hint = document.getElementById('tenantSigningActionHint');
      if (!button || !hint) return;
      const state = tenantSigningReadyToSubmit();
      button.disabled = !state.ready;
      button.textContent = TENANT_SIGNING_SUBMITTING ? '送交處理中…' : '送交簽署資料';
      hint.textContent = state.hint;
    }

    async function submitTenantSigningWorkflow() {
      const state = tenantSigningReadyToSubmit();
      if (!state.ready) {
        updateTenantSigningActionState();
        return;
      }
      TENANT_SIGNING_SUBMITTING = true;
      updateTenantSigningActionState();
      try {
        if (TENANT_SIGNING_ARTIFACT_STATE.signature !== true) {
          const signature = await tenantSignatureBlob();
          const result = await uploadTenantContractArtifact(
            'signature',
            signature,
            randomUrlToken(18)
          );
          if (!result || result.success !== true) {
            throw new Error(tenantSigningErrorMessage(result && result.code, result && result.message));
          }
          TENANT_SIGNING_ARTIFACT_STATE.signature = true;
          TENANT_SIGNING_UPLOAD_STATE.signature = 'success';
        }
        const result = await submitTenantContractSigning();
        TENANT_SIGNING_DATA.signing_status = result.data && result.data.signing_status || 'submitted';
        const submittedAt = result.data && result.data.submitted_at;
        TENANT_SIGNING_DATA.contract = Object.assign({}, TENANT_SIGNING_DATA.contract || {}, {
          tenant_signing_submission_status: TENANT_SIGNING_DATA.signing_status,
          tenant_signing_submitted_at: submittedAt || (TENANT_SIGNING_DATA.contract && TENANT_SIGNING_DATA.contract.tenant_signing_submitted_at),
          tenant_signed_at: submittedAt || (TENANT_SIGNING_DATA.contract && TENANT_SIGNING_DATA.contract.tenant_signed_at)
        });
        if (result.data && result.data.terms_document) {

        renderTenantSigningWorkflow();
        showAlert(
          '簽署資料已成功送出。\n簽名圖片與簽署日期已寫入簽署版 Google 文件。',

        showAlert(error.message || '簽署送交失敗，請重新驗證後再試。', null, '尚未送交');
      } finally {
        TENANT_SIGNING_SUBMITTING = false;
        updateTenantSigningActionState();
      }
    }

        TENANT_SIGNING_MODE = '';
        TENANT_SIGNING_DATA = null;

    async function submitRenewalIntent(contractId, decision) {
      if (!LINE_USER_ID) {
        showAlert('房客身分尚未完成驗證，請重新整理後再試。');
        return;
      }
      const accepted = decision === 'accepted';
      if (!window.confirm(accepted ? '確認同意這份續約合約嗎？' : '確認回覆暫不續約嗎？')) return;
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({
            v2_action: 'tenant_contract_renewal_intent',
            line_user_id: LINE_USER_ID,
            contract_id: contractId,
            decision: decision
          })
        });
        const result = await response.json();
        if (!result || result.success !== true) {
          const error = new Error(result && result.message ? result.message : '續約意願回覆失敗');
          error.code = result && result.code ? result.code : 'RENEWAL_INTENT_FAILED';
          throw error;
        }
        showAlert(accepted ? '已回覆同意續約' : '已回覆暫不續約', accepted ? '系統已發送正式簽署邀請，請依 LINE 訊息開啟並完成簽署。' : '房東會依你的回覆安排退房流程。', function() { loadPage(false); });
      } catch (error) {
        showAlert(error.message || '續約意願回覆失敗，請重新整理後再試。', null, '回覆未完成');
      }
    }

              onclick="goPage(
                'tenant-home.html'
              )"
            >
              返回首頁
            </button>
          </div>
        </div>
      `;
    }

    function findRequestById(requestId) {
      return (
        REQUESTS.find(
          function (request) {
            return (
              rawText(
                request.request_id
              ).trim() ===
              rawText(requestId).trim()
            );
          }
        ) || null
      );
    }

    // ==================================================
    // 取消申請
    // ==================================================

    function openCancelModal(requestId) {
      const request =
        findRequestById(requestId);

      if (!request) {
        showAlert(
          '找不到指定申請'
        );

        return;
      }

      if (
        rawText(request.status)
          .trim()
          .toLowerCase() !==
        'pending'
      ) {
        showAlert(
          '只有待處理申請可以取消'
        );

        return;
      }

      ACTIVE_REQUEST_ID =
        rawText(requestId).trim();

      document
        .getElementById(
          'cancelSubtitle'
        )
        .textContent =
          requestTypeText(
            request.request_type
          ) +
          '｜申請編號 ' +
          request.request_id;

      document
        .getElementById(
          'cancelReason'
        )
        .value = '';

      updateCancelCount();

      document
        .getElementById(
          'cancelModal'
        )
        .classList
        .add('show');

      document.body
        .classList
        .add('modal-open');
    }

    function closeCancelModal() {
      document
        .getElementById(
          'cancelModal'
        )
        .classList
        .remove('show');

      document.body
        .classList
        .remove('modal-open');

      ACTIVE_REQUEST_ID = '';
    }

    async function submitCancelRequest() {
      const request =
        findRequestById(
          ACTIVE_REQUEST_ID
        );

      if (!request) {
        showAlert(
          '找不到指定申請'
        );

        return;
      }

      const cancelReason =
        document
          .getElementById(
            'cancelReason'
          )
          .value
          .trim();

      if (cancelReason.length > 300) {
        showAlert(
          '取消原因最多 300 字'
        );

        return;
      }

      const button =
        document.getElementById(
          'submitCancelBtn'
        );

      try {
        button.disabled = true;
        button.textContent =
          '取消處理中...';

        const response =
          await callApi(
            'tenant_contract_request_cancel',
            {
              request_id:
                request.request_id,
              cancel_reason:
                cancelReason
            }
          );

        if (
          !response ||
          response.success !== true
        ) {
          throw new Error(
            response &&
            response.message
              ? response.message
              : '取消申請失敗'
          );
        }

        closeCancelModal();

        showAlert(
          response.message ||
          '申請已取消',
          function () {
            loadPage();
          }
        );

      } catch (error) {
        showAlert(
          error.message ||
          String(error)
        );

      } finally {
        button.disabled = false;
        button.textContent =
          '確認取消';
      }
    }

    // ==================================================
    // 提示視窗
    // ==================================================

    function showAlert(
      message,
      callback,
      title
    ) {
      ALERT_CALLBACK =
        typeof callback === 'function'
          ? callback
          : null;

      document
        .getElementById(
          'alertTitle'
        )
        .textContent =
          title || '提示';

      document
        .getElementById(
          'alertMessage'
        )
        .textContent =
          message || '';

      document
        .getElementById(
          'alertModal'
        )
        .classList
        .add('show');
    }

    function closeAlertModal() {
      document
        .getElementById(
          'alertModal'
        )
        .classList
        .remove('show');

      const callback =
        ALERT_CALLBACK;

      ALERT_CALLBACK = null;

      if (callback) {
        callback();
      }
    }

    document
      .getElementById(
        'cancelModal'
      )
      .addEventListener(
        'click',
        function (event) {
          if (event.target === this) {
            closeCancelModal();
          }
        }
      );

    document
      .getElementById(
        'alertModal'
      )
      .addEventListener(
        'click',
        function (event) {
          if (event.target === this) {
            closeAlertModal();
          }
        }
      );

    // ==================================================
    // 載入
    // ==================================================

    async function loadPage() {
      try {
        app.className = 'loading';
        app.innerHTML =
          '合約資料載入中...';

        const response =
          await callApi(
            'tenant_contract_init'
          );

        if (
          response &&
          response.success === true
        ) {
          renderPage(
            response.data || {}
          );

          return;
        }

        if (
          response &&
          response.code ===
            'CONTRACT_NOT_FOUND'
        ) {
          renderNoContract(
            response.data || {},
            response.message ||
              '查無目前有效合約'
          );

          return;
        }

        renderError(
          response &&
          response.message
            ? response.message
            : '合約資料讀取失敗',
          response &&
          response.code
            ? response.code
            : ''
        );

      } catch (error) {
        renderError(
          error.message ||
          String(error),
          'NETWORK_ERROR'
        );
      }
    }

    async function main() {
      try {
        const ready =
          await initLineUserId();

        if (!ready) {
          return;
        }

        if (TENANT_INVITE_FLOW) {
          renderTenantInviteClaimForm();
          return;
        }

        renderTenantSigningLoading();

        try {
          await initializeTenantSigningSession();
          READ_ONLY_CONTRACT_FALLBACK = false;
          renderTenantSigningWorkflow();
        } catch (signingError) {
          if (shouldFallbackToReadOnlyContract_(signingError.code)) {
            READ_ONLY_CONTRACT_FALLBACK = true;
            await loadPage();
            return;
          }

          renderTenantSigningFailure(
            signingError.message ||
              '簽署身分驗證失敗，請重新驗證後再試。',
            signingError.code ||
              'SIGNING_AUTH_FAILED'
          );
        }

      } catch (error) {
        renderError(
          error.message ||
          String(error),
          'LIFF_INIT_ERROR'
        );
      }
    }

    main();
  </script>
</body>
</html>
